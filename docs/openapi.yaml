        expected_version: { type: integer, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 128 }
        active: { type: boolean }
      minProperties: 2
    CustomerWrite:
      type: object
      required: [customer_code, customer_name]
      properties:
        customer_code: { type: string, minLength: 1, maxLength: 64 }
        customer_name: { type: string, minLength: 1, maxLength: 128 }
        department_code: { type: string, maxLength: 64 }
        contact_name: { type: string, maxLength: 128 }
        contact_phone: { type: string, maxLength: 32 }
        active: { type: boolean, default: true }
    CustomerPatch:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 0 }
        customer_name: { type: string, minLength: 1, maxLength: 128 }

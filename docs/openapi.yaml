      required: [id, provider_code, provider_name, provider_type, tracking_sla_minutes, active, version]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        provider_code: { type: string }
        provider_name: { type: string }
        provider_type: { type: string, enum: [JD_WAREHOUSE, THIRD_PARTY] }
        tracking_sla_minutes: { type: integer, minimum: 1 }
        active: { type: boolean }
        version: { type: integer, minimum: 0 }
    FulfillmentProviderPatch:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 0 }
        provider_name: { type: string, minLength: 1 }
        tracking_sla_minutes: { type: integer, minimum: 1 }
        active: { type: boolean }
      minProperties: 2
    ConnectorConfig:
      type: object
      required: [source_channel, client_mode, transport_mode, enabled, version]
      properties:
        source_channel: { $ref: '#/components/schemas/SourceChannel' }
        client_mode: { type: string, enum: [MOCK, REAL], description: Maps to connector_configs.mode. }
        transport_mode: { type: string, enum: [EXCEL, API] }
        enabled: { type: boolean }
        endpoint: { type: string, format: uri, nullable: true }
        credential_configured: { type: boolean }
        version: { type: integer, minimum: 0 }
    ConnectorPatch:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 0 }
        client_mode: { type: string, enum: [MOCK, REAL] }
        transport_mode: { type: string, enum: [EXCEL, API] }
        enabled: { type: boolean }
        endpoint: { type: string, format: uri }
        credential_secret_ref: { type: string, description: Secret manager reference; never return its value. }
      minProperties: 2
    ConnectionTestResult:
      type: object
      required: [success, checked_at]
      properties:
        success: { type: boolean }
        checked_at: { type: string, format: date-time }
        latency_ms: { type: integer, minimum: 0 }
        business_code: { type: string, nullable: true }
        message: { type: string, nullable: true }
    AuditLog:
      type: object
      required: [id, data_scope, operator, actor_type, service, operation, created_at]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        data_scope: { type: string, enum: [BUSINESS, DEMO] }
        operator: { type: string }
        actor_type: { type: string, enum: [HUMAN, AGENT, SYSTEM, EXTERNAL] }
        service: { type: string }
        operation: { type: string }
        order_id: { $ref: '#/components/schemas/Identifier' }
        request_id: { type: string, nullable: true }
        trace_id: { type: string, nullable: true }
        request_payload: { type: object, additionalProperties: true, nullable: true }
        response_payload: { type: object, additionalProperties: true, nullable: true }
        http_status: { type: integer, minimum: 100, maximum: 599, nullable: true }
        business_code: { type: string, nullable: true }
        latency_ms: { type: integer, minimum: 0, nullable: true }
        created_at: { type: string, format: date-time }
    AuditLogPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AuditLog' }
    DashboardSummary:
      type: object
      required: [business_date, order_count, shipped_order_count, pending_review_count, trend, attention]
      properties:
        business_date: { type: string, format: date }
        order_count: { type: integer, minimum: 0 }
        shipped_order_count: { type: integer, minimum: 0 }
        pending_review_count: { type: integer, minimum: 0 }
        trend:
          type: array
          items:
            type: object
            required: [business_date, order_count, shipped_order_count]
            properties:
              business_date: { type: string, format: date }
              order_count: { type: integer, minimum: 0 }
              shipped_order_count: { type: integer, minimum: 0 }
        attention:
          type: array
          items:
            type: object
            required: [reason_code, count, severity]
            properties:
              reason_code: { type: string }
              count: { type: integer, minimum: 0 }
              severity: { type: string, enum: [YELLOW, RED] }
    ChannelMetric:
      type: object
      required: [metric_date, source_channel, order_count, order_line_count, actual_shipped_quantity, canonical_quantity, shipped_quantity, shipment_count, exception_order_count, out_of_stock_order_count, sync_failed_count]
      properties:
        metric_date: { type: string, format: date }
        source_channel: { $ref: '#/components/schemas/SourceChannel' }
        order_count: { type: integer, minimum: 0 }
        order_line_count: { type: integer, minimum: 0 }
        actual_shipped_quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        canonical_quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        shipped_quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        shipment_count: { type: integer, minimum: 0 }
        exception_order_count: { type: integer, minimum: 0 }
        out_of_stock_order_count: { type: integer, minimum: 0 }
        sync_failed_count: { type: integer, minimum: 0 }
    ProductMetric:
      type: object
      required: [metric_date, source_channel, product_id, product_code, product_name, sku_id, sku_code, sku_name, order_count, shipment_count, actual_shipped_quantity, canonical_quantity, shipped_quantity]
      properties:
        metric_date: { type: string, format: date }
        source_channel: { $ref: '#/components/schemas/SourceChannel' }
        category_id: { $ref: '#/components/schemas/Identifier' }
        category_code: { type: string }
        category_name: { type: string }
        product_id: { $ref: '#/components/schemas/Identifier' }
        product_code: { type: string }
        product_name: { type: string }
        sku_id: { $ref: '#/components/schemas/Identifier' }
        sku_code: { type: string }
        sku_name: { type: string }
        order_count: { type: integer, minimum: 0 }
        shipment_count: { type: integer, minimum: 0 }
        actual_shipped_quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        canonical_quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        shipped_quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        source_mappings:
          type: array
          description: Active source SKU and package multipliers for this channel and Canonical SKU.
          items:
            type: object
            required: [source_sku_ref]
            properties:
              source_sku_ref: { type: string }
              source_product_name: { type: string }
              source_specification: { type: string }
              quantity_multiplier: { $ref: '#/components/schemas/DecimalQuantity' }
        jd_sku_codes:
          type: array
          items: { type: string }
    FulfillmentMetric:
      type: object
      required: [metric_date, source_channel, provider_id, provider_code, provider_name, provider_type, fulfillment_count, fulfilled_quantity, not_shipped_count, partially_shipped_count, fully_shipped_count, procurement_ticket_count, out_of_stock_fulfillment_count, awaiting_shipment_count, shipped_shipment_count, awaiting_tracking_count, tracking_received_count, awaiting_sync_count, sync_failed_count, synced_count, shipment_count, shipped_quantity, average_tracking_hours]
      properties:
        metric_date: { type: string, format: date }
        source_channel: { $ref: '#/components/schemas/SourceChannel' }
        provider_id: { $ref: '#/components/schemas/Identifier' }
        provider_code: { type: string }
        provider_name: { type: string }
        provider_type: { type: string, enum: [JD_WAREHOUSE, THIRD_PARTY] }
        fulfillment_count: { type: integer, minimum: 0 }
        fulfilled_quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        not_shipped_count: { type: integer, minimum: 0 }
        partially_shipped_count: { type: integer, minimum: 0 }
        fully_shipped_count: { type: integer, minimum: 0 }
        procurement_ticket_count: { type: integer, minimum: 0 }
        out_of_stock_fulfillment_count: { type: integer, minimum: 0 }
        awaiting_shipment_count: { type: integer, minimum: 0 }
        shipped_shipment_count: { type: integer, minimum: 0 }
        awaiting_tracking_count: { type: integer, minimum: 0 }
        tracking_received_count: { type: integer, minimum: 0 }
        awaiting_sync_count: { type: integer, minimum: 0 }
        sync_failed_count: { type: integer, minimum: 0 }
        synced_count: { type: integer, minimum: 0 }
        shipment_count: { type: integer, minimum: 0 }
        shipped_quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        average_tracking_hours: { type: number, format: double, minimum: 0 }
    DemoScenario:
      type: object
      required: [scenario_code, scenario_name, description]
      properties:
        scenario_code: { type: string }
        scenario_name: { type: string }
        description: { type: string }
    DemoExtractedOrderInput:
      type: object
      required: [confirmed, source, source_ref, customer, receiver, required_delivery_time, items, settlement]
      properties:
        confirmed:
          type: boolean
          enum: [true]
          description: Set only by the explicit human confirmation command in the order assistant.
        source: { type: string, enum: [WECOM] }
        source_ref: { type: string, minLength: 1, maxLength: 128 }
        customer:
          type: object
          required: [customer_name]
          properties:
            customer_name: { type: string, minLength: 1, maxLength: 255 }
            customer_code: { type: string, maxLength: 64, nullable: true }
        receiver:
          type: object
          required: [receiver_name, receiver_phone, address]
          properties:
            receiver_name: { type: string, minLength: 1, maxLength: 128 }
            receiver_phone: { type: string, minLength: 1, maxLength: 64 }
            address: { type: string, minLength: 1, maxLength: 1000 }
        required_delivery_time: { type: string, format: date-time }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [product_name, specification, quantity, unit]
            properties:
              product_name: { type: string, minLength: 1, maxLength: 255 }
              sku_code: { type: string, maxLength: 64, nullable: true }
              specification: { type: string, minLength: 1, maxLength: 255 }
              quantity: { $ref: '#/components/schemas/PositiveDecimalQuantity' }
              unit: { type: string, minLength: 1, maxLength: 32 }
        settlement:
          type: object
          required: [settlement_method, settlement_time]
          properties:
            settlement_method: { type: string, minLength: 1, maxLength: 64 }
            settlement_time: { type: string, format: date-time }
        remark: { type: string, maxLength: 2000, nullable: true }
    DemoRun:
      type: object
      required: [id, run_no, scenario_code, status, data_scope, order_id, started_at]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        run_no: { type: string }
        scenario_code: { type: string }
        status: { type: string, enum: [RUNNING, SUCCEEDED, FAILED] }
        data_scope: { type: string, enum: [DEMO] }
        order_id: { $ref: '#/components/schemas/Identifier' }
        order: { $ref: '#/components/schemas/DemoOrderSummary' }
        timeline:
          type: array
          description: DEMO-only order events ordered by sequence_no
          items: { $ref: '#/components/schemas/OrderEvent' }
        extracted_order: { $ref: '#/components/schemas/DemoExtractedOrderInput' }
        error: { $ref: '#/components/schemas/ApiError' }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
    DemoOrderSummary:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          properties:
            receiver_phone: { type: string }
            receiver_address: { type: string }
            lines:
              type: array
              items:
                type: object
                required: [line_no, product_name, specification, quantity, unit, processing_stage]
                properties:
                  line_no: { type: integer, minimum: 1 }
                  product_name: { type: string }
                  sku_code: { type: string, nullable: true }
                  specification: { type: string }
                  quantity: { $ref: '#/components/schemas/PositiveDecimalQuantity' }
                  unit: { type: string }
                  processing_stage: { type: string, enum: [COMPLETED] }

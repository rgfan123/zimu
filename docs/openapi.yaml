      operationId: updateProviderSkuMapping
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProviderSkuMappingPatch' } } }
      responses:
        '200':
          description: Provider mapping updated for future exports
          content: { application/json: { schema: { $ref: '#/components/schemas/MasterDataRecord' } } }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/provider-sku-mappings/jd-pieces-candidates:
    get:
      tags: [MasterData]
      operationId: listJdPiecesCandidates
      description: >-
        Candidate provider-SKU rows whose per-unit JD factor is still unset, for the
        per-unit import step. Read-only projection; values are applied only through
        the import endpoint below.
      responses:
        '200':
          description: Candidate rows without a per-unit factor
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/provider-sku-mappings/jd-pieces-per-unit-imports:
    post:
      tags: [MasterData]
      operationId: importJdPiecesPerUnit
      description: >-
        Idempotently applies per-unit JD factor values to provider SKU mappings. All rows
        are validated before any write; this endpoint never calls a JD write API.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderSkuJdFactorImport' }
      responses:
        '200':
          description: Applied factor import summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/fulfillment-providers:
    get:
      tags: [MasterData]
      operationId: listFulfillmentProviders
      responses:
        '200':
          description: Fulfillment providers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FulfillmentProvider' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/fulfillment-providers/{provider_id}:
    parameters:
      - $ref: '#/components/parameters/ProviderId'
    get:
      tags: [MasterData]
      operationId: getFulfillmentProvider
      responses:
        '200':
          description: Provider detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FulfillmentProvider' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    patch:
      tags: [MasterData]
      operationId: updateFulfillmentProvider
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FulfillmentProviderPatch' }
      responses:
        '200':
          description: Provider SLA or display fields updated; existing SLA snapshots unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FulfillmentProvider' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/operators:
    get:
      tags: [MasterData]
      operationId: listOperators
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: responsible_team
          in: query
          description: 责任团队精确筛选；服务端统一 trim + 大写归一（如 ORDER_OPS）。
          schema: { type: string, maxLength: 32 }
        - name: query
          in: query
          description: 姓名/企微 userid 模糊检索。
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: 运营人员登记簿（Issue #89）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorPage' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    post:
      tags: [MasterData]
      operationId: createOperator
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatorWrite' }
      responses:
        '201':
          description: 运营人员已登记；wecom_userid 重复 → 409 WECOM_USERID_EXISTS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operator' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/operators/{operator_id}:
    parameters:
      - { name: operator_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    get:
      tags: [MasterData]
      operationId: getOperator
      responses:
        '200':
          description: 运营人员详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operator' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    patch:
      tags: [MasterData]
      operationId: updateOperator
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatorPatch' }
      responses:
        '200':
          description: 运营人员已更新（expected_version 乐观锁；过期版本 → 409 VERSION_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operator' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/operator-team-resolutions:
    get:
      tags: [MasterData]
      operationId: resolveOperatorTeam
      parameters:
        - name: responsible_team
          in: query
          required: true
          description: 责任团队（服务端 trim + 大写归一）；空白 → 422 OPERATOR_TEAM_REQUIRED。
          schema: { type: string, maxLength: 32 }
        - name: require_pushable
          in: query
          required: false
          description: >-
            true 时走 fail-closed 语义：团队存在未绑定 userid 人员或暂无人员等不可全员推送
            情形直接返回 422 OPERATOR_TEAM_NOT_PUSHABLE（消息含未绑定人员名单与运营应对），
            不静默跳过；默认 false = 只读结构化诊断（200）。
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: >-
            责任团队 → active 运营人员/可推送 userid 的只读诊断（Issue #89）：未绑定 userid
            的人员显式列出（unbound_member_names），pushable=false 表示不可全员推送，
            绝不静默过滤；团队无人员为结构化 NO_MEMBERS，不是异常。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorTeamResolution' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/connectors:
    get:
      tags: [Connectors]
      operationId: listConnectors
      responses:
        '200':
          description: Four source-channel connector configurations
          content:

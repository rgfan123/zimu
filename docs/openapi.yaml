        and records an audit summary. Business-group messages are never touched.
      parameters:
        - $ref: '#/components/parameters/Operator'
      responses:
        '200':
          description: Retention cleanup report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionCleanupReport' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/admin/wecom-notifications/deliveries:
    get:
      tags: [Operations]
      operationId: listWecomNotificationDeliveries
      description: >-
        Issue #90 delivery ledger. Each row ties one review/business-event fact to one intended
        recipient and records SENT/BLOCKED/UNKNOWN/FAILED evidence and a stable reason. UNKNOWN
        means submission may already have happened and is never blindly resent.
      parameters:
        - $ref: '#/components/parameters/Operator'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: source_type
          in: query
          schema: { type: string, enum: [REVIEW_CASE, ORDER_EVENT] }
        - name: source_id
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: status
          in: query
          schema:
            type: string
            enum: [SENDING, SENT, RETRY_PENDING, BLOCKED, UNKNOWN, FAILED]
      responses:
        '200':
          description: Traceable delivery outcomes, filterable by source fact and status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageResponseWecomNotificationDelivery' }
        default: { $ref: '#/components/responses/ErrorResponse' }

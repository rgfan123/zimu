        generated_fulfillment_export_ids:
          type: array
          items: { $ref: '#/components/schemas/Identifier' }
        generated_source_return_export_ids:
          type: array
          items: { $ref: '#/components/schemas/Identifier' }
        outbound_routing:
          type: object
          nullable: true
          description: >-
            仅首次确认响应携带（jd-real-sdk-switch 05）：京东 SDK 直连路由的建单发货批次
            （shipment_id 列表）；幂等重放与后续读取不出现。
          properties:
            jd_sdk_shipment_ids:
              type: array
              items: { type: string }
              description: SDK 直连路由的建单发货批次（shipment_id）。
        error_detail: { type: object, additionalProperties: true }
        received_at: { type: string, format: date-time }
        processed_at: { type: string, format: date-time, nullable: true }
    ImportBatchJdOutboundSubmitResult:
      type: object
      required: [submitted_count, skipped_count, items]
      description: >-
        批次内京东履约发货批次的批量 SDK 建单结果（jd-real-sdk-switch 05）。已提交
        （SUBMITTED）的跳过；失败项留痕后可安全重试，重试不重复提交已成功项。
      properties:
        submitted_count: { type: integer, minimum: 0 }
        skipped_count: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: '#/components/schemas/ImportBatchJdOutboundSubmitItem' }
    ImportBatchJdOutboundSubmitItem:
      type: object
      required: [shipment_id]
      description: 单个发货批次的建单结果；成功项与失败项二选一。
      properties:
        shipment_id: { $ref: '#/components/schemas/Identifier' }
        sync_status: { $ref: '#/components/schemas/JdOutboundSyncStatus' }
        erp_delivery_no: { type: string }
        jd_delivery_no: { type: string, nullable: true }
        retry_count: { type: integer, minimum: 0 }
        plan_quantity: { type: integer, minimum: 0 }
        goods_count: { type: integer, minimum: 0 }
        business_code: { type: string }
        message: { type: string }
    RawImportRow:
      type: object
      required: [id, sheet_name, sheet_index, row_index, raw_cells, status]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        sheet_name: { type: string }
        sheet_index: { type: integer, minimum: 0 }
        row_index: { type: integer, minimum: 1 }
        raw_cells:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: array, items: {} }
        source_order_ref: { type: string }
        status: { $ref: '#/components/schemas/RawRowStatus' }
        error_code: { type: string }
        error_detail: { type: object, additionalProperties: true }
        order_id: { $ref: '#/components/schemas/Identifier' }
        order_line_id: { $ref: '#/components/schemas/Identifier' }
        parsed:
          type: object
          description: 渠道模板解析投影（白名单：receiver_name/receiver_phone/receiver_address/product_name/quantity/specification/source_sku_ref），供确认明细核对解析是否正确。
          additionalProperties: { type: string }
        sku_fulfillment:
          type: object
          nullable: true
          description: 来源 SKU 归属的履约方（内部 SKU 主数据）；无有效映射为 null。
          required: [provider_type, provider_name]
          properties:
            provider_type:
              type: string
              enum: [JD_WAREHOUSE, THIRD_PARTY]
            provider_name: { type: string }
            sku_specification:
              type: string
              description: 内部 SKU 主数据规格（来源文件未提供规格时的默认值）。
        jd_cargos:
          type: array
          description: >-
            该来源行将/已发送京东 SDK cargoInfos[].planQuantity 的精确货品清单
            （与建单预览/提交共用同一纯数量换算，不四舍五入不向上取整）；第三方/无京东
            履约行为空数组。血缘遍历 raw_import_row_order_lines 全量分片与礼包组件；
            已提交（shipment_jd_outbounds.submitted_cargo_snapshot）时优先展示冻结的实际提交值。
          items:
            type: object
            required: [product_name, provider_sku_code, plan_quantity]
            properties:
              product_name: { type: string }
              provider_sku_code: { type: string }
              plan_quantity: { type: integer, minimum: 1 }
    RawImportRowPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/RawImportRow' }
    Tracking:
      type: object
      required: [id, logistics_company_code, logistics_company_name, tracking_number, received_at]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        logistics_company_code: { type: string }
        logistics_company_name: { type: string }
        tracking_number: { type: string }
        provider_tracking_batch_id: { $ref: '#/components/schemas/Identifier' }
        received_at: { type: string, format: date-time }
    ShipmentItem:
      type: object
      required: [fulfillment_id, order_line_id, instructed_quantity]
      properties:
        fulfillment_id: { $ref: '#/components/schemas/Identifier' }
        order_line_id: { $ref: '#/components/schemas/Identifier' }
        product_name: { type: string }
        instructed_quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        shipped_quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        unit: { type: string }
    Shipment:
      type: object
      required: [id, shipment_no, order_id, provider_id, outbound_order_no, shipment_sequence, shipment_status, receiver, items, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        shipment_no: { type: string }
        order_id: { $ref: '#/components/schemas/Identifier' }
        provider_id: { $ref: '#/components/schemas/Identifier' }
        outbound_order_no:
          type: string
          pattern: '^[0-9]{12}$'
          description: System-generated Shanghai yyyyMMdd plus four-digit daily atomic sequence.
        shipment_sequence: { type: integer, minimum: 1 }
        shipment_status: { $ref: '#/components/schemas/ShipmentStatus' }
        receiver: { $ref: '#/components/schemas/Receiver' }
        items:
          type: array
          items: { $ref: '#/components/schemas/ShipmentItem' }
        tracking: { $ref: '#/components/schemas/Tracking' }
        jd_outbound:
          allOf:
            - $ref: '#/components/schemas/ShipmentJdOutbound'
          nullable: true
          description: >-
            Shipment-level JD outbound integration record (at most one per Shipment).
            Exposes only diagnostic fields — never credentials, request payloads, or raw PII.
        shipped_at:
          type: string
          format: date-time
          nullable: true
          description: Actual shipment time when supplied; null means the provider did not provide one and is never replaced by receipt or confirmation time.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrderShipmentJdOutbound:
      type: object
      additionalProperties: false
      required: [erp_delivery_no, jd_delivery_no, sync_status, failure_phase, tracking_query_status, updated_at]
      properties:
        erp_delivery_no:
          type: string
          description: Stable merchant-side outbound reference submitted to JD.
        jd_delivery_no:
          type: string
          nullable: true
          description: JD-returned outbound reference; null until JD has accepted the outbound order.
        sync_status: { $ref: '#/components/schemas/JdOutboundSyncStatus' }
        failure_phase:
          type: string
          nullable: true
          enum: [VALIDATION, SUBMIT]
          description: Most recent outbound-create failure phase; tracking failures are represented by tracking_query_status.
        tracking_query_status:
          type: string
          enum: [NOT_QUERIED, PENDING, PARTIAL, TRACKED, CONFLICT, QUERY_FAILED, TERMINAL_REVIEWED]
        updated_at:
          type: string
          format: date-time
          description: Time the JD integration record was most recently updated.
    OrderShipment:
      type: object
      additionalProperties: false
      description: >-
        Shipment facts safe for the CanonicalOrder detail. The presentation state is NOT_CREATED
        when jd_outbound is null; FAILED when sync_status is SYNC_FAILED or tracking_query_status
        is QUERY_FAILED/CONFLICT; REVIEWED when tracking_query_status is TERMINAL_REVIEWED;
        RETURNED when Tracking exists; otherwise SYNCING. The UI compares
        jd_outbound.updated_at, tracking.received_at, and updated_at and shows the newest timestamp.
      required: [id, shipment_no, order_id, provider_id, outbound_order_no, shipment_sequence, shipment_status, items, tracking, jd_outbound, shipped_at, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        shipment_no: { type: string }
        order_id: { $ref: '#/components/schemas/Identifier' }
        provider_id: { $ref: '#/components/schemas/Identifier' }
        outbound_order_no:
          type: string
          pattern: '^[0-9]{12}$'
        shipment_sequence: { type: integer, minimum: 1 }
        shipment_status: { $ref: '#/components/schemas/ShipmentStatus' }
        items:
          type: array
          items: { $ref: '#/components/schemas/ShipmentItem' }
        tracking:
          allOf:
            - $ref: '#/components/schemas/Tracking'
          nullable: true
        jd_outbound:
          allOf:
            - $ref: '#/components/schemas/OrderShipmentJdOutbound'
          nullable: true
        shipped_at:
          type: string
          format: date-time
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ShipmentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Shipment' }
    JdOutboundSyncStatus:
      type: string
      enum: [SUBMITTING, SUBMITTED, SYNC_FAILED]
      description: >-
        JD outbound integration state on the Shipment boundary; separate from the OrderLine
        authoritative processing_stage, which is never written or extended with JD state.
    ShipmentJdOutbound:
      type: object
      required: [erp_delivery_no, sync_status, retry_count, retryable, client_mode]
      properties:
        erp_delivery_no:
          type: string
          description: >-
            Stable merchant-side outbound reference (shipments.outbound_order_no) submitted to
            JD as erpDeliveryNo; never replaced by the JD-returned identifier.
        jd_delivery_no:
          type: string
          nullable: true
          description: JD-returned delivery number when the submission succeeded.
        sync_status: { $ref: '#/components/schemas/JdOutboundSyncStatus' }
        failure_phase:
          type: string
          nullable: true
          enum: [VALIDATION, SUBMIT]
          description: Phase where the last failure occurred; diagnostic only.
        retry_count: { type: integer, minimum: 0 }
        retryable:
          type: boolean
          description: >-
            Server decision for whether the operator may safely retry. False for SUBMITTING,
            SUBMITTED, and RECONCILIATION_REQUIRED failures; the UI must never infer this value.
            Retrying an uncertain SDK outcome first reconciles by stable erpDeliveryNo and never
            blindly issues a second create.
        client_mode:
          type: string
          enum: [UNKNOWN, MOCK, REAL]
          description: >-
            Persisted mode of this outbound attempt; UNKNOWN is retained for pre-migration history.
            An unresolved attempt can only be reconciled in the same mode and is never relabeled by a restart.
        last_error_code:
          type: string
          nullable: true
          description: Stable diagnostic code of the last failure.
        last_error_message:
          type: string
          nullable: true
          description: Human-readable failure detail; never credentials or raw PII.
        submitted_at:
          type: string
          format: date-time
          nullable: true
        tracking_query_status:
          type: string
          enum: [NOT_QUERIED, PENDING, PARTIAL, TRACKED, CONFLICT, QUERY_FAILED, TERMINAL_REVIEWED]
          description: Most recent JD tracking-query outcome; separate from outbound-create sync_status.
        tracking_query_attempt_count: { type: integer, minimum: 0 }
        tracking_last_query_at:
          type: string
          format: date-time
          nullable: true
        tracking_last_error_code:
          type: string
          nullable: true
          description: Sanitized stable code for the most recent failed tracking query.
        tracking_last_error_message:
          type: string
          nullable: true
          description: Sanitized operator-facing diagnostic; never a raw JD response or receiver PII.
        tracking_last_request_id:
          type: string
          nullable: true
          description: Bounded JD request identifier when one was returned.
        updated_at: { type: string, format: date-time }
    ShipmentJdOutboundCommand:
      type: object
      description: >-
        Empty command — the JD request is derived entirely from the Shipment and its
        ShipmentItems; the command itself carries no business fields.
      properties: {}
    OrderFulfillmentRoutingCommand:
      type: object
      required: [expected_order_version]
      properties:
        expected_order_version:
          type: integer
          format: int64
          minimum: 0
          description: 当前订单数据版本；过期请求返回 VERSION_CONFLICT。
    OrderFulfillmentRoutingResult:
      type: object
      required: [order_id, order_version, shipment_ids]
      properties:
        order_id: { $ref: '#/components/schemas/Identifier' }
        order_version: { type: integer, format: int64, minimum: 1 }
        shipment_ids:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Identifier' }
    ShipmentJdOutboundSubmitResult:
      type: object
      required: [shipment_id, erp_delivery_no, outbound_order_no, sync_status, retry_count, plan_quantity, goods_count]
      properties:
        shipment_id: { $ref: '#/components/schemas/Identifier' }
        erp_delivery_no:
          type: string
          description: Stable merchant-side reference sent to JD as erpDeliveryNo.
        jd_delivery_no:
          type: string
          nullable: true
          description: JD-returned delivery number when supplied by the successful response.
        outbound_order_no:
          type: string
          description: Same stable merchant-side reference as erp_delivery_no.
        sync_status:
          type: string
          enum: [SUBMITTED]
        retry_count: { type: integer, minimum: 1 }
        plan_quantity:
          type: integer
          minimum: 1
          description: Total JD piece quantity submitted across all ShipmentItems.
        goods_count:
          type: integer
          minimum: 1
          description: Number of aggregated JD cargo rows submitted for the Shipment.
    ShipmentJdTrackingBackfillResult:
      type: object
      required: [shipment_id, erp_delivery_no, poll_status, retryable]
      properties:
        shipment_id: { $ref: '#/components/schemas/Identifier' }
        erp_delivery_no:
          type: string
          description: Stable merchant-side outbound reference used for querySoOrder.
        poll_status:
          type: string
          enum: [PENDING, PARTIAL, TRACKED, CONFLICT, QUERY_FAILED]
        retryable:
          type: boolean
          description: True only for a failed read result that may be retried with a new idempotency key.
        tracking_number:
          type: string
          nullable: true
          description: Present only after a unique full result was accepted or idempotently replayed.
        review_case_id:
          allOf: [{ $ref: '#/components/schemas/Identifier' }]
          nullable: true
          description: >-
            Present when split/conflicting tracking, Carrier mapping, or a JD terminal exception
            requires human review.
        business_code:
          type: string
          nullable: true
          description: >-
            Sanitized stable code for QUERY_FAILED or CONFLICT, including
            JD_TRACKING_CARRIER_MAPPING_REQUIRED and JD_TRACKING_TERMINAL_EXCEPTION.
    ShipmentJdReceiverAddressCommand:
      type: object
      required: [expected_version, province, city, county, detail_address]
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 0
          description: Current shipment_version from the preview; stale writes fail with VERSION_CONFLICT.
        province: { type: string, minLength: 1, maxLength: 64 }
        city: { type: string, minLength: 1, maxLength: 64 }
        county: { type: string, minLength: 1, maxLength: 64 }
        town:
          type: string
          maxLength: 64
          nullable: true
          description: Optional only when the provider townRequired policy is explicitly false.
        detail_address: { type: string, minLength: 1, maxLength: 255 }
    ShipmentJdReceiverAddressBatchItem:
      type: object
      required: [shipment_id, expected_version, province, city, county, detail_address]
      properties:
        shipment_id: { $ref: '#/components/schemas/Identifier' }
        expected_version:
          type: integer
          format: int64
          minimum: 0
          description: Current shipment_version from the preview; stale writes fail with VERSION_CONFLICT.
        province: { type: string, minLength: 1, maxLength: 64 }
        city: { type: string, minLength: 1, maxLength: 64 }
        county: { type: string, minLength: 1, maxLength: 64 }
        town:
          type: string
          maxLength: 64
          nullable: true
          description: Optional only when the provider townRequired policy is explicitly false.
        detail_address: { type: string, minLength: 1, maxLength: 255 }
    ShipmentJdReceiverAddressBatchCommand:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ShipmentJdReceiverAddressBatchItem' }
    JdReceiverAddressCandidate:
      type: object
      required: [shipment_id, expected_version, receiver_address_snapshot, source_channel, confirmed, confirmed_by, province, city, county, town, detail_address, candidate, candidate_incomplete]
      properties:
        shipment_id: { $ref: '#/components/schemas/Identifier' }
        expected_version:
          type: integer
          format: int64
          minimum: 0
        receiver_address_snapshot: { type: string }
        source_channel: { type: string }
        confirmed: { type: boolean }
        confirmed_by: { type: string, nullable: true }
        province: { type: string, nullable: true }
        city: { type: string, nullable: true }
        county: { type: string, nullable: true }
        town: { type: string, nullable: true }
        detail_address: { type: string, nullable: true }
        candidate:
          type: object
          nullable: true
          description: >-
            Parsed structured address candidate for manual confirmation; null with
            candidate_incomplete=true means source level data is missing and must be filled by hand.
          properties:
            province: { type: string, nullable: true }
            city: { type: string, nullable: true }
            county: { type: string, nullable: true }
            town: { type: string, nullable: true }
            detail_address: { type: string, nullable: true }
        candidate_incomplete: { type: boolean }
    ShipmentJdOutboundPreviewValidation:
      type: object
      required: [path, status, source]
      properties:
        path: { type: string }
        status: { type: string, enum: [PASS, BLOCKED, OMITTED] }
        source:
          type: string
          description: Business fact or approved configuration from which this request field is derived.
        message: { type: string, nullable: true }
    ShipmentJdOutboundPreviewBlocker:
      type: object
      required: [code, path, source, correction_target, message]
      properties:
        code: { type: string }
        path: { type: string }
        source: { type: string }
        correction_target:
          type: string
          description: Business data or master-data surface the operator must correct.
        message: { type: string }
    ShipmentJdOutboundPreview:
      type: object
      required: [shipment_id, shipment_version, erp_delivery_no, request_hash, submittable, request, validations, blockers]
      properties:
        shipment_id: { $ref: '#/components/schemas/Identifier' }
        shipment_version:
          type: integer
          format: int64
          minimum: 0
          description: Version required by the structured receiver-address confirmation command.
        erp_delivery_no:
          type: string
          description: Stable shipments.outbound_order_no; previewing never allocates a new number.
        request_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Stable hash of the internal exact addSoOrder request consumed by submit.
        submittable: { type: boolean }
        request:
          type: object
          additionalProperties: true
          description: >-
            Display-safe addSoOrder request assembled from validated facts. Secret connector
            identifiers such as pin are masked in HTTP output; submit consumes the corresponding
            unmasked internal snapshot. Blocked fields are omitted rather than guessed or rounded.
        validations:
          type: array
          items: { $ref: '#/components/schemas/ShipmentJdOutboundPreviewValidation' }
        blockers:
          type: array
          items: { $ref: '#/components/schemas/ShipmentJdOutboundPreviewBlocker' }
        manual_correction_source:
          type: string
          nullable: true
          description: Original free-text receiver address for human correction only; never auto-split.
    Fulfillment:
      type: object
      required: [id, fulfillment_no, order_line_id, provider_id, requested_quantity, cumulative_shipped_quantity, cancelled_quantity, shipping_progress, outcome, version]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        fulfillment_no: { type: string }
        order_line_id: { $ref: '#/components/schemas/Identifier' }
        provider_id: { $ref: '#/components/schemas/Identifier' }
        requested_quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        cumulative_shipped_quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        cancelled_quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        shipping_progress: { $ref: '#/components/schemas/ShippingProgress' }
        outcome: { $ref: '#/components/schemas/FulfillmentOutcome' }
        exception_code: { type: string }
        exception_reason: { type: string }
        version: { type: integer, format: int64, minimum: 0 }
    FulfillmentDetail:
      allOf:
        - $ref: '#/components/schemas/Fulfillment'
        - type: object
          required: [shipments, procurement_tickets]
          properties:
            shipments:
              type: array
              items: { $ref: '#/components/schemas/Shipment' }
            procurement_tickets:
              type: array
              items: { $ref: '#/components/schemas/ProcurementTicket' }
    ContinuationExportCommand:
      type: object
      required: [expected_version, instructed_quantity, remark]
      properties:
        expected_version: { type: integer, format: int64, minimum: 0 }
        instructed_quantity: { $ref: '#/components/schemas/PositiveDecimalQuantity' }
        remark: { type: string, minLength: 1, maxLength: 1000 }
    ContinuationExport:
      type: object
      required: [fulfillment_id, shipment_id, shipment_sequence, fulfillment_export_id, instructed_quantity, fulfillment_version]
      properties:
        fulfillment_id: { $ref: '#/components/schemas/Identifier' }
        shipment_id: { $ref: '#/components/schemas/Identifier' }
        shipment_sequence: { type: integer, minimum: 2 }
        fulfillment_export_id: { $ref: '#/components/schemas/Identifier' }
        instructed_quantity: { $ref: '#/components/schemas/PositiveDecimalQuantity' }
        fulfillment_version: { type: integer, format: int64, minimum: 1 }
    FulfillmentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Fulfillment' }
    FulfillmentExportLine:
      type: object
      required: [export_line_no, shipment_id, fulfillment_id, order_line_id, outbound_order_no, provider_sku_code, instructed_quantity, unit]
      properties:
        export_line_no: { type: integer, minimum: 1 }
        shipment_id: { $ref: '#/components/schemas/Identifier' }
        fulfillment_id: { $ref: '#/components/schemas/Identifier' }
        order_line_id: { $ref: '#/components/schemas/Identifier' }
        order_line_component_id: { $ref: '#/components/schemas/Identifier' }
        raw_import_row_id: { $ref: '#/components/schemas/Identifier' }
        outbound_order_no: { type: string }
        provider_sku_code: { type: string }
        instructed_quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        unit: { type: string }
        item_amount: { type: string, enum: ['0.00'] }
    DownloadAudit:
      type: object
      required: [download_count]
      properties:
        download_count: { type: integer, minimum: 0 }
        first_downloaded_at: { type: string, format: date-time }
        last_downloaded_at: { type: string, format: date-time }
        last_downloaded_by: { type: string }
    FulfillmentExport:
      type: object
      required: [id, export_batch_no, provider_id, export_kind, template_version, file_sha256, tracking_due_at, generated_at, usage_status, download_audit]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        export_batch_no: { type: string }
        provider_id: { $ref: '#/components/schemas/Identifier' }
        export_kind: { type: string, enum: [JD_WAREHOUSE, THIRD_PARTY] }
        template_version: { type: string }
        file_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        tracking_due_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            权威回传截止（#84）：新第三方导出以企微文件消息成功 ack 时刻 + SLA 快照派生，
            未发送时为 null（UI 不展示假的到期时间）；历史与 JD 导出保持 generated_at 派生语义。
        generated_at: { type: string, format: date-time }
        usage_status: { $ref: '#/components/schemas/ExportUsageStatus' }
        download_audit: { $ref: '#/components/schemas/DownloadAudit' }
        tracking_import_batch_id: { $ref: '#/components/schemas/Identifier' }
        wecom:
          allOf:
            - $ref: '#/components/schemas/FulfillmentExportWecomState'
            - description: 企微出站状态（#84）；仅第三方导出（含历史 LEGACY）存在状态行，JD 导出无此字段。
    FulfillmentExportDetail:
      allOf:
        - $ref: '#/components/schemas/FulfillmentExport'
        - type: object
          required: [lines]
          properties:
            lines:
              type: array
              items: { $ref: '#/components/schemas/FulfillmentExportLine' }
    FulfillmentExportPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/FulfillmentExport' }
    FulfillmentExportWecomState:
      type: object
      required: [status, tracking_sla_minutes, reminder_interval_minutes, reminder_count, version]
      properties:
        status:
          type: string
          enum: [PENDING, ACTIVE, COMPLETED, MANUALLY_STOPPED, FAILED, UNKNOWN, LEGACY]
          description: >-
            PENDING=initial 已入队未发送；ACTIVE=文件消息已 ack（计时起点）；
            COMPLETED=运单已收齐；MANUALLY_STOPPED=人工停止；FAILED=确定性失败（总尝试 2 次后）；
            UNKNOWN=结局未知需人工对账（发送已提交但未获 ack/崩溃遗留）；
            LEGACY=迁移历史导出（不自动发送、不提醒、不可重发/停止）。
        chat_id: { type: string, nullable: true, description: initial 成功发送使用的群快照；提醒永远发到该群 }
        tracking_sla_minutes: { type: integer, minimum: 1 }
        reminder_interval_minutes: { type: integer, minimum: 1 }
        initial_sent_at: { type: string, format: date-time, nullable: true, description: 文件消息服务端 ack 接收时刻（计时起点） }
        tracking_due_at: { type: string, format: date-time, nullable: true }
        next_reminder_at: { type: string, format: date-time, nullable: true, description: null = 暂停/停止/收齐，不再自动提醒 }
        last_reminded_at: { type: string, format: date-time, nullable: true }
        reminder_count: { type: integer, minimum: 0 }
        last_error: { type: string, nullable: true, description: 稳定错误码/可操作消息，无 media_id/config/secret }
        version: { type: integer, minimum: 0 }
        stopped:
          type: object
          nullable: true
          required: [by, reason, at]
          properties:
            by: { type: string }
            reason: { type: string }
            at: { type: string, format: date-time }

        product_code: { type: string, minLength: 1, maxLength: 64 }
        product_name: { type: string, minLength: 1, maxLength: 128 }
        category_id: { $ref: '#/components/schemas/Identifier' }
        ingredients: { type: string, minLength: 1, maxLength: 1000 }
        tags:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 32 }
        listed_from: { type: string, format: date, example: '2026-09-01' }
        listed_until: { type: string, format: date, example: '2026-11-30' }
        lead_time_hours: { type: integer, minimum: 1, description: 发货时效（小时） }
        purchase_price: { $ref: '#/components/schemas/NullableCommercialPrice' }
        retail_price: { $ref: '#/components/schemas/NullableCommercialPrice' }
        other_cost: { $ref: '#/components/schemas/NullableCommercialPrice' }
        main_image_ref: { type: string, maxLength: 512, description: 主图上传返回的受控引用 }
        active: { type: boolean, default: true }
    InitialSkuWrite:
      type: object
      required: [provider_id, specification, unit]
      properties:
        provider_id: { $ref: '#/components/schemas/Identifier' }
        specification: { type: string, minLength: 1, maxLength: 200 }
        unit: { type: string, minLength: 1, maxLength: 32, example: 盒 }
        barcode: { type: string, minLength: 1, maxLength: 64 }
        purchase_price: { $ref: '#/components/schemas/NullableCommercialPrice' }
        retail_price: { $ref: '#/components/schemas/NullableCommercialPrice' }
        active: { type: boolean, default: true }
    ProductWithInitialSkuWrite:
      type: object
      required: [product, sku]
      properties:
        product: { $ref: '#/components/schemas/ProductWrite' }
        sku: { $ref: '#/components/schemas/InitialSkuWrite' }
    ProductPatch:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 0 }
        product_name: { type: string, minLength: 1, maxLength: 128 }
        category_id: { $ref: '#/components/schemas/Identifier' }
        ingredients:
          type: string
          minLength: 1
          maxLength: 1000
          nullable: true
          description: Explicit null clears the ingredients; omission leaves them unchanged.
        tags:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 32 }
          nullable: true
          description: Explicit null clears all tags; omission leaves them unchanged.
        listed_from:
          type: string
          format: date
          nullable: true
          description: Explicit null clears the listing start; omission leaves it unchanged.
        listed_until:
          type: string
          format: date
          nullable: true
          description: Explicit null clears the listing end; omission leaves it unchanged.
        lead_time_hours:
          type: integer
          minimum: 1
          nullable: true
          description: 发货时效（小时）；显式 null 清空，缺省不修改。
        purchase_price:
          allOf: [{ $ref: '#/components/schemas/NullableCommercialPrice' }]
          description: Explicit null clears the purchase price to unknown; omission leaves it unchanged.
        retail_price:
          allOf: [{ $ref: '#/components/schemas/NullableCommercialPrice' }]
          description: Explicit null clears the retail price to unknown; omission leaves it unchanged.
        other_cost:
          allOf: [{ $ref: '#/components/schemas/NullableCommercialPrice' }]
          description: Explicit null clears the other cost to unknown; omission leaves it unchanged.
        main_image_ref:
          type: string
          maxLength: 512
          nullable: true
          description: Explicit null clears the main image; omission leaves it unchanged.
        active: { type: boolean }
      minProperties: 2
    ProductImageUploadResult:
      type: object
      required: [file_ref, url]
      properties:
        file_ref: { type: string, description: 受控引用，写入 products.main_image_ref }
        url: { type: string, description: '可访问 URL（/api/v1/product-images?ref=...）' }
    SkuWrite:
      type: object
      required: [provider_id, product_id, specification, unit]
      properties:
        provider_id: { $ref: '#/components/schemas/Identifier' }
        product_id: { $ref: '#/components/schemas/Identifier' }
        specification: { type: string, minLength: 1, maxLength: 200 }
        unit: { type: string, minLength: 1, maxLength: 32, example: 盒 }
        barcode: { type: string, minLength: 1, maxLength: 64 }
        purchase_price: { $ref: '#/components/schemas/NullableCommercialPrice' }
        retail_price: { $ref: '#/components/schemas/NullableCommercialPrice' }
        active: { type: boolean, default: true }
    BundleItemInput:
      type: object
      additionalProperties: false
      required: [sku_id, quantity_per_bundle]
      properties:
        sku_id: { $ref: '#/components/schemas/Identifier' }
        quantity_per_bundle:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: 每份礼包所需的正整数 SKU 件数。
        emg_code_snapshot: { type: string, maxLength: 64, nullable: true }
        source_text_snapshot: { type: string, maxLength: 255, nullable: true }
    BundleWrite:
      type: object
      additionalProperties: false
      required: [bundle_code, bundle_name, items]
      properties:
        bundle_code: { type: string, minLength: 1, maxLength: 64 }
        bundle_name: { type: string, minLength: 1, maxLength: 200 }
        category_id: { $ref: '#/components/schemas/Identifier' }
        barcode: { type: string, maxLength: 64, nullable: true }
        description: { type: string, nullable: true }
        tax_rate:
          type: string
          nullable: true
          pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$'
          description: 0 到 100 的 decimal string；null 或缺省表示未设置。
        settlement_cost: { $ref: '#/components/schemas/NullableCommercialPrice' }
        status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE], default: DRAFT }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/BundleItemInput' }
    BundlePatch:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: { type: integer, format: int64, minimum: 0 }
        bundle_name:
          type: string
          maxLength: 200
          nullable: true
          description: null 或缺省均表示不修改。
        category_id:
          allOf: [{ $ref: '#/components/schemas/Identifier' }]
          nullable: true
          description: null 或缺省均表示不修改。
        barcode:
          type: string
          maxLength: 64
          nullable: true
          description: 空字符串清空；null 或缺省均表示不修改。
        description:
          type: string
          nullable: true
          description: 空字符串清空；null 或缺省均表示不修改。
        tax_rate:
          type: string
          nullable: true
          pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$'
          description: 0 到 100 的 decimal string；null 或缺省均表示不修改。
        settlement_cost:
          type: string
          nullable: true
          pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$'
          description: null 或缺省均表示不修改；当前接口不提供清空操作。
        status:
          type: string
          enum: [DRAFT, ACTIVE, INACTIVE]
          nullable: true
          description: null 或缺省均表示不修改。
        items:
          type: array
          minItems: 1
          nullable: true
          description: 非空数组表示整表替换组件；null 或缺省表示不修改。
          items: { $ref: '#/components/schemas/BundleItemInput' }
      minProperties: 2
    SkuPatch:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 0 }
        specification: { type: string, minLength: 1, maxLength: 200 }
        barcode: { type: string, minLength: 1, maxLength: 64, nullable: true }
        purchase_price:
          allOf: [{ $ref: '#/components/schemas/NullableCommercialPrice' }]
          description: Explicit null clears the purchase price to unknown; omission leaves it unchanged.
        retail_price:
          allOf: [{ $ref: '#/components/schemas/NullableCommercialPrice' }]
          description: Explicit null clears the retail price to unknown; omission leaves it unchanged.
        active: { type: boolean }
      minProperties: 2
    SourceSkuMappingWrite:
      type: object
      required: [source_channel, source_sku_ref, sku_id, quantity_multiplier]
      properties:
        source_channel: { $ref: '#/components/schemas/SourceChannel' }
        source_sku_ref: { type: string, minLength: 1 }
        source_sku_name: { type: string }
        sku_id: { $ref: '#/components/schemas/Identifier' }
        quantity_multiplier: { $ref: '#/components/schemas/PositiveDecimalQuantity' }
        active: { type: boolean, default: true }
    SourceSkuMappingPatch:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 0 }
        sku_id: { $ref: '#/components/schemas/Identifier' }
        quantity_multiplier: { $ref: '#/components/schemas/PositiveDecimalQuantity' }
        active: { type: boolean }
      minProperties: 2
    ProviderSkuMappingWrite:
      type: object
      required: [provider_id, sku_id, provider_sku_code]
      properties:
        provider_id: { $ref: '#/components/schemas/Identifier' }
        sku_id: { $ref: '#/components/schemas/Identifier' }
        provider_sku_code: { type: string, minLength: 1 }
        provider_sku_name: { type: string }
        merchant_sku_code:
          type: string
          minLength: 1
          description: 商家侧 SKU 标识；京东商品事实中的 erpGoodsNo 与此字段精确核对。
        jd_pieces_per_unit:
          allOf: [{ $ref: '#/components/schemas/PositiveDecimalQuantity' }]
          description: 1 个内部 SKU 销售单位对应的京东库存件数；未配置时不得默认为 1。
        active: { type: boolean, default: true }
    ProviderSkuMappingPatch:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 0 }
        provider_sku_code: { type: string, minLength: 1 }
        provider_sku_name: { type: string }
        merchant_sku_code:
          type: string
          minLength: 1
          description: 商家侧 SKU 标识；用于修复 erpGoodsNo 冲突。
        jd_pieces_per_unit:
          allOf: [{ $ref: '#/components/schemas/PositiveDecimalQuantity' }]
          description: 1 个内部 SKU 销售单位对应的京东库存件数。
        active: { type: boolean }
      minProperties: 2
    ShipmentJdSkuMappingMaintenanceAction:
      type: object
      required: [action, route, api]
      properties:
        action: { type: string, enum: [OPEN_SKU_MAPPING] }
        route: { type: string, enum: [/product/sku-mappings] }
        api: { type: string }
        rerun_api: { type: string }
        provider_id: { $ref: '#/components/schemas/Identifier' }
        sku_id: { $ref: '#/components/schemas/Identifier' }
    ShipmentJdSkuMappingIssue:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    ShipmentJdSkuCheck:
      type: object
      required: [sku_id, sku_code, unit, source_quantity, status, issues, warnings, maintenance_action]
      properties:
        sku_id:
          allOf: [{ $ref: '#/components/schemas/Identifier' }]
          nullable: true
        sku_code: { type: string, nullable: true }
        unit: { type: string, nullable: true }
        source_quantity:
          allOf: [{ $ref: '#/components/schemas/PositiveDecimalQuantity' }]
          nullable: true
        status: { type: string, enum: [PASS, BLOCKED] }
        issues:
          type: array
          items: { $ref: '#/components/schemas/ShipmentJdSkuMappingIssue' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/ShipmentJdSkuMappingIssue' }
        maintenance_action: { $ref: '#/components/schemas/ShipmentJdSkuMappingMaintenanceAction' }
        mapping_id: { $ref: '#/components/schemas/Identifier' }
        goods_no: { type: string }
        pieces_per_unit: { $ref: '#/components/schemas/PositiveDecimalQuantity' }
        exact_plan_quantity: { $ref: '#/components/schemas/PositiveDecimalQuantity' }
        unit_conversion_source: { type: string }
        jd_goods_query_request_id: { type: string }
    ShipmentJdSkuMappingItem:
      type: object
      required: [shipment_item_id, fulfillment_id, order_line_id, line_no, sku_checks]
      properties:
        shipment_item_id: { $ref: '#/components/schemas/Identifier' }
        fulfillment_id: { $ref: '#/components/schemas/Identifier' }
        order_line_id: { $ref: '#/components/schemas/Identifier' }
        line_no: { type: integer, minimum: 1 }
        sku_checks:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ShipmentJdSkuCheck' }
    ShipmentJdSkuMappingReviewCase:
      type: object
      required: [id, case_no, status, reason_code]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        case_no: { type: string }
        status: { type: string, enum: [OPEN, RESOLVED] }
        reason_code: { type: string, enum: [JD_SKU_MAPPING_BLOCKED] }
    ShipmentJdSkuMappingAffectedItem:
      type: object
      required: [shipment_item_id, fulfillment_id, order_line_id, line_no, sku_id, sku_code, issues]
      additionalProperties: false
      properties:
        shipment_item_id: { $ref: '#/components/schemas/Identifier' }
        fulfillment_id: { $ref: '#/components/schemas/Identifier' }
        order_line_id: { $ref: '#/components/schemas/Identifier' }
        line_no: { type: integer, minimum: 1 }
        component_no: { type: integer, minimum: 1 }
        sku_id:
          allOf: [{ $ref: '#/components/schemas/Identifier' }]
          nullable: true
        sku_code: { type: string, nullable: true }
        issues:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ShipmentJdSkuMappingIssue' }
    ShipmentJdSkuMappingGateResult:
      type: object
      required:
        - shipment_id
        - check_run_no
        - gate_status
        - checked_mapping_count
        - blocking_issue_count
        - warning_count
        - local_gate_fingerprint
        - shipment_items
        - affected_shipment_items
        - maintenance_action
      properties:
        shipment_id: { $ref: '#/components/schemas/Identifier' }
        check_run_no: { type: string }
        gate_status: { type: string, enum: [PASSED, BLOCKED] }
        checked_mapping_count: { type: integer, minimum: 0 }
        blocking_issue_count: { type: integer, minimum: 0 }
        warning_count: { type: integer, minimum: 0 }
        local_gate_fingerprint:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Opaque server-side concurrency token for the local SKU/mapping inputs; not proof of remote validity.
        shipment_items:
          type: array
          items: { $ref: '#/components/schemas/ShipmentJdSkuMappingItem' }
        affected_shipment_items:
          type: array
          items: { $ref: '#/components/schemas/ShipmentJdSkuMappingAffectedItem' }
        maintenance_action: { $ref: '#/components/schemas/ShipmentJdSkuMappingMaintenanceAction' }
        review_case: { $ref: '#/components/schemas/ShipmentJdSkuMappingReviewCase' }
    ShipmentJdStockBlocker:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - JD_SKU_MAPPING_GATE_BLOCKED
            - JD_STOCK_QUERY_FAILED
            - JD_STOCK_RESPONSE_INVALID
            - JD_STOCK_RESPONSE_AMBIGUOUS
            - JD_STOCK_TARGET_WAREHOUSE_NOT_OBSERVED
            - JD_STOCK_INSUFFICIENT
        message: { type: string }
    ShipmentJdStockObservation:
      type: object
      additionalProperties: false
      required: [sku_id, goods_no, warehouse_code, required_quantity, quantity_unit, observation_status]
      properties:
        sku_id: { $ref: '#/components/schemas/Identifier' }
        sku_code: { type: string, minLength: 1 }
        product_name: { type: string, minLength: 1 }
        goods_no: { type: string, minLength: 1 }
        warehouse_code: { type: string, minLength: 1 }
        required_quantity:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: 当前出库预览所需的精确京东件数。
        quantity_unit: { type: string, enum: [JD_PIECE] }
        observation_status: { type: string, enum: [OBSERVED, OBSERVED_ZERO, NOT_OBSERVED] }
        stock_quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        usable_quantity: { $ref: '#/components/schemas/DecimalQuantity' }
    ShipmentJdStockReviewCase:
      type: object
      additionalProperties: false
      required: [id, reason_code, status]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        reason_code: { type: string, enum: [JD_STOCK_BLOCKED] }
        status: { type: string, enum: [OPEN] }
    ShipmentJdStockCheckResult:
      type: object
      additionalProperties: false
      required:
        - shipment_id
        - shipment_version
        - preview_hash
        - target_warehouse_code
        - stock_status
        - observation_status
        - observed_at
        - not_reserved
        - blockers
        - items
      properties:
        shipment_id: { $ref: '#/components/schemas/Identifier' }
        shipment_version: { type: integer, format: int64, minimum: 0 }
        preview_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        target_warehouse_code:
          type: string
          minLength: 1
        stock_status: { type: string, enum: [PASSED, BLOCKED] }
        observation_status: { type: string, enum: [OBSERVED, OBSERVED_ZERO, NOT_OBSERVED] }
        observed_at: { type: string, format: date-time }
        not_reserved:
          type: boolean
          enum: [true]
          description: 实时查询结果是建议性事实，不代表京东已预占库存。
        blockers:
          type: array
          items: { $ref: '#/components/schemas/ShipmentJdStockBlocker' }
        items:
          type: array
          items: { $ref: '#/components/schemas/ShipmentJdStockObservation' }
        review_case: { $ref: '#/components/schemas/ShipmentJdStockReviewCase' }
    NullableInventoryDecimal:
      type: string
      nullable: true
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
    InventoryOverviewItem:
      type: object
      additionalProperties: false
      required:
        - provider_id
        - provider_code
        - provider_name
        - provider_type
        - sku_id
        - sku_code
        - product_name
        - specification
        - unit
        - quantity_unit
        - warehouse_code
        - observation_status
        - total_quantity
        - available_quantity
        - unavailable_quantity
        - observed_at
        - observation_age_seconds
        - freshness_status
        - source_type
      properties:
        provider_id: { $ref: '#/components/schemas/Identifier' }
        provider_code: { type: string }
        provider_name: { type: string }
        provider_type: { type: string, enum: [JD_WAREHOUSE, THIRD_PARTY] }
        sku_id: { $ref: '#/components/schemas/Identifier' }
        sku_code: { type: string }
        product_name: { type: string }
        specification: { type: string }
        unit: { type: string }
        quantity_unit:
          type: string
          nullable: true
          enum: [JD_PIECE, INTERNAL_UNIT, UNKNOWN]
        warehouse_code: { type: string, nullable: true }
        observation_status: { type: string, enum: [OBSERVED, NOT_OBSERVED] }
        total_quantity: { $ref: '#/components/schemas/NullableInventoryDecimal' }
        available_quantity: { $ref: '#/components/schemas/NullableInventoryDecimal' }
        unavailable_quantity: { $ref: '#/components/schemas/NullableInventoryDecimal' }
        observed_at: { type: string, format: date-time, nullable: true }
        observation_age_seconds: { type: integer, format: int64, minimum: 0, nullable: true }
        freshness_status: { type: string, enum: [CURRENT, STALE, NOT_OBSERVED] }
        source_type:
          type: string
          nullable: true
          enum: [JD_ISC_QUERY_STOCK, NORMALIZED_PROVIDER_SNAPSHOT, UNKNOWN]
    InventoryCoverage:
      type: object
      additionalProperties: false
      required:
        - provider_count
        - observed_provider_count
        - sku_count
        - observed_sku_count
        - warehouse_count
        - latest_observed_at
        - stale_count
        - oldest_observed_at
        - partial
        - freshness_policy
      properties:
        provider_count: { type: integer, format: int64, minimum: 0 }
        observed_provider_count: { type: integer, format: int64, minimum: 0 }
        sku_count: { type: integer, format: int64, minimum: 0 }
        observed_sku_count: { type: integer, format: int64, minimum: 0 }
        warehouse_count: { type: integer, format: int64, minimum: 0 }
        latest_observed_at: { type: string, format: date-time, nullable: true }
        stale_count:
          type: integer
          format: int64
          minimum: 0
          description: 完整筛选范围内超过 freshness_policy 的已观测行数，不受分页影响。
        oldest_observed_at:
          type: string
          format: date-time
          nullable: true
          description: 完整筛选范围内最早的最新观测时间；无观测时为 null。
        partial: { type: boolean }
        freshness_policy:
          type: string
          pattern: '^P(?!$).+$'
          description: ISO-8601 Duration；当前默认 PT15M。
    InventoryOverviewResponse:
      type: object
      additionalProperties: false
      required: [items, page, size, total_elements, total_pages, coverage]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InventoryOverviewItem' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        total_elements: { type: integer, format: int64, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }
        coverage: { $ref: '#/components/schemas/InventoryCoverage' }
    InventoryDetailContext:
      type: object
      additionalProperties: false
      required:
        - provider_id
        - provider_code
        - provider_name
        - provider_type
        - sku_id
        - sku_code
        - product_name
        - specification
        - unit
        - provider_sku_code
        - warehouse_code
      properties:
        provider_id: { $ref: '#/components/schemas/Identifier' }
        provider_code: { type: string }
        provider_name: { type: string }
        provider_type: { type: string, enum: [JD_WAREHOUSE, THIRD_PARTY] }
        sku_id: { $ref: '#/components/schemas/Identifier' }
        sku_code: { type: string }
        product_name: { type: string }
        specification: { type: string }
        unit: { type: string }
        provider_sku_code: { type: string, nullable: true }
        warehouse_code: { type: string, nullable: true }
    InventoryDetailObservation:
      type: object
      additionalProperties: false
      required:
        - observation_status
        - total_quantity
        - available_quantity
        - unavailable_quantity
        - quantity_unit
        - observed_at
        - observation_age_seconds
        - expires_at
        - freshness_status
        - source_type
        - data_mode
      properties:
        observation_status: { type: string, enum: [OBSERVED, NOT_OBSERVED] }
        total_quantity: { $ref: '#/components/schemas/NullableInventoryDecimal' }
        available_quantity: { $ref: '#/components/schemas/NullableInventoryDecimal' }
        unavailable_quantity: { $ref: '#/components/schemas/NullableInventoryDecimal' }
        quantity_unit:
          type: string
          nullable: true
          enum: [JD_PIECE, INTERNAL_UNIT, UNKNOWN]
        observed_at: { type: string, format: date-time, nullable: true }
        observation_age_seconds: { type: integer, format: int64, minimum: 0, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        freshness_status: { type: string, enum: [CURRENT, STALE, NOT_OBSERVED] }
        source_type:
          type: string
          nullable: true
          enum: [JD_ISC_QUERY_STOCK, NORMALIZED_PROVIDER_SNAPSHOT, UNKNOWN]
        data_mode: { type: string, enum: [CACHED_SNAPSHOT, NO_OBSERVATION] }
    InventoryDetailTool:
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
        code: { type: string }
        label: { type: string }
    InventoryDetailCapability:
      type: object
      additionalProperties: false
      required: [group, label, integration_status, runtime_mode, source_type, explanation, tools]
      properties:
        group: { type: string, enum: [BATCH_AND_SHELF_LIFE, INVENTORY_FLOW, SERIAL_NUMBER] }
        label: { type: string }
        integration_status: { type: string, enum: [INTEGRATED, NOT_INTEGRATED, CONTEXT_MISSING] }
        runtime_mode: { type: string, enum: [REAL, MOCK, UNKNOWN, NOT_APPLICABLE] }
        source_type: { type: string, nullable: true, enum: [JD_ISC_READ_ONLY] }
        explanation: { type: string }
        tools:
          type: array
          items: { $ref: '#/components/schemas/InventoryDetailTool' }
    InventoryDetailsResponse:
      type: object
      additionalProperties: false
      required: [context, observation, query_time, freshness_policy, capabilities]
      properties:
        context: { $ref: '#/components/schemas/InventoryDetailContext' }
        observation: { $ref: '#/components/schemas/InventoryDetailObservation' }
        query_time: { type: string, format: date-time }
        freshness_policy:
          type: string
          pattern: '^P(?!$).+$'
          description: ISO-8601 Duration；当前默认 PT15M。
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/InventoryDetailCapability' }
    FulfillmentProvider:
      type: object
      required: [id, provider_code, provider_name, provider_type, tracking_sla_minutes, active, version, jd_config, wecom_group_chat_id]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        provider_code: { type: string }
        provider_name: { type: string }
        provider_type: { type: string, enum: [JD_WAREHOUSE, THIRD_PARTY] }
        tracking_sla_minutes: { type: integer, minimum: 1 }
        active: { type: boolean }
        version: { type: integer, minimum: 0 }
        wecom_group_chat_id:
          type: string
          nullable: true
          description: >-
            履约方登记的企业微信群 chatid（Issue #83）。chatid 是标识符不是凭据，
            按既有 Provider 投影回显；未登记/已清除为 null。登记在
            fulfillment_providers.config 的 wecomGroupChatId 键，改完即时生效无需重启。
        wecom_reminder_interval_minutes:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10080
          description: >-
            到期未收齐运单的群提醒间隔分钟（Issue #84）；null = 未配置（默认等于
            tracking_sla_minutes）。保存于 fulfillment_providers.config 的
            wecomReminderIntervalMinutes 键，导出生成时快照，改动不追溯既有导出。
        jd_config:
          type: object
          description: >-
            京东标识状态投影（jd-real-sdk-switch 01；05 票新增 outboundMode）。京东履约方包含
            10 个已知键，每项为 {present, value?}；pin 只含 present 不携带明文；
            outboundMode 投影值为 SDK 或 FILE（缺省 FILE）；非京东履约方为空对象。
          additionalProperties:
            type: object
            required: [present]
            properties:
              present: { type: boolean }
              value:
                description: 非敏感键的当前值；pin 与未配置键不出现。
                oneOf:
                  - { type: string }
                  - { type: boolean }
    Operator:
      type: object
      required: [id, display_name, responsible_team, active, version]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        display_name: { type: string, minLength: 1, maxLength: 64 }
        responsible_team: { type: string, minLength: 1, maxLength: 32 }
        wecom_userid:
          type: string
          nullable: true
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9_@.\-]{0,63}$'
          description: 企微 userid；null = 未绑定。非空时全局唯一（409 WECOM_USERID_EXISTS）。
        active: { type: boolean }
        version: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OperatorPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Operator' }
    OperatorWrite:
      type: object
      required: [display_name, responsible_team]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 64 }
        responsible_team:
          type: string
          minLength: 1
          maxLength: 32
          description: >-
            所属责任团队；服务端 trim + 大写归一（ORDER_OPS / CUSTOMER_OPS / SKU_OPS 等）。
            纯空白 → 422 OPERATOR_TEAM_INVALID（字段 responsible_team）。
        wecom_userid:
          type: string
          nullable: true
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9_@.\-]{0,63}$'
          description: >-
            企微 userid（可空 = 未绑定，推送时会由解析 seam 明确提示，不静默跳过）；
            先 trim；非法字符/超长 → 422 OPERATOR_WECOM_USERID_INVALID（字段 wecom_userid）。
        active:
          type: boolean
          description: 缺省 true；停用后解析 seam 不再返回该人员（不做物理删除）。
    OperatorPatch:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 0 }
        display_name: { type: string, minLength: 1, maxLength: 64 }
        responsible_team: { type: string, minLength: 1, maxLength: 32 }
        wecom_userid:
          type: string
          nullable: true
          maxLength: 64
          pattern: '^$|^[A-Za-z0-9][A-Za-z0-9_@.\-]{0,63}$'
          description: >-
            null = 不改动绑定；空串 = 显式清除绑定（pattern 显式允许空串）；
            非空仍须匹配官方保守字符集，先 trim 再查重（同一企微 userid 只映射一个人，
            409 WECOM_USERID_EXISTS）。
        active: { type: boolean }
      minProperties: 2
    OperatorTeamResolution:
      type: object
      required: [responsible_team, members, pushable_user_ids, unbound_member_names, status, pushable]
      properties:
        responsible_team: { type: string }
        members:
          type: array
          items: { $ref: '#/components/schemas/OperatorResolutionMember' }
        pushable_user_ids:
          type: array
          items: { type: string }
          description: >-
            按 members 顺序列出仅已绑定企微 userid 的 active 人员的 userid；
            未绑定人员的姓名在 unbound_member_names。
        unbound_member_names:
          type: array
          items: { type: string }
          description: 未绑定 userid 的人员姓名（显式诊断，绝不静默跳过）。
        status: { type: string, enum: [PUSHABLE, PARTIALLY_BOUND, ALL_UNBOUND, NO_MEMBERS] }
        pushable: { type: boolean, description: false 表示不可全员推送（PUSHABLE 以外状态）。 }
    OperatorResolutionMember:
      type: object
      required: [operator_id, display_name, wecom_userid]
      properties:
        operator_id: { type: integer, format: int64, minimum: 1 }
        display_name: { type: string }
        wecom_userid: { type: string, nullable: true }
    FulfillmentProviderPatch:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 0 }
        provider_name: { type: string, minLength: 1 }
        tracking_sla_minutes: { type: integer, minimum: 1 }
        active: { type: boolean }
        config:
          type: object
          description: >-
            履约方 config 合并写入（jd-real-sdk-switch 01；05 票新增 outboundMode；
            #83 新增 wecomGroupChatId）。京东键仅接受
            sourceNo/warehouseNo/pin/erpShopNo/salesPlatformSource/ownerNo/shopNo/carrierNo/townRequired/outboundMode
            十个键；未知键拒绝（422 FULFILLMENT_PROVIDER_CONFIG_KEY_UNKNOWN）。字符串值必须非空，
            townRequired 只接受布尔（422 FULFILLMENT_PROVIDER_CONFIG_TOWN_REQUIRED_NOT_BOOLEAN），
            outboundMode 只接受 SDK 或 FILE，缺省为 FILE（保持既有导单文件路径）
            （422 FULFILLMENT_PROVIDER_CONFIG_OUTBOUND_MODE_INVALID），
            显式 null 清除该键。customerCode 为客户级字段，由客户档案维护（见
            /api/v1/customers/jd-customer-code-imports）。pin 为敏感值，
            响应与审计只标记存在性。wecomGroupChatId 为企微群 chatid（所有履约方类型
            均可登记；标识符非凭据）：显式 null 清除，非 null 先 trim、空串拒绝、
            最长 128 字符、只接受可见 ASCII（等价正则 ^[\x21-\x7E]{1,128}$，
            不含空白与控制字符）
            （422 FULFILLMENT_PROVIDER_WECOM_GROUP_CHAT_ID_INVALID，字段
            config.wecomGroupChatId）；未登记时 #84 发送侧解析 seam 抛
            422 FULFILLMENT_PROVIDER_WECOM_GROUP_CHAT_MISSING（包含
            「请在履约方配置登记企微群」），不静默不发。wecomReminderIntervalMinutes
            为回传提醒间隔（#84）：1..10080 的整数分钟，显式 null 恢复默认
            （= tracking_sla_minutes）
            （422 FULFILLMENT_PROVIDER_WECOM_REMINDER_INTERVAL_INVALID，字段
            config.wecomReminderIntervalMinutes）。
          additionalProperties:
            nullable: true
            oneOf:
              - { type: string }
              - { type: boolean }
      minProperties: 2
    ConnectorConfig:
      type: object
      required: [source_channel, client_mode, transport_mode, enabled, version]
      properties:
        source_channel: { $ref: '#/components/schemas/SourceChannel' }

          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /internal/v1/orders/{order_id}/revisions:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Internal]
      operationId: reviseInternalOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderRevisionInput' }
      responses:
        '200':
          description: Revision applied, or review created if fulfillment is committed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /internal/v1/procurement/tickets/{ticket_id}/receipts:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    post:
      tags: [Internal, Procurement]
      operationId: recordProcurementReceipt
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProcurementReceiptInput' }
      responses:
        '201':
          description: Append-only procurement receipt recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcurementReceipt' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /demo/v1/scenarios:
    get:
      tags: [Demo]
      operationId: listDemoScenarios
      responses:
        '200':
          description: Fixed demo scenario definitions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DemoScenario' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    post:
      tags: [Demo]
      operationId: runDemoScenario
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario_code]
              properties:
                scenario_code: { type: string, maxLength: 64 }
      responses:
        '201':
          description: Isolated DemoRun completed through mock timeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoRun' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /demo/v1/runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Demo]
      operationId: getDemoRun
      responses:
        '200':
          description: Isolated demo run and order summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoRun' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /demo/v1/extracted-orders:
    post:
      tags: [Demo]
      operationId: runExtractedDemoOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DemoExtractedOrderInput' }
      responses:
        '201':
          description: Human-confirmed AI draft stored and completed as an isolated DemoRun
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoRun' }
        default: { $ref: '#/components/responses/ErrorResponse' }
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Nginx authenticates management, internal, and demo operations; explicitly public connector callbacks use their own signatures.
  headers:
    RequestId:
      description: Request correlation identifier
      schema: { type: string }
  responses:
    ErrorResponse:
      description: Unified business or technical error
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    Sort:
      name: sort
      in: query
      description: Repeatable field,asc or field,desc using an operation allow-list
      schema:
        type: array
        items: { type: string }
      style: form
      explode: true
    DateFrom:
      name: date_from
      in: query
      schema: { type: string, format: date }
    DateTo:
      name: date_to
      in: query
      schema: { type: string, format: date }
    BusinessDate:
      name: business_date
      in: query
      description: Asia/Shanghai natural day; defaults to today
      schema: { type: string, format: date }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 255 }
    Operator:
      name: X-Operator
      in: header
      required: true
      description: Required at the backend seam; the public gateway overwrites this value with the authenticated principal.
      schema: { type: string, minLength: 1, maxLength: 128 }
    OrderId: { name: order_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    BatchId: { name: batch_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    ExportId: { name: export_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    FulfillmentId: { name: fulfillment_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    ShipmentId: { name: shipment_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    CaseId: { name: case_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    AlertId: { name: alert_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    TicketId: { name: ticket_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    CustomerId: { name: customer_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    CategoryId: { name: category_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    ProductId: { name: product_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    SkuId: { name: sku_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    MappingId: { name: mapping_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    ProviderId: { name: provider_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    AuditId: { name: audit_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    ChannelMessageId: { name: channel_message_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    WecomConnectionId:
      name: connection_id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,63}$' }
    WecomMessageSignature:
      name: msg_signature
      in: query
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{40}$' }
    WecomTimestamp:
      name: timestamp
      in: query
      required: true
      schema: { type: string, pattern: '^[0-9]+$' }
    WecomNonce:
      name: nonce
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    RunId: { name: run_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    SourceChannelPath:
      name: source_channel
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SourceChannel' }
  schemas:
    Identifier:
      type: string
      pattern: '^[1-9][0-9]*$'
      example: '42'
    DecimalQuantity:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
      example: '6.000'
    PositiveDecimalQuantity:
      type: string
      pattern: '^(?!0(?:\.0{1,3})?$)(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
      example: '6.000'
    SourceChannel:
      type: string
      enum: [CAISHIXIAN, JUFUBAO, FEIXIANG, WECOM]
    ImportMode:
      type: string
      enum: [NEW, REVISION]
      default: NEW
    ImportBatchStatus:
      type: string
      enum: [RECEIVED, PROCESSING, COMPLETED, COMPLETED_WITH_REVIEW, FAILED]
    RawRowStatus:
      type: string
      enum: [RECEIVED, ACCEPTED, NEED_REVIEW, REJECTED]
    OrderStatus:
      type: string
      enum: [RECEIVED, VALIDATED, SKU_MAPPED, FULFILLING, SHIPPED, SYNCED, CLOSED, NEED_REVIEW, OUT_OF_STOCK, PROCUREMENT_PENDING, FULFILLMENT_EXCEPTION, SYNC_FAILED, CANCELLED]
    ProcessingStage:
      type: string
      enum: [NEED_REVIEW, READY_TO_EXPORT, PROCUREMENT_IN_PROGRESS, WAITING_PROVIDER, TRACKING_RECEIVED, RETURN_FILE_READY, COMPLETED, EXCEPTION]
    ProcessingHealth:
      type: string
      enum: [BLUE, YELLOW, RED, GREEN]
      description: Derived display projection; never accepted by a write command.
    ShippingProgress:
      type: string
      enum: [NOT_SHIPPED, PARTIALLY_SHIPPED, SHIPPED]
    FulfillmentOutcome:
      type: string
      enum: [IN_PROGRESS, FULLY_FULFILLED, PARTIALLY_FULFILLED, CANCELLED]
    ShipmentStatus:
      type: string
      enum: [CREATED, SHIPPED, FAILED, DELIVERED]
    ProcurementStatus:
      type: string
      enum: [PENDING, SUCCESS, PARTIAL, FAILED, CANCELLED]
    ExportUsageStatus:
      type: string
      enum: [GENERATED_NOT_DOWNLOADED, DOWNLOADED_WAITING_RETURN, RETURNED, RETURN_OVERDUE]
    PageMeta:
      type: object
      required: [page, size, total_elements, total_pages]
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        total_elements: { type: integer, format: int64, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    ApiError:
      type: object
      required: [business_code, message, http_status, request_id, trace_id]
      properties:
        business_code: { type: string, maxLength: 64 }
        message: { type: string }
        http_status: { type: integer, minimum: 400, maximum: 599 }
        request_id: { type: string }
        trace_id: { type: string }
        field_errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
        details:
          type: object
          additionalProperties: true
    WecomEncryptedEnvelope:
      type: object
      additionalProperties: false
      required: [encrypt]
      properties:
        encrypt: { type: string, minLength: 1, description: Base64 AES-256-CBC ciphertext }
    WecomEncryptedResponse:
      type: object
      additionalProperties: false
      required: [encrypt, msgsignature, timestamp, nonce]
      properties:
        encrypt: { type: string, minLength: 1 }
        msgsignature: { type: string, pattern: '^[a-f0-9]{40}$' }
        timestamp: { type: string, pattern: '^[0-9]+$' }
        nonce: { type: string, minLength: 1 }
    ChannelMessageSummary:
      type: object
      additionalProperties: false
      required: [id, corp_id, connection_id, bot_id, message_id, chat_id, chat_type, sender_user_id, message_type, content_preview, received_at]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        corp_id: { type: string }
        connection_id: { type: string }
        bot_id: { type: string }
        message_id: { type: string }
        chat_id: { type: string }
        chat_type: { type: string, enum: [group, single] }
        sender_user_id: { type: string }
        message_type: { type: string, enum: [text] }
        content_preview: { type: string }
        received_at: { type: string, format: date-time }
    ChannelMessageDetail:
      type: object
      additionalProperties: false
      required: [id, corp_id, connection_id, bot_id, message_id, chat_id, chat_type, sender_user_id, message_type, content, raw_payload_ref, received_at]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        corp_id: { type: string }
        connection_id: { type: string }
        bot_id: { type: string }
        message_id: { type: string }
        chat_id: { type: string }
        chat_type: { type: string, enum: [group, single] }
        sender_user_id: { type: string }
        message_type: { type: string, enum: [text] }
        content: { type: string }
        quote_type:
          type: string
          nullable: true
          description: Quoted message type when the callback carries quote evidence; the bot protocol does not provide a stable parent message id.
        quote_content: { type: string, nullable: true }
        raw_payload_ref: { type: string, pattern: '^channel-message-payload:[1-9][0-9]*$' }
        received_at: { type: string, format: date-time }
    ChannelMessagePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ChannelMessageSummary' }
    Receiver:
      type: object
      required: [name, phone, address]
      properties:
        name: { type: string, maxLength: 128 }
        phone: { type: string, maxLength: 64 }
        province: { type: string, maxLength: 64 }
        city: { type: string, maxLength: 64 }
        district: { type: string, maxLength: 64 }
        town: { type: string, maxLength: 64 }
        address: { type: string, maxLength: 1000 }
    Settlement:
      type: object
      required: [method, settlement_time]
      properties:
        method: { type: string, enum: [MONTHLY, IMMEDIATE, CREDIT_TERM, PREPAID, COD, OTHER] }
        settlement_time: { type: string, format: date-time }
    BundleComponentInput:
      type: object
      required: [product_name, specification, unit, quantity_per_bundle]
      properties:
        sku_code: { type: string, maxLength: 64 }
        source_sku_ref: { type: string, maxLength: 128 }
        product_name: { type: string, maxLength: 255 }
        specification: { type: string, maxLength: 255 }
        unit: { type: string, maxLength: 32 }
        quantity_per_bundle: { $ref: '#/components/schemas/PositiveDecimalQuantity' }
    OrderItemInput:
      type: object
      required: [line_type, product_name, specification, unit, quantity]
      properties:
        source_line_ref: { type: string, maxLength: 128 }
        line_type: { type: string, enum: [SINGLE, CUSTOM_BUNDLE] }
        sku_code: { type: string, maxLength: 64 }
        source_sku_ref: { type: string, maxLength: 128 }
        product_name: { type: string, maxLength: 255 }
        specification: { type: string, maxLength: 255 }
        unit: { type: string, maxLength: 32 }
        quantity: { $ref: '#/components/schemas/PositiveDecimalQuantity' }
        components:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/BundleComponentInput' }
      description: components is required only for CUSTOM_BUNDLE and forbidden for SINGLE.
    CanonicalOrderInput:
      type: object
      required: [source, source_ref, customer, receiver, items, settlement]
      properties:
        source: { $ref: '#/components/schemas/SourceChannel' }
        source_ref: { type: string, maxLength: 255 }
        source_version: { type: string, maxLength: 64 }
        customer:
          type: object
          required: [source_customer_ref, name]
          properties:
            customer_code: { type: string, maxLength: 64 }
            source_customer_ref: { type: string, maxLength: 128 }
            name: { type: string, maxLength: 255 }
        receiver: { $ref: '#/components/schemas/Receiver' }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItemInput' }
        settlement: { $ref: '#/components/schemas/Settlement' }
        remark: { type: string, maxLength: 2000 }
        evidence_refs:
          type: array
          items: { type: string, maxLength: 1000 }
    InternalOrderInput:
      allOf:
        - $ref: '#/components/schemas/CanonicalOrderInput'
        - type: object
          properties:
            source: { type: string, enum: [WECOM] }
    OrderRevisionInput:
      allOf:
        - $ref: '#/components/schemas/InternalOrderInput'
        - type: object
          required: [source_version, expected_version]
          properties:
            expected_version: { type: integer, format: int64, minimum: 0 }
            change_reason: { type: string, minLength: 1, maxLength: 255 }
    OrderLine:
      type: object
      required: [id, line_no, line_type, product_name, specification, unit, requested_quantity, processing_stage]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        line_no: { type: integer, minimum: 1 }
        line_type: { type: string, enum: [SINGLE, CUSTOM_BUNDLE] }
        sku_id: { $ref: '#/components/schemas/Identifier' }
        sku_code: { type: string }
        provider_id: { $ref: '#/components/schemas/Identifier' }
        product_name: { type: string }
        specification: { type: string }
        unit: { type: string }
        source_quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        mapping_multiplier: { $ref: '#/components/schemas/DecimalQuantity' }
        requested_quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        processing_stage: { $ref: '#/components/schemas/ProcessingStage' }
        exception_code: { type: string }
        components:
          type: array
          items: { $ref: '#/components/schemas/OrderLineComponent' }
    OrderLineComponent:
      type: object
      required: [id, sku_id, product_name, specification, unit, quantity_per_bundle, total_quantity]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        sku_id: { $ref: '#/components/schemas/Identifier' }
        product_name: { type: string }
        specification: { type: string }
        unit: { type: string }
        quantity_per_bundle: { $ref: '#/components/schemas/DecimalQuantity' }
        total_quantity: { $ref: '#/components/schemas/DecimalQuantity' }
    OrderSummary:
      type: object
      required: [id, order_no, source_channel, order_status, processing_stage, processing_health, completed_count, total_count, created_at, version]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        order_no: { type: string }
        source_channel: { $ref: '#/components/schemas/SourceChannel' }
        source_ref: { type: string }
        customer_id: { $ref: '#/components/schemas/Identifier' }
        customer_name: { type: string }
        receiver_name: { type: string }
        order_status: { $ref: '#/components/schemas/OrderStatus' }
        processing_stage: { $ref: '#/components/schemas/ProcessingStage' }
        processing_health: { $ref: '#/components/schemas/ProcessingHealth' }
        completed_count: { type: integer, minimum: 0 }
        total_count: { type: integer, minimum: 1 }
        attention_reason: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          required: [receiver, settlement, lines, review_cases]
          properties:
            receiver: { $ref: '#/components/schemas/Receiver' }
            settlement: { $ref: '#/components/schemas/Settlement' }
            remark: { type: string }
            lines:
              type: array
              items: { $ref: '#/components/schemas/OrderLine' }
            review_cases:
              type: array
              items: { $ref: '#/components/schemas/ReviewCase' }
    OrderPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/OrderSummary' }
    OrderEvent:
      type: object
      required: [id, sequence_no, event_type_code, operator, payload, created_at]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        sequence_no: { type: integer, format: int64, minimum: 1 }
        event_type_code: { type: string }
        order_line_id: { $ref: '#/components/schemas/Identifier' }
        fulfillment_id: { $ref: '#/components/schemas/Identifier' }
        shipment_id: { $ref: '#/components/schemas/Identifier' }
        procurement_ticket_id: { $ref: '#/components/schemas/Identifier' }
        operator: { type: string }
        payload: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    OrderVersion:
      type: object
      required: [version_no, change_reason, triggered_by, snapshot, created_at]
      properties:
        version_no: { type: integer, format: int64, minimum: 1 }
        source_version: { type: string }
        change_reason: { type: string }
        triggered_by: { type: string }
        snapshot: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    CorrectionOrderCommand:
      type: object
      required: [expected_version, reason, corrected_order]
      properties:
        expected_version: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 255 }
        corrected_order: { $ref: '#/components/schemas/CanonicalOrderInput' }
    ProviderSkuMappingReferencePreview:
      type: object
      required: [reference_sha256, source_sha256, source_channel, summary, reference_quality, rows]
      properties:
        reference_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        source_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        source_channel: { $ref: '#/components/schemas/SourceChannel' }
        summary:
          type: object
          required: [total, matched, need_review, conflict]
          properties:
            total: { type: integer, minimum: 0 }
            matched: { type: integer, minimum: 0 }
            need_review: { type: integer, minimum: 0 }
            conflict: { type: integer, minimum: 0 }
        reference_quality:
          type: object
          required: [provider_sku_count, blank_provider_codes, duplicate_provider_codes, conflicting_source_names, bundle_count, ambiguous_bundle_rows]
          properties:
            provider_sku_count: { type: integer, minimum: 0 }
            blank_provider_codes: { type: integer, minimum: 0 }
            duplicate_provider_codes: { type: integer, minimum: 0 }
            conflicting_source_names: { type: integer, minimum: 0 }
            bundle_count: { type: integer, minimum: 0 }
            ambiguous_bundle_rows:
              type: integer
              minimum: 0
              description: Rows with component-like fields but no attributable bundle name; never auto-imported
        rows:
          type: array
          items: { $ref: '#/components/schemas/ProviderSkuMappingReferenceRow' }
    ProviderSkuMappingReferenceRow:
      type: object
      required: [sheet_name, sheet_index, row_index, source_sku_ref, source_product_name, source_quantity, match_status, reason_code, reason, bundle_components]
      properties:
        sheet_name: { type: string }
        sheet_index: { type: integer, minimum: 0 }
        row_index: { type: integer, minimum: 1 }
        source_sku_ref: { type: string }
        source_product_name: { type: string }
        source_quantity: { type: string }
        match_status: { type: string, enum: [MATCHED, NEED_REVIEW, CONFLICT] }
        reason_code:
          type: string
          enum: [EXACT_NAME_MATCH, NO_EXACT_NAME_MATCH, SOURCE_SKU_NAME_CONFLICT, REFERENCE_MAPPING_CONFLICT]
        reason: { type: string }
        quantity_multiplier: { type: string, pattern: '^\\d+(\\.\\d{3})$' }
        provider_sku_code: { type: string }
        provider_sku_name: { type: string }
        bundle_components:
          type: array
          items:
            type: object
            required: [provider_sku_code, quantity_per_bundle]
            properties:
              provider_sku_code: { type: string }
              provider_sku_name: { type: string }
              quantity_per_bundle: { type: string, pattern: '^\\d+(\\.\\d{3})$' }
    ImportBatch:
      type: object
      required: [id, batch_no, batch_type, import_mode, template_family, template_version, original_file_name, content_sha256, status, row_counts, received_at]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        batch_no: { type: string }
        batch_type: { type: string, enum: [SOURCE_ORDER, PROVIDER_TRACKING] }
        import_mode: { $ref: '#/components/schemas/ImportMode' }
        parent_import_batch_id: { $ref: '#/components/schemas/Identifier' }
        revision_no: { type: integer, minimum: 1 }

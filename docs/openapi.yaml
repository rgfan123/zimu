            不能与既有客户冲突（409 JD_CUSTOMER_CODE_EXISTS），变更以审计记录留痕（含变更前值）。
      minProperties: 2
    CustomerJdCodeImport:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CustomerJdCodeImportRow' }
      description: >-
        京东客户编码批量导入（jd-real-sdk-switch 02）。逐行显式报错、可重复执行
        （同值重复导入返回 SKIPPED）、不静默覆盖既有编码；错误码：
        CUSTOMER_JD_CODE_IMPORT_INVALID_ROW / DUPLICATE_ROW / CUSTOMER_UNKNOWN / CONFLICT。
    CustomerJdCodeImportRow:
      type: object
      required: [customer_code, jd_customer_code]
      properties:
        customer_code: { type: string, minLength: 1, maxLength: 64 }
        jd_customer_code: { type: string, minLength: 1, maxLength: 64 }
    CustomerJdCodeImportResult:
      type: object
      required: [accepted_count, skipped_count, rows]
      properties:
        accepted_count: { type: integer, minimum: 0 }
        skipped_count: { type: integer, minimum: 0 }
        rows:
          type: array
          items:
            type: object
            required: [customer_code, jd_customer_code, status]
            properties:
              customer_code: { type: string }
              jd_customer_code: { type: string }
              status: { type: string, enum: [ACCEPTED, SKIPPED] }
    ProductWrite:
      type: object
      required: [product_code, product_name, category_id]

        product_name: { type: string }
        sku_id: { $ref: '#/components/schemas/Identifier' }
        sku_code: { type: string }
        sku_name: { type: string }
        order_count: { type: integer, minimum: 0 }
        shipment_count: { type: integer, minimum: 0 }

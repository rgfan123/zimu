  /api/v1/fulfillment-exports/{export_id}/wecom-stop:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    post:
      tags: [Exports, WeCom]
      operationId: stopFulfillmentExportWecom
      description: >-
        人工停止该导出的企微自动发送与周期提醒（#84）。版本 CAS（409 VERSION_CONFLICT，
        expected_version 必填，缺失 400 VALIDATION_ERROR）、理由必填（422
        WECOM_STOP_REASON_REQUIRED）；已 COMPLETED/MANUALLY_STOPPED 再停
        幂等 no-op 返回现状；LEGACY 明确拒绝（422 WECOM_EXPORT_LEGACY）。停止持久化
        operator/reason/time、清 next_reminder，不删除历史 delivery；已入队的发送/提醒
        任务执行时幂等跳过。认证与幂等沿用既有写接口（Basic Auth + X-Operator 复核 +
        Idempotency-Key）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WecomExportStopCommand' }
      responses:
        '200':
          description: 停止成功（或已停止/已收齐的幂等现状），返回完整企微状态投影。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FulfillmentExportWecomState' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/fulfillment-exports/{export_id}/wecom-resend:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    post:
      tags: [Exports, WeCom]
      operationId: resendFulfillmentExportWecom
      description: >-
        人工重发企微文件消息（#84）：只生成新的可追溯 INITIAL delivery（sequence=max+1）
        与 async task（202），HTTP 线程不直接发送；发送成功后 sent_at/due/提醒时间线以
        新 ack 重置，并只关闭该导出（shipment + detail.export_id）的遗留告警，不误关共享
        同一 shipment 的其他导出。已收齐（422 WECOM_EXPORT_TRACKING_COMPLETE）、
        LEGACY（422 WECOM_EXPORT_LEGACY）拒绝；版本过期 409；存在进行中的 INITIAL
        （PENDING/SENDING，含旧自动发送未完成）409 WECOM_RESEND_IN_FLIGHT；同
        Idempotency-Key 重放返回首次结果。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WecomExportResendCommand' }
      responses:
        '202':
          description: 重发已登记（发送异步执行），返回状态投影 + resend_delivery_id/resend_sequence。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FulfillmentExportWecomState'
                  - type: object
                    properties:
                      resend_delivery_id: { $ref: '#/components/schemas/Identifier' }
                      resend_sequence: { type: integer, minimum: 1 }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/tracking-imports/{batch_id}:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    get:
      tags: [Imports]
      operationId: getTrackingImport
      responses:
        '200':
          description: Provider result rows and source-return generation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackingImportBatch' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/shipments:
    get:
      tags: [Shipments]
      operationId: listShipments
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - name: provider_id
          in: query
          schema: { $ref: '#/components/schemas/Identifier' }
        - name: shipment_status
          in: query
          schema: { $ref: '#/components/schemas/ShipmentStatus' }
      responses:
        '200':
          description: Shipment page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentPage' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/shipments/{shipment_id}:
    parameters:
      - $ref: '#/components/parameters/ShipmentId'
    get:
      tags: [Shipments]
      operationId: getShipment
      responses:
        '200':
          description: Shipment items, tracking, and Shipment-level JD outbound integration state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/shipments/{shipment_id}/source-sync/check:
    parameters:
      - $ref: '#/components/parameters/ShipmentId'
    get:
      tags: [Shipments, Connectors]
      operationId: checkShipmentSourceSync
      summary: 核对一张 Shipment 是否可以回传来源平台
      description: >-
        读取 BUSINESS Shipment、唯一来源行、正式运单和来源平台实时事实，确定性比较
        平台状态、完整收货信息、来源份数和承运商。只允许网关已认证且与 X-Operator
        一致的人工操作员读取；响应包含 PII，始终 Cache-Control: no-store，不产生平台写。
      parameters:
        - $ref: '#/components/parameters/Operator'
      responses:
        '200':
          description: 完整即时检查；ready=false 与 blockers 是业务结果。
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceSyncCheck' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/shipments/{shipment_id}/source-sync/execute:
    parameters:
      - $ref: '#/components/parameters/ShipmentId'
    post:
      tags: [Shipments, Connectors]
      operationId: executeShipmentSourceSync
      summary: 人工确认并执行一张 Shipment 的来源平台回传
      description: >-
        仅支持聚福宝和彩食鲜。重新读取并校验 expected_check_hash 后持久化 SYNCING
        意图；每一次不可逆平台写前复验幂等租约并登记 effect started。只有写后查询
        验证终态才进入 SYNCED；可能已有外部效果但无法确认时进入
        RECONCILIATION_REQUIRED，禁止普通重试。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceSyncExecuteCommand' }
      responses:
        '201':
          description: 来源平台终态已验证；相同幂等键与相同请求重放首次结果。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceSyncOutcome' }
        '409':
          description: 检查过期、状态/幂等冲突，或外部效果未知必须人工对账。
        '422':
          description: 当前检查仍有确定性阻断项。
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/shipments/source-sync/batch-execute:
    post:
      tags: [Shipments, Connectors]
      operationId: batchExecuteShipmentSourceSync
      summary: 逐 Shipment 独立执行一批来源平台回传
      description: >-
        最多 100 项；每项独立携带 shipment_id、expected_check_hash 与 idempotency_key，
        并复用单 Shipment execute 的全部检查、租约、幂等、审计与对账语义。响应始终保留
        每项结果；一项被阻断、冲突或异常不得回滚已经验证成功的兄弟 Shipment。
      parameters:
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceSyncBatchExecuteCommand' }
      responses:
        '200':
          description: 每项独立成功或失败的聚合结果；客户端必须逐项处理。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceSyncBatchOutcome' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/shipments/{shipment_id}/source-sync/reconcile:
    parameters:
      - $ref: '#/components/parameters/ShipmentId'
    post:
      tags: [Shipments, Connectors]
      operationId: reconcileShipmentSourceSync
      summary: 人工对账一次外部效果未知的来源回传
      description: >-
        仅允许 RECONCILIATION_REQUIRED。命令必须回显原 intent 的 check hash、来源行、
        承运商、运单和 lock version；服务端再次核对当前事实。ACCEPTED 不再写平台并转
        SYNCED，NOT_ACCEPTED 释放原平台 intent 后回到 PENDING，UNCERTAIN 继续隔离。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceSyncReconcileCommand' }
      responses:
        '200':
          description: 已持久化的对账结论；相同幂等键与相同请求重放首次结果。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceSyncOutcome' }
        '409':
          description: 不在待对账状态、原 intent/当前事实漂移、版本或幂等冲突。
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/shipments/{shipment_id}/jd-so-order:
    parameters:
      - $ref: '#/components/parameters/ShipmentId'
    post:
      tags: [Shipments]
      operationId: createShipmentJdOutbound
      description: >-
        Submits one aggregated JD outbound order (addSoOrder) for the whole Shipment batch;
        all ShipmentItems share a single merchant-side reference (shipments.outbound_order_no).
        At most one JD integration record exists per Shipment. Replaying the same
        Idempotency-Key returns the original result without a second call; a changed request
        under the same Shipment is rejected. Requires app.jd.write-mode=ON.
        The caller must also be an explicitly authorized outbound operator, derived from
        Basic Auth credentials that the backend revalidates instead of trusting X-Operator alone. The generic
        /api/v1/jd-write/order/so-create route is fail-closed; this Shipment workflow is the
        only supported addSoOrder entry because it enforces idempotency and a fresh stock gate.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentJdOutboundCommand' }
      responses:
        '201':
          description: >-
            JD outbound order submitted; the Shipment's JD integration record is created with
            SUBMITTED state, JD_OUTBOUND_SUBMITTED OrderEvent, version, and audit facts appended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentJdOutboundSubmitResult' }
        '409':
          description: >-
            Write mode disabled (JD_SHIPMENT_OUTBOUND_WRITE_MODE_DISABLED), shipment already
            submitted, request drifted under the same Shipment, client mode differs from an
            unresolved prior attempt (JD_SHIPMENT_OUTBOUND_CLIENT_MODE_CHANGED), or shipment/line
            stage is not submittable. Failure phase and diagnostic code are persisted on the
            Shipment's JD integration record without advancing any business stage.
        '403':
          description: >-
            Authenticated principal is missing, does not match X-Operator, or is not authorized to create JD outbound orders
            (JD_SHIPMENT_OUTBOUND_OPERATOR_UNAUTHORIZED). The rejected attempt is audited and
            neither an intent nor an external write is created.
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/shipments/{shipment_id}/jd-tracking-backfill:
    parameters:
      - $ref: '#/components/parameters/ShipmentId'
    post:
      tags: [Shipments]
      operationId: backfillShipmentJdTracking
      description: >-
        Queries JD querySoOrder by the Shipment's stable erpDeliveryNo and, only after the
        persisted client mode, JD delivery reference, submitted warehouse, owner authority and cargo snapshots,
        plus the provider's currently configured pin credential,
        exact shipped quantities, and single carrier/waybill all match, atomically accepts one
        Tracking for the complete Shipment. The JD call is read-only and runs outside the database transaction.
        Replaying the same Idempotency-Key returns the original result without another JD query.
        Pending or partial results do not advance Shipment, OrderLine, or Order state; split or
        conflicting tracking opens/reuses MULTIPLE_TRACKINGS_FOR_OUTBOUND ReviewCase. Carrier
        ambiguity and JD terminal exceptions open their own blocking ReviewCases. The submitted
        owner is durable authority; the current pin is ephemeral and is never returned or audited.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      responses:
        '200':
          description: >-
            Poll result. QUERY_FAILED is a persisted, retryable business result; callers use a
            new idempotency key for a later read attempt. No raw JD response or receiver PII is returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentJdTrackingBackfillResult' }
        '409':
          description: >-
            The local shipment/outbound facts changed, a prior claim is still in progress, the
            persisted submission client mode differs from the current JD client, historical data
            lacks trustworthy submitted warehouse/owner/cargo snapshots, or the current provider
            pin is missing, or the terminal exception was already closed by an operator
            (JD_TRACKING_SUBMITTED_OWNER_MISSING / JD_TRACKING_PIN_CONFIG_MISSING /
            JD_TRACKING_TERMINAL_EXCEPTION_REVIEWED).
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/shipments/{shipment_id}/jd-so-order-preview:
    parameters:
      - $ref: '#/components/parameters/ShipmentId'
    get:
      tags: [Shipments]
      operationId: previewShipmentJdOutbound
      description: >-
        Derives the exact JD addSoOrder request from one Shipment and all ShipmentItems, with a
        source and validation result for each business field. It collects actionable blockers
        without calling any JD write API. Repeated previews keep the same erpDeliveryNo.
      parameters:
        - $ref: '#/components/parameters/Operator'
      responses:
        '200':
          description: Complete request preview; submittable=false means blockers must be corrected first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentJdOutboundPreview' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/shipments/{shipment_id}/jd-receiver-address:
    parameters:
      - $ref: '#/components/parameters/ShipmentId'
    put:
      tags: [Shipments]
      operationId: confirmShipmentJdReceiverAddress
      description: >-
        Saves operator-confirmed province, city, county, optional town, and detail address for JD
        outbound creation using Shipment optimistic concurrency. The server never guesses these
        fields from receiver free text.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentJdReceiverAddressCommand' }
      responses:
        '200':
          description: Structured JD receiver address confirmed and audit fact appended.
          content:
            application/json:
              schema:
                type: object
                required: [shipment_id, confirmed, confirmed_by, version]
                properties:
                  shipment_id: { $ref: '#/components/schemas/Identifier' }
                  confirmed: { type: boolean, enum: [true] }
                  confirmed_by: { type: string }
                  version: { type: integer, format: int64, minimum: 0 }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/shipments/jd-receiver-address-batch:
    post:
      tags: [Shipments]
      operationId: confirmShipmentJdReceiverAddresses
      summary: 批量确认多个发货批次的结构化京东收货地址
      description: >-
        批量确认多个发货批次的结构化收货地址，逐条与单条确认入口同一用例，另带
        shipment_id；字段与单条确认命令一致，snake_case。任一 Shipment 版本冲突时
        整个批量原子失败返回 409 VERSION_CONFLICT；相同幂等键重放首次结果。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentJdReceiverAddressBatchCommand' }
      responses:
        '200':
          description: 批量确认结果，逐条返回确认事实；任一版本冲突则整体不返回 200。
          content:
            application/json:
              schema:
                type: object
                required: [confirmed_count, items]
                properties:
                  confirmed_count:
                    type: integer
                    format: int32
                    minimum: 0
                  items:
                    type: array
                    items:
                      type: object
                      required: [shipment_id, confirmed, confirmed_by, version]
                      properties:
                        shipment_id: { $ref: '#/components/schemas/Identifier' }
                        confirmed: { type: boolean, enum: [true] }
                        confirmed_by: { type: string }
                        version: { type: integer, format: int64, minimum: 0 }
        '409':
          description: >-
            任一 Shipment 的本地出库事实已变化或版本冲突，整个批量原子失败
            （VERSION_CONFLICT），不落任何确认事实。
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/shipments/jd-receiver-address-candidates:
    get:
      tags: [Shipments]
      operationId: listJdReceiverAddressCandidates
      summary: 列出京东结构化收货地址候选
      description: >-
        只读返回京东结构化收货地址候选，候选仅用于人工确认，未确认不参与建单。
        candidate 为 null 且 candidate_incomplete=true 表示来源层级缺失需人工填写。
      parameters:
        - name: import_batch_id
          in: query
          description: 只返回该导入批次关联发货批次的候选；缺省返回全部候选。
          schema: { type: integer, format: int64 }
        - name: only_missing
          in: query
          description: 只列出未确认或已确认但缺必填层级的批次；缺省为 true。
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: 京东结构化收货地址候选列表。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JdReceiverAddressCandidate' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/shipments/{shipment_id}/jd-sku-mapping-check:
    parameters:
      - $ref: '#/components/parameters/ShipmentId'
    post:
      tags: [Fulfillments]
      operationId: checkShipmentJdSkuMapping
      summary: 核对当前发货批次的京东 SKU 映射门禁
      description: >-
        只调用京东商品只读查询，不创建出库单。关键映射、启用状态或单位换算问题会形成可处理的
        ReviewCase；展示名差异只作警告，不自动改写映射。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      responses:
        '200':
          description: 映射门禁核对结果；门禁阻断也作为可处理的业务结果返回 200
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentJdSkuMappingGateResult' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/shipments/{shipment_id}/jd-stock-check:
    parameters:
      - $ref: '#/components/parameters/ShipmentId'
    post:
      tags: [Shipments, Inventory]
      operationId: checkShipmentJdStock
      summary: 使用当前京东出库预览执行实时库存判定
      description: >-
        复用当前 Shipment 出库预览的 goodsNo 与精确京东件数，在事务外查询目标京东仓。
        缺行、重复行、无效数量、调用失败和库存不足均默认阻断；该结果不是库存预占，
        不创建京东出库单、不切换履约方，也不创建公司自营采购工单。相同幂等键重放
        首次结果，提交出库单前仍必须再次执行实时检查。若当前出库预览本身不可提交，
        请求以 409 前置条件冲突失败，不调用京东库存查询。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      responses:
        '200':
          description: 在可提交预览前提下的库存通过或可操作阻断结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentJdStockCheckResult' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/inventory/overview:
    get:
      tags: [Inventory]
      operationId: getInventoryOverview
      summary: 分页读取跨履约方的最新库存观测
      description: >-
        每行以履约方、SKU 和仓库为粒度读取最新已落库事实。未观测和显式 0 严格区分；
        total_quantity 为来源库存总量，available_quantity 为可用量，unavailable_quantity
        为二者差额。coverage 描述完整筛选范围而非当前页，不把局部京东观测冒充公司全量
        实时库存。warehouse_code 表示目标观测范围：主数据 SKU 在该仓无事实时仍返回一条
        NOT_OBSERVED 记录（warehouse_code 和数量均为 null）；空页仅表示履约方/SKU 主数据范围无匹配。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: provider_id
          in: query
          schema: { $ref: '#/components/schemas/Identifier' }
        - name: sku_id
          in: query
          schema: { $ref: '#/components/schemas/Identifier' }
        - name: warehouse_code
          in: query
          description: 目标观测仓库；不会过滤掉该仓尚未观测的匹配 SKU。
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: 最新库存事实、分页信息和当前筛选范围的覆盖摘要
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryOverviewResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/inventory/details:
    get:
      tags: [Inventory]
      operationId: getInventoryDetails
      summary: 读取单个履约方 SKU 的专业库存明细
      description: >-
        以履约方、SKU 和可选仓库为业务对象，返回主数据上下文、最新已落库库存观测与
        当前明确接入的专业库存查询能力。本接口只读取本地快照，不调用履约方接口；
        未观测时数量保持 null，不把缺失事实伪造为 0。京东低频原始查询仍由系统设置下的
        京东工具承载，能力中的 MOCK/REAL 标记描述当前客户端运行模式，查询结果不会改写
        权威库存事实。
      parameters:
        - name: provider_id
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Identifier' }
        - name: sku_id
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Identifier' }
        - name: warehouse_code
          in: query
          description: 可选目标观测仓库；无该仓观测时仍返回对象上下文和 NOT_OBSERVED。
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^\S+$' }
      responses:
        '200':
          description: 业务对象上下文、缓存观测、新鲜度与已接入能力
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryDetailsResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/review-cases:
    get:
      tags: [Reviews]
      operationId: listReviewCases
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, RESOLVED, DISMISSED] }
        - name: reason_code
          in: query
          schema: { type: string, maxLength: 64 }
        - name: responsible_team
          in: query
          schema: { type: string, maxLength: 128 }
        - name: source_channel
          in: query
          description: Limits the queue to BUSINESS orders from this source channel.
          schema: { $ref: '#/components/schemas/SourceChannel' }
        - name: import_batch_id
          in: query
          description: Limits the queue to review cases linked to this import batch; malformed values are rejected.
          schema: { type: string, pattern: '^[1-9][0-9]*$' }
      responses:
        '200':
          description: BUSINESS manual-review queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewCasePage' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/review-cases/{case_id}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Reviews]
      operationId: getReviewCase
      responses:
        '200':
          description: Review subject, evidence, suggestions, and allowed actions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewCase' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/review-cases/{case_id}/resolve-customer:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Reviews]
      operationId: resolveCustomerReview
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveCustomerReviewCommand' }
      responses:
        '200':
          description: Existing active BUSINESS customer linked and review resolved atomically; no customer is created by this command
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewCase' }
        '409':
          description: expected_version is stale, the review is no longer OPEN, or evidence/mapping conflicts
          content:
            application/json:

# 评审用契约草案（工单 07）。本文件是人工评审的契约载体，承载业务语义与说明性描述；
# 机器可读结构（路径/方法/参数/2xx 响应码/请求体与成功响应 schema）以 springdoc 从运行中的
# 应用实时生成的契约为事实（/v3/api-docs 与 /v3/api-docs.yaml）。CI 门禁
# OpenApiContractConsistencyTest 按固定粒度比对本文件与生成物，漂移即失败并打印差异；
# 生成物快照见 jry/backend/target/generated-openapi.yaml。粒度与首次处置见
# .scratch/repo-design-hardening/issues/07-spec-generation-gate.md 的 Resolution。
openapi: 3.0.3
info:
  title: Order Fulfillment and Logistics Hub API
  version: 0.1.0
  description: >-
    Contract for BUSINESS administration, trusted internal intake, and isolated
    DemoScenario operations. JSON field names use snake_case; identifiers and
    NUMERIC(18,3) quantities are strings.
servers:
  - url: http://localhost:8080
    description: Local Docker Compose
tags:
  - name: Dashboard
  - name: Orders
  - name: Imports
  - name: Fulfillments
  - name: Exports
  - name: Shipments
  - name: Inventory
  - name: Reviews
  - name: Procurement
  - name: MasterData
  - name: Connectors
  - name: Messages
  - name: OrderDrafts
  - name: TrackingDrafts
  - name: CarrierMappings
  - name: ZhonghuiPms
  - name: WeCom
  - name: Audit
  - name: Analytics
  - name: Operations
  - name: Internal
  - name: Demo
security:
  - basicAuth: []
paths:
  "/api/v1/agent-runs/token-usage":
    "Blocker":
      type: object
      properties:
        stage:
          type: string
        code:
          type: string
        count:
          type: integer
          format: int32
        sampleNo:
          type: string
    "FulfillmentFileAssessment":
      type: object
      properties:
        batch_no:
          type: string
        current_stage:
          type: string
        summary:
          type: string
        stage_notes:
          type: array
          items:
            $ref: "#/components/schemas/StageNote"
        suggested_actions:
          type: array
          items:
            $ref: "#/components/schemas/SuggestedAction"
        requires_human:
          type: boolean
        missing_fields:
          type: array
          items:
            type: string
    "FulfillmentFileRunResult":
      type: object
      properties:
        progress:
          $ref: "#/components/schemas/ImportBatchProgress"
        assessment:
          $ref: "#/components/schemas/FulfillmentFileAssessment"
        provider:
          type: string
        model:
          type: string
        promptVersion:
          type: string
        error:
          type: string
    "ImportBatchProgress":
      type: object
      properties:
        batchId:
          type: integer
          format: int64
        batchNo:
          type: string
        batchType:
          type: string
        sourceChannel:
          type: string
        status:
          type: string
        revisionNo:
          type: integer
          format: int32
        receivedAt:
          type: string
          format: date-time
        processedAt:
          type: string
          format: date-time
        intake:
          $ref: "#/components/schemas/Stage"
        outbound:
          $ref: "#/components/schemas/Stage"
        tracking:
          $ref: "#/components/schemas/Stage"
        sourceReturn:
          $ref: "#/components/schemas/Stage"
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/Blocker"
    "MetaAgentMessage":
      type: object
      properties:
        message:
          type: string
        threadId:
          type: string
    JsonNode: {}
    "MetaAgentOutcome":
      type: object
      properties:
        outcome:
          type: string
        runId:
          type: string
        agentSlug:
          type: string
        draftVersion:
          type: integer
          format: int32
        draftEnabled:
          type: boolean
        questions:
          type: array
          items:
            type: string
        rejectionReason:
          type: string
        error:
          type: string
        raw:
          $ref: "#/components/schemas/JsonNode"
    "Stage":
      type: object
      properties:
        name:
          type: string
        total:
          type: integer
          format: int32
        done:
          type: integer
          format: int32
        blocked:
          type: integer
          format: int32
        supported:
          type: boolean
    "StageNote":
      type: object
      properties:
        stage:
          type: string
        note:
          type: string
    "SuggestedAction":
      type: object
      properties:
        action:
          type: string
        reason:
          type: string
        target_no:
          type: string
    "TokenUsageSummaryItem":
      type: object
      properties:
        groupKey:
          type: string
        runs:
          type: integer
          format: int64
        failedRuns:
          type: integer
          format: int64
        runsWithoutTokenUsage:
          type: integer
          format: int64
        overThresholdRuns:
          type: integer
          format: int64
        promptTokens:
          type: integer
          format: int64
        completionTokens:
          type: integer
          format: int64
        totalTokens:
          type: integer
          format: int64
        maxRunTotalTokens:
          type: integer
          format: int64
        modelCalls:
          type: integer
          format: int64
        totalLatencyMs:
          type: integer
          format: int64
        maxRunLatencyMs:
          type: integer
          format: int64
    "TokenUsageSummaryResponse":
      type: object
      properties:
        groupBy:
          type: string
        runMode:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/TokenUsageSummaryItem"
        totals:
          $ref: "#/components/schemas/TokenUsageSummaryItem"
    get:
      tags:
      - agent-run-read-controller
      operationId: tokenUsage_1
      parameters:
      - name: slug
        in: query
        required: false
        schema:
          type: string
      - name: run_mode
        in: query
        required: false
        schema:
          type: string
      - name: business_entity_type
        in: query
        required: false
        schema:
          type: string
      - name: started_from
        in: query
        required: false
        schema:
          type: string
      - name: started_to
        in: query
        required: false
        schema:
          type: string
      - name: group_by
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenUsageSummaryResponse"
  "/api/v1/agents/meta/conversations":
    post:
      tags:
      - meta-agent-controller
      operationId: converse
      parameters:
      - name: X-Operator
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetaAgentMessage"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MetaAgentOutcome"
  "/api/v1/import-batches/{batchId}/assessment":
    post:
      tags:
      - fulfillment-file-agent-controller
      operationId: assess
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Operator
        in: header
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FulfillmentFileRunResult"
  "/api/v1/import-batches/{batchId}/progress":
    get:
      tags:
      - fulfillment-file-agent-controller
      operationId: progress
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ImportBatchProgress"
  /api/v1/zhonghui-pms/status:
    get:
      tags: [ZhonghuiPms]
      operationId: getZhonghuiPmsStatus
      description: Non-secret client mode, default-off write latch, credential readiness, and session state.
      responses:
        '200':
          description: Zhonghui PMS readiness projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusView' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/zhonghui-pms/captcha:
    get:
      tags: [ZhonghuiPms]
      operationId: getZhonghuiPmsCaptcha
      responses:
        '200':
          description: Captcha number and Base64 PNG without a data URI prefix
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptchaView' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/zhonghui-pms/login:
    post:
      tags: [ZhonghuiPms]
      operationId: loginZhonghuiPms
      description: External state-changing login; REAL mode additionally requires write_mode ON.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login result; token is retained only in server memory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginView' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/zhonghui-pms/logout:
    post:
      tags: [ZhonghuiPms]
      operationId: logoutZhonghuiPms
      parameters:
        - $ref: '#/components/parameters/Operator'
      responses:
        '200':
          description: Local in-memory session cleared
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/zhonghui-pms/options:
    get:
      tags: [ZhonghuiPms]
      operationId: getZhonghuiPmsOptions
      responses:
        '200':
          description: Brands, certifications, and logistics options for the authenticated session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OptionsView' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/zhonghui-pms/batch-uploads:
    post:
      tags: [ZhonghuiPms]
      operationId: uploadZhonghuiPmsBatch
      description: >-
        Upload at most 20 SKUs through a stable persisted intent. Same-key recovery reuses the original
        batch; SUCCESS/FAILED facts are not written again and PENDING facts are query-reconciled only.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchUploadCommand' }
      responses:
        '200':
          description: Completed batch projection, or an idempotent replay of the first result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchUploadView' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/zhonghui-pms/upload-batches/{batch_id}:
    get:
      tags: [ZhonghuiPms]
      operationId: getZhonghuiPmsUploadBatch
      parameters:
        - name: batch_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Identifier' }
      responses:
        '200':
          description: Persisted batch intent and per-SKU facts for audit or reconciliation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchDetailView' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/channel-messages:
    get:
      tags: [Messages]
      operationId: listChannelMessages
      description: Authorized immutable enterprise WeChat text evidence; raw callback payloads are not returned.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Newest received message evidence first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelMessagePage' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/wecom/readiness:
    get:
      tags: [WeCom]
      operationId: getWecomLongConnectionReadiness
      description: >-
        Non-secret projection of the enterprise WeChat intelligent-bot long-connection gates: what
        configuration is missing and what connection state the client is in. Never returns botId/secret
        values; SUBSCRIBED proves an established WebSocket, not that real messages were received.
      parameters:
        - $ref: '#/components/parameters/Operator'
      responses:
        '200':
          description: Configuration gates and long-connection state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WecomConnectionReadiness' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/message-media/{message_media_id}/content:
    parameters:
      - $ref: '#/components/parameters/ChannelMessageId'
    get:
      tags: [Messages]
      operationId: getMessageMediaContent
      description: >-
        Authorized original media bytes for review: serves the decrypted evidence file by controlled
        reference. Never exposes disk paths, temporary download credentials, or aeskey; PENDING/FAILED
        or missing media returns 404 without distinguishing the reason.
      responses:
        '200':
          description: Decrypted original media bytes with its content type
          content:
            application/octet-stream: {}
        '404':
          description: Media evidence not available
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/channel-messages/{channel_message_id}:
    parameters:
      - $ref: '#/components/parameters/ChannelMessageId'
    get:
      tags: [Messages]
      operationId: getChannelMessage
      description: Authorized whitelisted message evidence and a controlled raw-payload reference.
      responses:
        '200':
          description: Message evidence detail without callback secrets or response_url
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelMessageDetail' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/message-submissions/tasks:
    get:
      tags: [Messages]
      operationId: listMessageSubmissionTasks
      description: Authorized operational task status without lease owners, payloads, or other worker internals.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, RUNNING, FINALIZING, SUCCEEDED, FAILED] }
      responses:
        '200':
          description: Message interpretation task status page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageTaskPage' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/message-submissions/{submission_id}:
    parameters:
      - $ref: '#/components/parameters/MessageSubmissionId'
    get:
      tags: [Messages]
      operationId: getMessageSubmission
      description: Authorized submission and interpretation history; model structured output is never returned.
      responses:
        '200':
          description: Whitelisted submission detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageSubmissionDetail' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/message-submissions/{submission_id}/reinterpret:
    parameters:
      - $ref: '#/components/parameters/MessageSubmissionId'
    post:
      tags: [Messages]
      operationId: reinterpretMessageSubmission
      description: Idempotently enqueue a new interpretation version for an existing submission.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Updated whitelisted submission detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageSubmissionDetail' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/order-drafts:
    get:
      tags: [OrderDrafts]
      operationId: listOrderDrafts
      description: Whitelisted enterprise WeChat order drafts; model-private and unknown fields are never returned.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderDraftStatus' }
        - name: submission_id
          in: query
          schema: { $ref: '#/components/schemas/Identifier' }
      responses:
        '200':
          description: Newest drafts first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDraftPage' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/order-drafts/{draft_id}:
    parameters:
      - $ref: '#/components/parameters/OrderDraftId'
    get:
      tags: [OrderDrafts]
      operationId: getOrderDraft
      responses:
        '200':
          description: Whitelisted draft, candidate, line, and open ReviewCase version data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDraftDetail' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/order-drafts/{draft_id}/confirm:
    parameters:
      - $ref: '#/components/parameters/OrderDraftId'
    post:
      tags: [OrderDrafts]
      operationId: confirmOrderDraft
      description: >-
        Idempotently confirm the visible draft and ReviewCase versions and create one WECOM CanonicalOrder.
        The backend revalidates the gateway Basic Auth principal and requires it to match X-Operator;
        the header alone is never an authenticated identity.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmOrderDraftCommand' }
      responses:
        '200':
          description: Confirmed draft; an identical idempotency replay returns the same representation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDraftDetail' }
        '403':
          description: Authenticated gateway principal is missing or does not match X-Operator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/order-drafts/{draft_id}/reject:
    parameters:
      - $ref: '#/components/parameters/OrderDraftId'
    post:
      tags: [OrderDrafts]
      operationId: rejectOrderDraft
      description: >-
        Idempotently reject the visible draft and dismiss its ReviewCase with an explicit reason.
        The backend revalidates the gateway Basic Auth principal and requires it to match X-Operator;
        the header alone is never an authenticated identity.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectOrderDraftCommand' }
      responses:
        '200':
          description: Rejected draft; an identical idempotency replay returns the same representation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDraftDetail' }
        '403':
          description: Authenticated gateway principal is missing or does not match X-Operator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/order-drafts/{draft_id}/supplement:
    parameters:
      - $ref: '#/components/parameters/OrderDraftId'
    post:
      tags: [OrderDrafts]
      operationId: supplementOrderDraft
      description: >-
        Idempotently add supplementary lines to an existing draft. The expected revision
        guards against concurrent edits; quantities are the NUMERIC(18,3) decimal strings
        used across the contract.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderDraftSupplementCommand' }
      responses:
        '200':
          description: Supplemented draft at its new revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDraftDetail' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/tracking-drafts:
    get:
      tags: [TrackingDrafts]
      operationId: listTrackingDrafts
      description: Whitelisted enterprise WeChat provider-tracking drafts; model-private and unknown fields are never returned.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TrackingDraftStatus' }
        - name: submission_id
          in: query
          schema: { $ref: '#/components/schemas/Identifier' }
      responses:
        '200':
          description: Newest tracking drafts first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackingDraftPage' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/tracking-drafts/{draft_id}:
    parameters:
      - $ref: '#/components/parameters/TrackingDraftId'
    get:
      tags: [TrackingDrafts]
      operationId: getTrackingDraft
      description: >-
        Return deterministic match candidates separately from the enabled Carrier master-data
        options used for an explicit manual correction. Eligible fulfillment tasks are never
        enumerated; an operator may instead submit an exact public fulfillment_no as task_no.
      responses:
        '200':
          description: Whitelisted single-line draft, deterministic candidates, validation issues, and open ReviewCase reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackingDraftDetail' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/tracking-drafts/batch-confirm:
    post:
      tags: [TrackingDrafts]
      operationId: batchConfirmTrackingDrafts
      description: >-
        Confirm multiple validated tracking drafts as independent single-line transactions. Each line
        carries its own idempotency key and expected versions; a conflicting, stale, or duplicate line
        fails without rolling back other successful lines. Failed lines stay OPEN with an actionable
        error; successful lines are resolved and cannot be re-confirmed.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackingDraftBatchConfirmCommand' }
      responses:
        '200':
          description: Per-line success/failure results with counts; an identical idempotency replay returns the same representation
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/tracking-drafts/{draft_id}/confirm:
    parameters:
      - $ref: '#/components/parameters/TrackingDraftId'
    post:
      tags: [TrackingDrafts]
      operationId: confirmTrackingDraft
      description: >-
        Idempotently confirm the visible draft and ReviewCase versions, advance the uniquely matched existing Shipment,
        and record Tracking without inferring or setting an actual shipment time. The backend revalidates the gateway
        Basic Auth principal and requires it to match X-Operator; the header alone is never an authenticated identity.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmTrackingDraftCommand' }
      responses:
        '200':
          description: Confirmed draft; an identical idempotency replay returns the same representation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackingDraftDetail' }
        '403':
          description: Authenticated gateway principal is missing or does not match X-Operator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/tracking-drafts/{draft_id}/reject:
    parameters:
      - $ref: '#/components/parameters/TrackingDraftId'
    post:
      tags: [TrackingDrafts]
      operationId: rejectTrackingDraft
      description: >-
        Idempotently reject an open tracking draft, dismiss its open ReviewCase, preserve the
        operator reason, and leave Shipment/Tracking facts unchanged. The expected draft revision
        and ReviewCase version are revalidated under the same submission-first lock order used by
        confirmation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackingDraftRejectCommand' }
      responses:
        '200':
          description: Rejected draft; an identical idempotency replay returns the same representation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackingDraftDetail' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/carrier-prefix-mappings:
    get:
      tags: [CarrierMappings]
      operationId: getCarrierPrefixMappings
      description: >-
        Read the canonically ordered, database-authoritative carrier-prefix rule set and its
        optimistic-lock version. Environment prefix mappings are not a runtime fallback.
      responses:
        '200':
          description: Current authoritative mapping set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarrierPrefixMappingView' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    put:
      tags: [CarrierMappings]
      operationId: replaceCarrierPrefixMappings
      description: >-
        Idempotently replace the complete rule set. Prefixes are normalized and sorted, exact
        duplicates collapse, conflicting duplicates are rejected, and every Carrier must be enabled.
        An empty set is a supported fail-closed state in which no waybill prefix resolves.
        The backend revalidates the Basic Auth principal and requires it to match X-Operator.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceCarrierPrefixMappingsCommand' }
      responses:
        '200':
          description: Updated mapping set; an identical idempotency replay is byte-stable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarrierPrefixMappingView' }
        '403':
          description: Authenticated gateway principal is missing or does not match X-Operator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: Mapping version or idempotency payload conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/ErrorResponse' }

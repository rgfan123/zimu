components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Nginx authenticates management and browser demo operations; explicitly public connector callbacks use their own signatures.
    internalServiceBearer:
      type: http
      scheme: bearer
      description: Internal service credential accepted only on explicitly registered service seams such as the demo order-assistant submission.
  headers:
    RequestId:
      description: Request correlation identifier
      schema: { type: string }
  responses:
    ErrorResponse:
      description: Unified business or technical error
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    Sort:
      name: sort
      in: query
      description: Repeatable field,asc or field,desc using an operation allow-list
      schema:
        type: array
        items: { type: string }
      style: form
      explode: true
    DateFrom:
      name: date_from
      in: query
      schema: { type: string, format: date }
    DateTo:
      name: date_to
      in: query
      schema: { type: string, format: date }
    BusinessDate:
      name: business_date
      in: query
      description: Asia/Shanghai natural day; defaults to today
      schema: { type: string, format: date }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 255 }
    Operator:
      name: X-Operator
      in: header
      required: true
      description: Required at the backend seam; the public gateway overwrites this value with the authenticated principal.
      schema: { type: string, minLength: 1, maxLength: 128 }
    OrderId: { name: order_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    BatchId: { name: batch_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    ExportId: { name: export_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    FulfillmentId: { name: fulfillment_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    ShipmentId: { name: shipment_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    CaseId: { name: case_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    AlertId: { name: alert_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    TicketId: { name: ticket_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    CustomerId: { name: customer_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    CategoryId: { name: category_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    ProductId: { name: product_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    SkuId: { name: sku_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    MappingId: { name: mapping_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    ProviderId: { name: provider_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    AuditId: { name: audit_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    ChannelMessageId: { name: channel_message_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    MessageSubmissionId: { name: submission_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    OrderDraftId: { name: draft_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    TrackingDraftId: { name: draft_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    RunId: { name: run_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    SourceChannelPath:
      name: source_channel
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SourceChannel' }
  schemas:
    CreateRequest:
      type: object
      required: [messageSubmissionId, employeeDraft]
      properties:
        messageSubmissionId: { type: integer, format: int64, minimum: 1 }
        employeeDraft: { type: string, minLength: 1, maxLength: 20000 }
    OrganizeRequest:
      type: object
      required: [agentSlug, agentVersion]
      properties:
        agentSlug: { type: string, minLength: 1, maxLength: 64 }
        agentVersion: { type: integer, format: int32, minimum: 1 }
    BusinessFollowUpDto:
      type: object
      required:
        [id, followupNo, messageSubmissionId, sourceMessageId, employeeDraft,
         sourceRevision, stage, processingStatus, createdBy, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        followupNo: { type: string }
        messageSubmissionId: { type: integer, format: int64 }
        sourceMessageId: { type: integer, format: int64 }
        employeeDraft: { type: string }
        sourceRevision: { type: integer, format: int32 }
        stage: { type: string, enum: [PENDING_ORGANIZATION, ORGANIZING, DRAFT_READY] }
        processingStatus: { type: string, enum: [NOT_STARTED, PENDING, RUNNING, SUCCEEDED, FAILED] }
        createdBy: { type: string }
        designatedReviewer: { type: string, nullable: true }
        agentSlug: { type: string, nullable: true }
        agentVersion: { type: integer, format: int32, nullable: true }
        taskStatus: { type: string, nullable: true }
        taskAttempts: { type: integer, format: int32, nullable: true }
        taskLastError: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PageResponseBusinessFollowUpDto:
      type: object
      required: [items, page, size, total, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BusinessFollowUpDto' }
        page: { type: integer, format: int32 }
        size: { type: integer, format: int32 }
        total: { type: integer, format: int64 }
        totalPages: { type: integer, format: int32 }
    Identifier:
      type: string
      pattern: '^[1-9][0-9]*$'
      example: '42'
    DecimalQuantity:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
      example: '6.000'
    PositiveDecimalQuantity:
      type: string
      pattern: '^(?!0(?:\.0{1,3})?$)(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
      example: '6.000'
    NullableCommercialPrice:
      type: string
      nullable: true
      pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$'
      example: '12.30'
      description: Non-negative CNY decimal string; null means unknown, while persisted values are returned with scale 2.
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    SourceChannel:
      type: string
      enum: [CAISHIXIAN, JUFUBAO, FEIXIANG, ZHONGHUI, WANGQI, DAZHE, WANQI, WECOM]
    ImportMode:
      type: string
      enum: [NEW, REVISION]
      default: NEW
    ImportBatchStatus:
      type: string
      enum: [RECEIVED, PROCESSING, COMPLETED, COMPLETED_WITH_REVIEW, FAILED]
    RawRowStatus:
      type: string
      enum: [RECEIVED, ACCEPTED, NEED_REVIEW, REJECTED]
    OrderStatus:
      type: string
      enum: [RECEIVED, VALIDATED, SKU_MAPPED, FULFILLING, SHIPPED, SYNCED, CLOSED, NEED_REVIEW, OUT_OF_STOCK, PROCUREMENT_PENDING, FULFILLMENT_EXCEPTION, SYNC_FAILED, CANCELLED]
    ProcessingStage:
      type: string
      enum: [NEED_REVIEW, READY_TO_EXPORT, PROCUREMENT_IN_PROGRESS, WAITING_PROVIDER, TRACKING_RECEIVED, RETURN_FILE_READY, COMPLETED, EXCEPTION]
    ProcessingHealth:
      type: string
      enum: [BLUE, YELLOW, RED, GREEN]
      description: Derived display projection; never accepted by a write command.
    ShippingProgress:
      type: string
      enum: [NOT_SHIPPED, PARTIALLY_SHIPPED, SHIPPED]
    FulfillmentOutcome:
      type: string
      enum: [IN_PROGRESS, FULLY_FULFILLED, PARTIALLY_FULFILLED, CANCELLED]
    ShipmentStatus:
      type: string
      enum: [CREATED, SHIPPED, FAILED, DELIVERED]
    SourceSyncStatus:
      type: string
      enum: [PENDING, SYNCING, SYNCED, SYNC_FAILED, RECONCILIATION_REQUIRED]
    SourceSyncBlocker:
      type: object
      additionalProperties: false
      required: [code, field, message]
      properties:
        code: { type: string, maxLength: 64 }
        field: { type: string }
        message: { type: string }
    SourceSyncFacts:
      type: object
      additionalProperties: false
      required:
        - shipment_id
        - order_id
        - source_channel
        - source_ref
        - source_line_ref
        - receiver_name
        - receiver_phone
        - receiver_address
        - ordered_source_quantity
        - shipped_source_quantity
        - internal_shipped_quantity
        - fulfillment_outcome
        - carrier_code
        - carrier_name
        - carrier_output_value
        - tracking_number
      properties:
        shipment_id: { type: integer, format: int64 }
        order_id: { type: integer, format: int64 }
        source_channel: { $ref: '#/components/schemas/SourceChannel' }
        source_ref: { type: string, nullable: true }
        source_line_ref: { type: string, nullable: true }
        receiver_name: { type: string, nullable: true }
        receiver_phone: { type: string, nullable: true }
        receiver_address: { type: string, nullable: true }
        ordered_source_quantity: { type: number, nullable: true }
        shipped_source_quantity: { type: number, nullable: true }
        internal_shipped_quantity: { type: number, nullable: true }
        fulfillment_outcome: { type: string }
        carrier_code: { type: string, nullable: true }
        carrier_name: { type: string, nullable: true }
        carrier_output_value: { type: string, nullable: true }
        tracking_number: { type: string, nullable: true }
    SourcePlatformCheckResult:
      type: object
      additionalProperties: false
      required:
        - available
        - business_code
        - message
        - acceptance_required
        - address_status
        - carrier_mapped
      properties:
        available: { type: boolean }
        business_code: { type: string, maxLength: 64 }
        message: { type: string }
        platform_state: { type: string, nullable: true }
        acceptance_required: { type: boolean }
        address_status:
          type: string
          enum: [CLEAR, CONFIRMATION_REQUIRED, UNKNOWN]
        receiver_name: { type: string, nullable: true }
        receiver_phone: { type: string, nullable: true }
        receiver_address: { type: string, nullable: true }
        sendable_quantity: { type: number, nullable: true }
        carrier_mapped: { type: boolean }
        effect_hash:
          allOf: [{ $ref: '#/components/schemas/Sha256' }]
          nullable: true
          description: 不含 PII 的平台规范化写入计划摘要
    SourceSyncProjection:
      type: object
      additionalProperties: false
      required: [status, attempt_count, lock_version]
      properties:
        status: { $ref: '#/components/schemas/SourceSyncStatus' }
        attempt_count: { type: integer, format: int32, minimum: 0 }
        lock_version: { type: integer, format: int64, minimum: 0 }
        last_error_code: { type: string, nullable: true }
        last_error_message: { type: string, nullable: true }
        synced_at: { type: string, format: date-time, nullable: true }
    SourceSyncReconciliationIntent:
      type: object
      additionalProperties: false
      required: [check_hash, source_line_ref, carrier_code, tracking_number, version]
      properties:
        check_hash: { $ref: '#/components/schemas/Sha256' }
        source_line_ref: { type: string }
        carrier_code: { type: string }
        tracking_number: { type: string }
        version: { type: integer, format: int64, minimum: 0 }
    SourceSyncCheck:
      type: object
      additionalProperties: false
      required:
        - shipment_id
        - ready
        - check_hash
        - artifact_hash
        - internal
        - platform
        - blockers
        - projection
      properties:
        shipment_id: { type: integer, format: int64 }
        ready: { type: boolean }
        check_hash: { $ref: '#/components/schemas/Sha256' }
        artifact_hash: { $ref: '#/components/schemas/Sha256' }
        internal: { $ref: '#/components/schemas/SourceSyncFacts' }
        platform: { $ref: '#/components/schemas/SourcePlatformCheckResult' }
        blockers:
          type: array
          items: { $ref: '#/components/schemas/SourceSyncBlocker' }
        projection: { $ref: '#/components/schemas/SourceSyncProjection' }
        reconciliation_intent:
          allOf: [{ $ref: '#/components/schemas/SourceSyncReconciliationIntent' }]
          nullable: true
    SourceSyncExecuteCommand:
      type: object
      additionalProperties: false
      required: [expected_check_hash]
      properties:
        expected_check_hash: { $ref: '#/components/schemas/Sha256' }
    SourceSyncBatchExecuteCommand:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/SourceSyncBatchExecuteItem' }
    SourceSyncBatchExecuteItem:
      type: object
      additionalProperties: false
      required: [shipment_id, expected_check_hash, idempotency_key]
      properties:
        shipment_id: { type: integer, format: int64, minimum: 1 }
        expected_check_hash: { $ref: '#/components/schemas/Sha256' }
        idempotency_key: { type: string, minLength: 8, maxLength: 255 }
    SourceSyncBatchOutcome:
      type: object
      additionalProperties: false
      required: [items, success_count, failure_count]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SourceSyncBatchOutcomeItem' }
        success_count: { type: integer, format: int32, minimum: 0 }
        failure_count: { type: integer, format: int32, minimum: 0 }
    SourceSyncBatchOutcomeItem:
      type: object
      additionalProperties: false
      required:
        - shipment_id
        - success
        - replayed
        - http_status
        - business_code
        - message
      properties:
        shipment_id: { type: integer, format: int64, minimum: 1 }
        success: { type: boolean }
        replayed: { type: boolean }
        http_status: { type: integer, format: int32, minimum: 100, maximum: 599 }
        business_code: { type: string, maxLength: 64 }
        message: { type: string }
        outcome:
          allOf: [{ $ref: '#/components/schemas/SourceSyncOutcome' }]
          nullable: true
        replayed_body:
          type: object
          additionalProperties: true
          nullable: true
    SourceSyncReconcileCommand:
      type: object
      additionalProperties: false
      required:
        - decision
        - note
        - expected_check_hash
        - expected_source_line_ref
        - expected_carrier_code
        - expected_tracking_number
        - expected_version
      properties:
        decision: { type: string, enum: [ACCEPTED, NOT_ACCEPTED, UNCERTAIN] }
        note: { type: string, minLength: 1, maxLength: 500 }
        expected_check_hash: { $ref: '#/components/schemas/Sha256' }
        expected_source_line_ref: { type: string, minLength: 1, maxLength: 255 }
        expected_carrier_code: { type: string, minLength: 1, maxLength: 64 }
        expected_tracking_number: { type: string, minLength: 1, maxLength: 128 }
        expected_version: { type: integer, format: int64, minimum: 0 }
    SourceSyncOutcome:
      type: object
      additionalProperties: false
      required:
        - shipment_id
        - status
        - business_code
        - message
        - check_hash
        - version
        - completed_at
      properties:
        shipment_id: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/SourceSyncStatus' }
        business_code: { type: string, maxLength: 64 }
        message: { type: string }
        check_hash: { $ref: '#/components/schemas/Sha256' }
        version: { type: integer, format: int64, minimum: 0 }
        platform_ref:
          type: string
          nullable: true
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
          description: 平台返回且经 allowlist 校验的非 PII 请求引用
        completed_at: { type: string, format: date-time }
    ProcurementStatus:
      type: string
      enum: [PENDING, SUCCESS, PARTIAL, FAILED, CANCELLED]
    ExportUsageStatus:
      type: string
      enum: [GENERATED_NOT_DOWNLOADED, DOWNLOADED_WAITING_RETURN, RETURNED, RETURN_OVERDUE]
    PageMeta:
      type: object
      required: [page, size, total_elements, total_pages]
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        total_elements: { type: integer, format: int64, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    ApiError:
      type: object
      required: [business_code, message, http_status, request_id, trace_id]

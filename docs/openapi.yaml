      required: [enabled, retentionDays, cutoff]
      properties:
        enabled: { type: boolean }
        retentionDays: { type: integer, format: int32 }
        cutoff: { type: string, format: date-time }
        expiredCandidates: { type: integer, format: int32 }
        protectedCount: { type: integer, format: int32 }

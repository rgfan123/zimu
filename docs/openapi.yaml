openapi: 3.0.3
info:
  title: Order Fulfillment and Logistics Hub API
  version: 0.1.0
  description: >-
    Contract for BUSINESS administration, trusted internal intake, and isolated
    DemoScenario operations. JSON field names use snake_case; identifiers and
    NUMERIC(18,3) quantities are strings.
servers:
  - url: http://localhost:8080
    description: Local Docker Compose
tags:
  - name: Dashboard
  - name: Orders
  - name: Imports
  - name: Fulfillments
  - name: Exports
  - name: Shipments
  - name: Reviews
  - name: Procurement
  - name: MasterData
  - name: Connectors
  - name: Messages
  - name: WeCom
  - name: Audit
  - name: Analytics
  - name: Internal
  - name: Demo
security:
  - basicAuth: []
paths:
  /wecom/callbacks/{connection_id}:
    parameters:
      - $ref: '#/components/parameters/WecomConnectionId'
    get:
      tags: [WeCom]
      operationId: verifyWecomCallbackUrl
      description: >-
        Public enterprise WeChat intelligent-bot URL verification. The
        msg_signature authenticates the encrypted challenge; Nginx Basic Auth
        is intentionally disabled for this callback only.
      security: []
      parameters:
        - $ref: '#/components/parameters/WecomMessageSignature'
        - $ref: '#/components/parameters/WecomTimestamp'
        - $ref: '#/components/parameters/WecomNonce'
        - name: echostr
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Decrypted challenge returned as unquoted text without a trailing newline
          content:
            text/plain:
              schema: { type: string }
        default: { $ref: '#/components/responses/ErrorResponse' }
    post:
      tags: [WeCom]
      operationId: receiveWecomCallback
      description: >-
        Public encrypted JSON callback. Only configured bot and business-group
        text messages are persisted. Every accepted retry receives an encrypted
        fixed stream receipt after durable idempotent storage; ignored groups or
        message types receive an empty 200 response.
      security: []
      parameters:
        - $ref: '#/components/parameters/WecomMessageSignature'
        - $ref: '#/components/parameters/WecomTimestamp'
        - $ref: '#/components/parameters/WecomNonce'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WecomEncryptedEnvelope' }
      responses:
        '200':
          description: Encrypted fixed receipt JSON for an accepted message, or an empty body for a callback outside the configured boundary.
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/channel-messages:
    get:
      tags: [Messages]
      operationId: listChannelMessages
      description: Authorized immutable enterprise WeChat text evidence; raw callback payloads are not returned.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Newest received message evidence first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelMessagePage' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/channel-messages/{channel_message_id}:
    parameters:
      - $ref: '#/components/parameters/ChannelMessageId'
    get:
      tags: [Messages]
      operationId: getChannelMessage
      description: Authorized whitelisted message evidence and a controlled raw-payload reference.
      responses:
        '200':
          description: Message evidence detail without callback secrets or response_url
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelMessageDetail' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/dashboard/summary:
    get:
      tags: [Dashboard]
      operationId: getDashboardSummary
      parameters:
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: Dashboard KPIs, trend, and manual-attention summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/orders:
    get:
      tags: [Orders]
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - name: source_channel
          in: query
          schema: { $ref: '#/components/schemas/SourceChannel' }
        - name: order_status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - name: processing_stage
          in: query
          schema: { $ref: '#/components/schemas/ProcessingStage' }
        - name: processing_health
          in: query
          schema: { $ref: '#/components/schemas/ProcessingHealth' }
        - name: query
          in: query
          description: Order number, source reference, or customer name
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: BUSINESS orders only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/orders/{order_id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      operationId: getOrder
      responses:
        '200':
          description: Aggregated BUSINESS order detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/orders/{order_id}/timeline:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      operationId: getOrderTimeline
      responses:
        '200':
          description: Events ordered by the order-scoped sequence_no
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderEvent' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/orders/{order_id}/versions:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      operationId: listOrderVersions
      responses:
        '200':
          description: Append-only order versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderVersion' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/orders/{order_id}/shipments:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders, Shipments]
      operationId: listOrderShipments
      responses:
        '200':
          description: Every shipment and tracking for manual follow-up
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Shipment' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/orders/{order_id}/corrections:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Orders]
      operationId: createCorrectionOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectionOrderCommand' }
      responses:
        '201':
          description: Explicit correction order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/import-batches/source-orders:
    post:
      tags: [Imports]
      operationId: uploadSourceOrderFile
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, import_mode]
              properties:
                file: { type: string, format: binary }
                import_mode: { $ref: '#/components/schemas/ImportMode' }
                parent_import_batch_id:
                  $ref: '#/components/schemas/Identifier'
      responses:
        '201':
          description: File retained and rows processed; duplicate content returns the existing batch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatch' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/provider-sku-mapping-references/preview:
    post:
      tags: [Imports, MasterData]
      operationId: previewProviderSkuMappingReference
      description: >-
        Read-only exact-name comparison between a SKU mapping reference workbook and a
        source-order file. It never writes products, SKUs, provider mappings, or source mappings.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [reference_file, source_file]
              properties:
                reference_file:
                  type: string
                  format: binary
                  description: SKU mapping reference only; never interpreted as an order or export template
                source_file:
                  type: string
                  format: binary
                  description: CAISHIXIAN, JUFUBAO, or FEIXIANG source-order file
      responses:
        '200':
          description: Mapping candidates and review reasons; no master data was written
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderSkuMappingReferencePreview' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/import-batches/{batch_id}:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    get:
      tags: [Imports]
      operationId: getImportBatch
      responses:
        '200':
          description: Import batch summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatch' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/import-batches/{batch_id}/rows:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    get:
      tags: [Imports]
      operationId: listImportRows
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RawRowStatus' }
      responses:
        '200':
          description: Raw-row lineage and validation results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RawImportRowPage' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/import-batches/{batch_id}/source-return-exports:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    get:
      tags: [Imports, Exports]
      operationId: listSourceReturnExports
      responses:
        '200':
          description: Versioned source-format return files
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SourceReturnExport' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/source-return-exports/{export_id}/file:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    get:
      tags: [Exports]
      operationId: downloadSourceReturnFile
      parameters:
        - $ref: '#/components/parameters/Operator'
      responses:
        '200':
          description: Original-channel workbook or CSV
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/fulfillments:
    get:
      tags: [Fulfillments]
      operationId: listFulfillments
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - name: provider_id
          in: query
          schema: { $ref: '#/components/schemas/Identifier' }
        - name: shipping_progress
          in: query
          schema: { $ref: '#/components/schemas/ShippingProgress' }
        - name: outcome
          in: query
          schema: { $ref: '#/components/schemas/FulfillmentOutcome' }
      responses:
        '200':
          description: Fulfillment task page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FulfillmentPage' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/fulfillments/{fulfillment_id}:
    parameters:
      - $ref: '#/components/parameters/FulfillmentId'
    get:
      tags: [Fulfillments]
      operationId: getFulfillment
      responses:
        '200':
          description: Quantity conservation, shipment, procurement, and exception detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FulfillmentDetail' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/fulfillments/{fulfillment_id}/continuation-exports:
    parameters:
      - $ref: '#/components/parameters/FulfillmentId'
    post:
      tags: [Fulfillments, Exports]
      operationId: createContinuationExport
      description: >-
        Creates the next Shipment and an independent third-party export for a BUSINESS
        Fulfillment that is already PARTIALLY_SHIPPED. The command locks and version-checks
        the Fulfillment and rejects quantities above the unallocated remainder.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContinuationExportCommand' }
      responses:
        '201':
          description: Continuation Shipment and provider export created; an idempotent replay returns the same result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContinuationExport' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/fulfillment-exports:
    get:
      tags: [Exports]
      operationId: listFulfillmentExports
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - name: provider_id
          in: query
          schema: { $ref: '#/components/schemas/Identifier' }
        - name: usage_status
          in: query
          schema: { $ref: '#/components/schemas/ExportUsageStatus' }
      responses:
        '200':
          description: Automatically generated provider files
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FulfillmentExportPage' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/fulfillment-exports/{export_id}:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    get:
      tags: [Exports]
      operationId: getFulfillmentExport
      responses:
        '200':
          description: Export lines, download audit, and tracking-return linkage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FulfillmentExportDetail' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/fulfillment-exports/{export_id}/file:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    get:
      tags: [Exports]
      operationId: downloadFulfillmentExportFile
      parameters:
        - $ref: '#/components/parameters/Operator'
      responses:
        '200':
          description: JD official workbook or system-defined third-party workbook
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/fulfillment-exports/{export_id}/tracking-imports:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    post:
      tags: [Exports, Imports]
      operationId: uploadProviderTrackingFile
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                import_mode: { $ref: '#/components/schemas/ImportMode' }
                parent_import_batch_id: { $ref: '#/components/schemas/Identifier' }
      responses:
        '201':
          description: >-
            Whole provider batch accepted atomically and linked to this export. Replaying
            identical bytes for the same export returns the first complete result, including
            business_results and generated_source_return_export_ids, without a new source return.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackingImportBatch' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/tracking-imports/{batch_id}:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    get:
      tags: [Imports]
      operationId: getTrackingImport
      responses:
        '200':
          description: Provider result rows and source-return generation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackingImportBatch' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/shipments:
    get:
      tags: [Shipments]
      operationId: listShipments
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - name: provider_id
          in: query
          schema: { $ref: '#/components/schemas/Identifier' }
        - name: shipment_status
          in: query
          schema: { $ref: '#/components/schemas/ShipmentStatus' }
      responses:
        '200':
          description: Shipment page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentPage' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/shipments/{shipment_id}:
    parameters:
      - $ref: '#/components/parameters/ShipmentId'
    get:
      tags: [Shipments]
      operationId: getShipment
      responses:
        '200':
          description: Shipment items and tracking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/review-cases:
    get:
      tags: [Reviews]
      operationId: listReviewCases
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, RESOLVED, DISMISSED] }
        - name: reason_code
          in: query
          schema: { type: string, maxLength: 64 }
        - name: responsible_team
          in: query
          schema: { type: string, maxLength: 128 }
        - name: source_channel
          in: query
          description: Limits the queue to BUSINESS orders from this source channel.
          schema: { $ref: '#/components/schemas/SourceChannel' }
      responses:
        '200':
          description: BUSINESS manual-review queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewCasePage' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/review-cases/{case_id}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Reviews]
      operationId: getReviewCase
      responses:
        '200':
          description: Review subject, evidence, suggestions, and allowed actions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewCase' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/review-cases/{case_id}/resolve-customer:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Reviews]
      operationId: resolveCustomerReview
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveCustomerReviewCommand' }
      responses:
        '200':
          description: Existing active BUSINESS customer linked and review resolved atomically; no customer is created by this command
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewCase' }
        '409':
          description: expected_version is stale, the review is no longer OPEN, or evidence/mapping conflicts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/review-cases/{case_id}/resolve-sku:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Reviews]
      operationId: resolveSkuReview
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveSkuReviewCommand' }
      responses:
        '200':
          description: Existing active SKU and explicit source mapping saved atomically; no SKU is created by this command
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewCase' }
        '409':
          description: expected_version is stale, the review is no longer OPEN, or evidence/mapping conflicts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/review-cases/{case_id}/resolve-carrier:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Reviews]
      operationId: resolveCarrierReview
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveCarrierReviewCommand' }
      responses:
        '200':
          description: Channel carrier mapping saved and review resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewCase' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/review-cases/{case_id}/resolve-import-data:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Reviews]
      operationId: resolveImportDataReview
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveImportDataCommand' }
      responses:
        '200':
          description: Pre-commit import data corrected and review resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewCase' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/review-cases/{case_id}/complete-source-followup:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Reviews]
      operationId: completeSourceFollowup
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteSourceFollowupCommand' }
      responses:
        '200':
          description: Review, processing stage, event, version, and audit committed atomically
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewCase' }
        '409':
          description: expected_version is stale or terminal-fulfillment/all-real-shipment-tracking gates are not satisfied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/operational-alerts:
    get:
      tags: [Reviews]
      operationId: listOperationalAlerts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED] }
        - name: severity
          in: query
          schema: { type: string, enum: [YELLOW, RED] }
      responses:
        '200':
          description: Non-blocking operational alerts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationalAlertPage' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/operational-alerts/{alert_id}/acknowledge:
    parameters:
      - $ref: '#/components/parameters/AlertId'
    post:
      tags: [Reviews]
      operationId: acknowledgeOperationalAlert
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedNoteCommand' }
      responses:
        '200':
          description: Alert acknowledged without changing business state
          content:
            application/json:

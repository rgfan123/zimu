        note: { type: string }
    ExcludedCandidate:
      type: object
      description: 被剔除的候选及其原因。
      required: [provider_code, price, price_basis, exclusion_reason]
      properties:
        provider_code: { type: string }
        price: { $ref: '#/components/schemas/DecimalQuantity' }
        price_basis: { type: string, enum: [sku_commercial_price, provider_sku] }

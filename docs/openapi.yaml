        messagesRemoved: { type: integer, format: int32 }
        mediaRowsRemoved: { type: integer, format: int32 }
        filesRemoved: { type: integer, format: int32 }
    WecomNotificationDelivery:
      type: object
      description: >-
        One source fact x intended recipient delivery trace. reasonCode/reasonMessage explain
        blocked, failed or unknown outcomes without exposing source payload or customer PII.
      required:
        - deliveryId
        - batchId
        - sourceType
        - sourceId
        - notificationKind
        - responsibleTeam
        - status
        - attemptCount
        - windowStart
        - updatedAt
      properties:
        deliveryId: { type: string }
        batchId: { type: string }
        sourceType: { type: string, enum: [REVIEW_CASE, ORDER_EVENT] }
        sourceId: { type: string }
        notificationKind: { type: string, enum: [REVIEW_CASE, ORDER_CREATED, SHIPMENT_COMPLETED] }
        responsibleTeam: { type: string }
        recipientDisplayName: { type: string, nullable: true }
        recipientUserid: { type: string, nullable: true }
        status:
          type: string
          enum: [SENDING, SENT, RETRY_PENDING, BLOCKED, UNKNOWN, FAILED]
        attemptCount: { type: integer, format: int32, minimum: 0 }
        requestId: { type: string, nullable: true }
        reasonCode: { type: string, nullable: true }
        reasonMessage: { type: string, nullable: true }
        alertId:
          type: string
          nullable: true
          description: Durable operations alert projection id for BLOCKED/UNKNOWN/FAILED.
        alertKey: { type: string, nullable: true }
        alertSeverity: { type: string, enum: [YELLOW, RED], nullable: true }
        windowStart: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PageResponseWecomNotificationDelivery:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/WecomNotificationDelivery' }

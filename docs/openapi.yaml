              schema: { $ref: '#/components/schemas/ConnectorConfig' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    patch:
      tags: [Connectors]
      operationId: updateConnector
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectorPatch' }
      responses:
        '200':
          description: Non-secret connector configuration updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorConfig' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/connectors/{source_channel}/test-connection:
    parameters:
      - $ref: '#/components/parameters/SourceChannelPath'
    post:
      tags: [Connectors]
      operationId: testConnectorConnection
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      responses:
        '200':
          description: Mock or real adapter connection result; does not advance orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionTestResult' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/platform-orders/refresh:
    post:
      tags: [Connectors]
      operationId: refreshPlatformOrders
      description: >-
        Manually triggers a one-shot refresh of CAISHIXIAN / JUFUBAO / FEIXIANG order data.
        Only enabled REAL + API connectors may pull. Concurrent refreshes of the same channel
        are coalesced so only one reaches the platform; completed attempts impose no frequency
        limit. Java connectors run first and safely supported script fallbacks still enter the
        existing ImportBatch manual-confirm loop. JUFUBAO may pull captured order facts online;
        rows without a verified receiver contract are retained as NEED_REVIEW evidence and do not
        create fulfillable orders.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Per-channel fetch results with counts
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/jd-warehouse/owners:
    get:
      summary: Discover authorized JD business units
      tags: [Fulfillment]
      operationId: queryJdOwners
      description: Read-only JD Logistics SDK query using the authorized PIN. Contact names, phone numbers, email addresses and physical addresses are removed from the response.
      responses:
        '200':
          description: Normalized and privacy-filtered JD SDK result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JdQueryResult' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/jd-warehouse/warehouses:
    get:
      summary: Check JD warehouse query permission
      tags: [Fulfillment]
      operationId: queryJdWarehouses
      description: Read-only JD Logistics SDK permission and warehouse query.
      parameters:
        - name: warehouse_no
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Normalized JD SDK result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JdQueryResult' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/jd-warehouse/status:
    get:
      summary: Inspect JD SDK readiness without exposing credentials
      tags: [Fulfillment]
      operationId: getJdClientStatus
      responses:

        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/jd-warehouse/outbound-orders/{erp_delivery_no}:
    get:
      summary: Query JD outbound shipment facts
      tags: [Fulfillment]
      operationId: queryJdOutboundOrder
      description: Read-only shipment fact query. Receiver and customer personal data are removed from the response.
      parameters:
        - name: erp_delivery_no
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Normalized and privacy-filtered JD SDK result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JdQueryResult' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/jd-warehouse/tracking:
    get:
      summary: Query JD tracking events
      tags: [Fulfillment]
      operationId: queryJdTracking
      description: Read-only tracking query for an already known waybill or warehouse order.
      parameters:
        - name: waybill_no
          in: query
          schema: { type: string }
        - name: warehouse_order_no
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Normalized JD SDK result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JdQueryResult' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/jd-sku-mapping/check:
    post:
      tags: [Connectors]
      operationId: checkJdSkuMapping
      description: >-
        Manually triggers the global JD cloud-warehouse SKU mapping reconciliation. Results
        are classified by difference kind and written into operational alerts or audit;
        the check is read-only against JD and never creates a shipment.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Operator'
      responses:
        '200':
          description: Reconciliation run completed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/outbound-recon:
    get:
      summary: Outbound internal-vs-JD fact reconciliation
      tags: [Fulfillment]
      operationId: queryOutboundRecon
      description: >-
        Side-by-side internal and JD facts for one outbound (Shipment). The query converges through
        system outbound order no / JD delivery no / order no onto the same outbound; internal facts
        always return, while JD status is OK / NOT_FOUND / UNAVAILABLE so that "not fetched" or
        "no record" is never rendered as an empty value. Each query is audited (outbound.recon.query).
      parameters:
        - name: query_type
          in: query
          required: true
          schema:
            type: string
            enum: [OUTBOUND_ORDER_NO, JD_DELIVERY_NO, ORDER_NO]
        - name: query_value
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Aligned internal and JD facts with per-field diff states
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutboundReconView' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/admin/message-pipeline/summary:
    get:
      tags: [Operations]
      operationId: getMessagePipelineSummary
      description: >-
        Authorized run-visibility summary for the message pipeline: backlog, retrying, final failures,
        media failures, and the configurable retention window. Counts only; never exposes payloads,
        raw error text, or secrets. Final failures are visible only in the admin surface and are never
        re-sent into any source group.

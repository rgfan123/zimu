name: zimu-fulfillment

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fulfillment_hub
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the deployment environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the deployment environment}
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env.jd.uat.local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fulfillment_hub
      DB_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER in the deployment environment}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the deployment environment}
      APP_ADMIN_USER: ${APP_ADMIN_USER:?set APP_ADMIN_USER in the deployment environment}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?set APP_ADMIN_PASSWORD in the deployment environment}
      APP_INTERNAL_SERVICE_NAME: ${APP_INTERNAL_SERVICE_NAME:-}
      APP_INTERNAL_SERVICE_TOKEN: ${APP_INTERNAL_SERVICE_TOKEN:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_FILE_STORE_ROOT: /var/lib/zimu-fulfillment/files
      # 媒体受控存储目录必须持久化（wecom-message-intake 12）：服务重启后原图仍能从受权接口读取。
      APP_MEDIA_DIR: /var/lib/zimu-fulfillment/media
      DEMO_SEED_ENABLED: "${DEMO_SEED_ENABLED:-false}"
      DEMO_SEED_REFERENCE_DATE: ${DEMO_SEED_REFERENCE_DATE:-}
      SAMPLE_MASTER_DATA_ENABLED: "false"
      JD_INITIAL_SKU_LIBRARY_ENABLED: "false"
      JD_LOP_CLIENT_MODE: ${JD_LOP_CLIENT_MODE:-MOCK}
      JD_LOP_WRITE_MODE: ${JD_LOP_WRITE_MODE:-OFF}
      JD_GENERIC_HTTP_WRITE_MODE: "OFF"
      JD_OUTBOUND_AUTHORIZED_OPERATORS: ${JD_OUTBOUND_AUTHORIZED_OPERATORS:-}
      JD_TRACKING_BACKFILL_ENABLED: "${JD_TRACKING_BACKFILL_ENABLED:-false}"
      JD_TRACKING_BACKFILL_POLL_MS: "${JD_TRACKING_BACKFILL_POLL_MS:-60000}"
      JD_TRACKING_BACKFILL_BATCH_SIZE: "${JD_TRACKING_BACKFILL_BATCH_SIZE:-20}"
      JD_TRACKING_BACKFILL_MIN_INTERVAL: "${JD_TRACKING_BACKFILL_MIN_INTERVAL:-PT1M}"
      ZHONGHUI_PMS_CLIENT_MODE: ${ZHONGHUI_PMS_CLIENT_MODE:-MOCK}
      # REAL 连接模式不等于授权写入；生产缺省保持第二道门闩 OFF。
      ZHONGHUI_PMS_WRITE_MODE: ${ZHONGHUI_PMS_WRITE_MODE:-OFF}
      ZHONGHUI_PMS_REQUEST_TIMEOUT: ${ZHONGHUI_PMS_REQUEST_TIMEOUT:-PT30S}
      ZHONGHUI_PMS_IDEMPOTENCY_LEASE: ${ZHONGHUI_PMS_IDEMPOTENCY_LEASE:-PT40M}
      ZHONGHUI_PMS_BASE_URL: ${ZHONGHUI_PMS_BASE_URL:-}
      ZHONGHUI_PMS_USERNAME: ${ZHONGHUI_PMS_USERNAME:-}
      ZHONGHUI_PMS_PASSWORD: ${ZHONGHUI_PMS_PASSWORD:-}
      ZHONGHUI_PMS_DEFAULT_BRAND_ID: ${ZHONGHUI_PMS_DEFAULT_BRAND_ID:-}
      ZHONGHUI_PMS_DEFAULT_CERTIFICATION_TYPE: ${ZHONGHUI_PMS_DEFAULT_CERTIFICATION_TYPE:-}
      ZHONGHUI_PMS_DEFAULT_CERTIFICATION_ID: ${ZHONGHUI_PMS_DEFAULT_CERTIFICATION_ID:-}
      ZHONGHUI_PMS_DEFAULT_THIRD_ID: ${ZHONGHUI_PMS_DEFAULT_THIRD_ID:-}
      ZHONGHUI_PMS_DEFAULT_LIMIT_AREA_TEMP_ID: ${ZHONGHUI_PMS_DEFAULT_LIMIT_AREA_TEMP_ID:-}
      ZHONGHUI_PMS_DEFAULT_GOODS_TAX: ${ZHONGHUI_PMS_DEFAULT_GOODS_TAX:-}
      ZHONGHUI_PMS_DEFAULT_LOGISTICS_CARRIER: ${ZHONGHUI_PMS_DEFAULT_LOGISTICS_CARRIER:-}
      ZHONGHUI_PMS_DEFAULT_PRODUCING_AREA: ${ZHONGHUI_PMS_DEFAULT_PRODUCING_AREA:-}
      ZHONGHUI_PMS_DEFAULT_GOODS_NUM: ${ZHONGHUI_PMS_DEFAULT_GOODS_NUM:-99}
      ZHONGHUI_PMS_DEFAULT_SALE_UNIT: ${ZHONGHUI_PMS_DEFAULT_SALE_UNIT:-件}
      ZHONGHUI_PMS_DEFAULT_ORIGIN_COUNTRY: ${ZHONGHUI_PMS_DEFAULT_ORIGIN_COUNTRY:-1}
      # 三平台拉取/回传凭据：走环境变量（红线「凭据只走环境变量」），值来自 .env 或部署环境；
      # data-local 挂载的凭据文件仅作为本地开发兜底（PlatformScriptRunner/Connector env 优先）。
      CSX_USERNAME: ${CSX_USERNAME:-}
      CSX_PASSWORD: ${CSX_PASSWORD:-}
      CSX_SUPPLIER_CODE: ${CSX_SUPPLIER_CODE:-20075684}
      CSX_SHIPMENT_VERIFY_ATTEMPTS: ${CSX_SHIPMENT_VERIFY_ATTEMPTS:-5}
      CSX_SHIPMENT_VERIFY_DELAY: ${CSX_SHIPMENT_VERIFY_DELAY:-PT2S}
      # JUFUBAO_* 是 .env.example 的规范名；同时透传历史 JFUBAO_*，便于无中断升级。
      JUFUBAO_USERNAME: ${JUFUBAO_USERNAME:-}
      JUFUBAO_PASSWORD: ${JUFUBAO_PASSWORD:-}
      JUFUBAO_API_BASE: ${JUFUBAO_API_BASE:-https://supplier-apis.jufubao.cn}
      JUFUBAO_PORTAL_BASE: ${JUFUBAO_PORTAL_BASE:-https://g.jufubao.cn}
      JUFUBAO_STATE_POLL_ATTEMPTS: ${JUFUBAO_STATE_POLL_ATTEMPTS:-5}
      JUFUBAO_STATE_POLL_DELAY: ${JUFUBAO_STATE_POLL_DELAY:-PT2S}
      JFUBAO_USERNAME: ${JFUBAO_USERNAME:-}
      JFUBAO_PASSWORD: ${JFUBAO_PASSWORD:-}
      FEIXIANG_USERNAME: ${FEIXIANG_USERNAME:-}
      FEIXIANG_PASSWORD: ${FEIXIANG_PASSWORD:-}
      WECOM_BUSINESS_RELAY_ENABLED: ${WECOM_BUSINESS_RELAY_ENABLED:-false}
      WECOM_ENABLED: ${WECOM_ENABLED:-false}
      WECOM_SECRET: ${WECOM_SECRET:-}
      WECOM_HEARTBEAT_INTERVAL_SECONDS: ${WECOM_HEARTBEAT_INTERVAL_SECONDS:-30}
      WECOM_CORP_ID: ${WECOM_CORP_ID:-}
      WECOM_BOT_ID: ${WECOM_BOT_ID:-}
      WECOM_CALLBACK_TOKEN: ${WECOM_CALLBACK_TOKEN:-}
      WECOM_ENCODING_AES_KEY: ${WECOM_ENCODING_AES_KEY:-}
      WECOM_ALLOWED_GROUP_IDS: ${WECOM_ALLOWED_GROUP_IDS:-}
      WECOM_PUBLIC_CALLBACK_BASE_URL: ${WECOM_PUBLIC_CALLBACK_BASE_URL:-}
      MESSAGE_INTERPRETER_PROVIDER: ${MESSAGE_INTERPRETER_PROVIDER:-}
      MESSAGE_INTERPRETER_MODEL: ${MESSAGE_INTERPRETER_MODEL:-}
      MESSAGE_INTERPRETER_PROMPT_VERSION: ${MESSAGE_INTERPRETER_PROMPT_VERSION:-}
      MESSAGE_INTERPRETER_BASE_URL: ${MESSAGE_INTERPRETER_BASE_URL:-}
      MESSAGE_INTERPRETER_API_KEY: ${MESSAGE_INTERPRETER_API_KEY:-}
      MESSAGE_INTERPRETER_PUBLIC_PROVIDER_ALIAS: ${MESSAGE_INTERPRETER_PUBLIC_PROVIDER_ALIAS:-}
      MESSAGE_INTERPRETER_PUBLIC_MODEL_ALIAS: ${MESSAGE_INTERPRETER_PUBLIC_MODEL_ALIAS:-}
      MESSAGE_INTERPRETER_PUBLIC_PROMPT_VERSION_ALIAS: ${MESSAGE_INTERPRETER_PUBLIC_PROMPT_VERSION_ALIAS:-}
      # 平台拉取只做同渠道并发单飞，不设置次数或最小间隔。
      APP_PLATFORM_PULL_PUSH_STALE_TIMEOUT: ${APP_PLATFORM_PULL_PUSH_STALE_TIMEOUT:-PT15M}
      SOURCE_SYNC_IDEMPOTENCY_LEASE: ${SOURCE_SYNC_IDEMPOTENCY_LEASE:-PT10M}
      SOURCE_SYNC_RECOVERY_ENABLED: ${SOURCE_SYNC_RECOVERY_ENABLED:-true}
      SOURCE_SYNC_RECOVERY_INITIAL_DELAY_MS: ${SOURCE_SYNC_RECOVERY_INITIAL_DELAY_MS:-60000}
      SOURCE_SYNC_RECOVERY_POLL_MS: ${SOURCE_SYNC_RECOVERY_POLL_MS:-60000}
      SOURCE_SYNC_RECOVERY_BATCH_SIZE: ${SOURCE_SYNC_RECOVERY_BATCH_SIZE:-50}
      TZ: Asia/Shanghai
    volumes:
      - fulfillment-files:/var/lib/zimu-fulfillment/files
      # wecom-message-intake 12：内容寻址媒体存储挂载持久化命名卷，重启不丢原图。
      - app-media-data:/var/lib/zimu-fulfillment/media
      # 三平台订单刷新通道（platform-pull）：拉取脚本 + 本地凭据文件挂载进容器，
      # 后端在容器内直接执行拉取并自动上传导入批次。
      - ./scripts:/app/platform-pull-scripts:ro
      - ./data-local:/app/platform-pull-credentials:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  order-assistant:
    build:
      context: .
      dockerfile: prototype/customer-order-assistant/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8765
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_CHAT_PATH: ${LLM_CHAT_PATH:-/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TRANSPORT: ${LLM_TRANSPORT:-urllib}
      ORDER_API_BASE_URL: http://backend:8080
      ORDER_API_PATH: /demo/v1/extracted-orders
      # 订单助手直连后端时使用独立内部服务身份；不得复用管理网关 Basic 凭据。
      APP_INTERNAL_SERVICE_NAME: ${APP_INTERNAL_SERVICE_NAME:?set APP_INTERNAL_SERVICE_NAME in the deployment environment}
      APP_INTERNAL_SERVICE_TOKEN: ${APP_INTERNAL_SERVICE_TOKEN:?set APP_INTERNAL_SERVICE_TOKEN in the deployment environment}
      BUILTIN_ORDER_API_ENABLED: "false"
      TZ: Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  metabase:
    image: metabase/metabase:v0.52.13
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:?set POSTGRES_USER in the deployment environment}
      MB_DB_PASS: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the deployment environment}
      MB_DB_HOST: postgres
      MB_SITE_URL: http://localhost:${APP_PORT:-8088}/metabase
      JAVA_TIMEZONE: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  metabase-init:
    build:
      context: .
      dockerfile: docker/metabase-init/Dockerfile
    environment:
      METABASE_INTERNAL_URL: http://metabase:3000
      METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL:?set METABASE_ADMIN_EMAIL in the deployment environment}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:?set METABASE_ADMIN_PASSWORD in the deployment environment}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the deployment environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the deployment environment}
    depends_on:
      metabase:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/metabase-provisioned"]
      interval: 2s
      timeout: 2s
      retries: 900
      start_period: 5s
    restart: "no"

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    environment:
      APP_ADMIN_USER: ${APP_ADMIN_USER:?set APP_ADMIN_USER in the deployment environment}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?set APP_ADMIN_PASSWORD in the deployment environment}
      # Edge Basic Auth defaults on; set false only for controlled LAN acceptance
      # (the nginx entrypoint logs a warning and the gateway becomes open to any
      # client that can reach it).
      GATEWAY_BASIC_AUTH_ENABLED: "${GATEWAY_BASIC_AUTH_ENABLED:-true}"
    ports:
      # Edge Basic Auth is on by default (single shared admin credential), and the
      # gateway stays loopback-bound. Remote deployments require real user auth and HTTPS first.
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8088}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      order-assistant:
        condition: service_healthy
      metabase:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  fulfillment-files:
  # wecom-message-intake 12：媒体受控存储持久化卷（backend APP_MEDIA_DIR）。
  app-media-data:

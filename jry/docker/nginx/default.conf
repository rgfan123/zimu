map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend_upstream {
    zone backend_upstream 64k;
    server backend:8080 resolve;
}

upstream frontend_upstream {
    zone frontend_upstream 64k;
    server frontend:80 resolve;
}

upstream order_assistant_upstream {
    zone order_assistant_upstream 64k;
    server order-assistant:8765 resolve;
}

upstream metabase_upstream {
    zone metabase_upstream 64k;
    server metabase:3000 resolve;
}

server {
    listen 80;
    server_name _;
    # Temporary LAN acceptance mode: the UI is reachable without HTTP Basic.
    # Sensitive JD writes remain independently fail-closed in the backend.
    auth_basic off;

    location = /healthz {
        auth_basic off;
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Enterprise WeChat cannot present the management Basic Auth credentials.
    # The callback authenticates itself with msg_signature instead.
    location /wecom/callbacks/ {
        auth_basic off;
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Operator "";
        proxy_set_header Authorization "";
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Browser access is passwordless during LAN acceptance, while Nginx still
        # supplies the backend-authenticated operator required by unsafe APIs.
        include /etc/nginx/backend-auth.inc;
        # 三平台订单刷新（platform-pull）会同步执行拉取脚本（彩食鲜 export 轮询最坏 ~100s），
        # 放宽读超时避免网关提前 504。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /internal/ {
        return 404;
    }

    location = /demo/v1 {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Operator "local-operator";
        proxy_set_header Authorization "";
    }

    location /demo/v1/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Operator "local-operator";
        proxy_set_header Authorization "";
    }

    location /actuator/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Operator "local-operator";
        proxy_set_header Authorization "";
    }

    location /customer/v1/order-assistant/ {
        proxy_pass http://order_assistant_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Authenticated-User "local-operator";
        proxy_set_header Authorization "";
        proxy_read_timeout 90s;
    }

    location = /metabase {
        return 302 /metabase/;
    }

    location /metabase/ {
        proxy_pass http://metabase_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Authorization "";
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
    }
}

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>原型 · 工作台与数据中台形态（A/B/C）</title>
<!--
  ============================================================================
  一次性原型 —— 不是生产代码，不要往 main 合。
  ============================================================================
  问题：工作台 + 数据中台四页（履约总览/渠道分析/商品分析/履约分析）长什么样？
  形态：三个结构性不同的变体，同一份确定性假数据，?variant=A|B|C 切换，
        底部悬浮条 / ←→ 方向键翻。项目暂无前端工程，故用独立原型页承载
        （UI.md sub-shape B），自带侧边栏/顶栏以便按真实密度评判。
  票：wayfinder/tickets/dashboard-ui-prototype.md
  口径与指标：PRD §21 / 地图 Notes「数据呈现设计」（2026-08-10 已定）。
  无构建、无依赖、无网络、无持久化：图表全部手绘 SVG，数据固定随机种子。
  ============================================================================
-->
<style>
:root{
  --bg:#f4f6f9; --panel:#fff; --panel2:#fbfcfe; --ink:#1c2230; --ink2:#3d4759;
  --muted:#7a8699; --line:#e4e8ee; --line2:#eef1f6;
  --brand:#2563eb; --ok:#16a34a; --warn:#f59e0b; --danger:#ef4444;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 2px 8px rgba(16,24,40,.06);
  --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1218; --panel:#161b23; --panel2:#1b212b; --ink:#e7ebf2; --ink2:#c3cad6;
    --muted:#8b97a8; --line:#242c38; --line2:#1e2530; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; padding-bottom:64px;
}
button{font:inherit;color:inherit}
table{border-collapse:collapse;width:100%}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- 通用外壳 ---------- */
.shell{display:grid;min-height:100vh}
.brand{display:flex;align-items:center;gap:9px;padding:16px 16px 14px;font-weight:600;letter-spacing:.2px}
.brand .dot{width:22px;height:22px;border-radius:6px;background:var(--brand);flex:none;
  display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.nav{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.nav-group{padding:14px 16px 4px;font-size:11px;color:var(--muted);letter-spacing:.6px}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 16px;color:var(--ink2);cursor:pointer;
  border-left:2px solid transparent;font-size:13px}
.nav-item:hover{background:var(--line2)}
.nav-item.on{color:var(--brand);border-left-color:var(--brand);background:var(--line2);font-weight:600}
.nav-item.off{color:var(--muted);opacity:.55;cursor:default}
.nav-item.off:hover{background:transparent}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:0 20px;height:54px;
  background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.crumb{color:var(--muted);font-size:13px}
.crumb b{color:var(--ink);font-weight:600}
.spacer{flex:1}
.chip-proto{font-size:11px;padding:3px 8px;border-radius:99px;background:#f59e0b1f;color:#b45309;
  border:1px solid #f59e0b40;white-space:nowrap}
@media (prefers-color-scheme:dark){.chip-proto{color:#fbbf24}}
.content{padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}

/* 段控件 / 筛选 */
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:5px 12px;background:transparent;border:0;cursor:pointer;color:var(--ink2);font-size:13px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--brand);color:#fff}
.seg button:disabled{color:var(--muted);opacity:.5;cursor:not-allowed}
.chipset{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);
  cursor:pointer;font-size:12px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.chip .sw{width:8px;height:8px;border-radius:99px}
.chip.on{border-color:transparent;color:#fff}
.label{font-size:12px;color:var(--muted)}

/* 卡片 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line2)}
.card-h h3{margin:0;font-size:14px;font-weight:600}
.card-h .sub{font-size:12px;color:var(--muted)}
.card-b{padding:14px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:1100px){.grid2,.grid3{grid-template-columns:1fr}}

/* KPI 卡（变体 A） */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
@media (max-width:1280px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow)}
.kpi .t{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:26px;font-weight:650;margin-top:6px;letter-spacing:-.5px}
.kpi .d{font-size:12px;margin-top:4px;color:var(--muted)}
.up{color:var(--ok)} .down{color:var(--danger)}
.kpi.alert .v{color:var(--danger)}

/* 表格 */
.tbl{font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;
  padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right}
.tbl tbody tr:hover{background:var(--line2)}
.tbl .tot td{font-weight:650;border-top:1px solid var(--line);background:var(--panel2)}
.scroll-x{overflow-x:auto}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid transparent}
.tag.red{background:#ef44441f;color:#dc2626;border-color:#ef444433}
.tag.amber{background:#f59e0b1f;color:#b45309;border-color:#f59e0b33}
.tag.blue{background:#2563eb1a;color:#2563eb;border-color:#2563eb33}
.tag.grey{background:var(--line2);color:var(--muted);border-color:var(--line)}
@media (prefers-color-scheme:dark){
  .tag.red{color:#f87171}.tag.amber{color:#fbbf24}.tag.blue{color:#7ea6ff}
}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.bar-row{display:grid;grid-template-columns:120px 1fr 64px;align-items:center;gap:10px;padding:5px 0;font-size:13px}
.bar-track{background:var(--line2);border-radius:4px;height:16px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.mini{display:inline-block;vertical-align:middle}

/* ---------- 变体 A：分页控制台 ---------- */
.shell.a{grid-template-columns:214px 1fr}

/* ---------- 变体 B：单屏指挥中心 ---------- */
.shell.b{grid-template-columns:60px 1fr}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;
  align-items:center;padding-top:12px;gap:6px}
.rail .dot{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:13px;margin-bottom:8px}
.rail button{width:40px;height:40px;border-radius:9px;border:0;background:transparent;cursor:pointer;
  color:var(--muted);font-size:17px;display:grid;place-items:center}
.rail button:hover{background:var(--line2);color:var(--ink)}
.rail button.on{background:#2563eb1a;color:var(--brand)}
.filterbar{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bento{padding:16px 18px;display:grid;grid-template-columns:repeat(12,1fr);gap:14px;align-content:start}
.bento .card{display:flex;flex-direction:column}
.bento .card-b{flex:1}
.sp3{grid-column:span 3}.sp4{grid-column:span 4}.sp5{grid-column:span 5}
.sp6{grid-column:span 6}.sp7{grid-column:span 7}.sp8{grid-column:span 8}
.sp9{grid-column:span 9}.sp12{grid-column:span 12}
@media (max-width:1200px){.bento>*{grid-column:span 12 !important}}
.tower{display:flex;flex-direction:column;gap:0}
.tower .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:11px 0;border-bottom:1px dashed var(--line)}
.tower .row:last-child{border-bottom:0}
.tower .k{font-size:12px;color:var(--muted)}
.tower .v{font-size:21px;font-weight:650;letter-spacing:-.4px}
.tower .v small{font-size:11px;color:var(--muted);font-weight:400;margin-left:4px}
.clickable{cursor:pointer}
.hint{font-size:11px;color:var(--muted)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,92vw);background:var(--panel);
  border-left:1px solid var(--line);box-shadow:-8px 0 28px rgba(16,24,40,.14);z-index:40;
  display:flex;flex-direction:column}
.drawer header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer header h3{margin:0;font-size:15px}
.drawer .body{padding:14px 16px;overflow:auto}
.x{border:0;background:var(--line2);width:26px;height:26px;border-radius:7px;cursor:pointer;color:var(--muted)}
.heat td.cell{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- 变体 C：运营台账 ---------- */
.shell.c{grid-template-columns:196px 1fr}
.strip{background:var(--panel);border-bottom:1px solid var(--line);padding:9px 18px;
  display:flex;align-items:center;gap:0;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.strip .m{padding:2px 18px;border-right:1px solid var(--line);display:flex;align-items:center;gap:9px}
.strip .m:last-child{border-right:0}
.strip .m .k{font-size:11px;color:var(--muted);display:block}
.strip .m .v{font-size:18px;font-weight:650;letter-spacing:-.3px;line-height:1.2}
.strip .m .v.bad{color:var(--danger)}
.ledger{display:grid;grid-template-columns:1fr 268px;gap:0;align-items:start;min-width:0}
@media (max-width:1150px){.ledger{grid-template-columns:1fr}}
.ledger-main{padding:14px 18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.rail-right{border-left:1px solid var(--line);background:var(--panel);padding:14px;
  display:flex;flex-direction:column;gap:16px;min-height:calc(100vh - 54px - 52px)}
.rail-right h4{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.4px}
.alert-row{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12px}
.alert-row:last-child{border-bottom:0}
.alert-row .b{width:3px;align-self:stretch;border-radius:2px;flex:none}
.ledger .tbl th{position:sticky;top:0;z-index:1}
.ledger .tbl td{border-bottom:1px solid var(--line2)}
.ledger .tbl .grp td{background:var(--panel2);font-weight:600}
.cellbar{display:block;height:4px;border-radius:2px;margin-top:3px;opacity:.85}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* ---------- 变体 D：图表优先（B 的精修版） ---------- */
.shell.d{grid-template-columns:60px 1fr}
.shell.d .card{border-radius:14px}
.shell.d .card-h{padding:14px 18px 10px;border-bottom:0}
.shell.d .card-h h3{font-size:14.5px;letter-spacing:-.2px}
.shell.d .card-b{padding:4px 14px 14px}
.d-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
@media (max-width:1280px){.d-kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:760px){.d-kpis{grid-template-columns:repeat(2,1fr)}}
.d-kpi{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:14px 16px 34px;box-shadow:var(--shadow);min-height:112px}
.d-kpi .t{font-size:12px;color:var(--muted)}
.d-kpi .v{font-size:27px;font-weight:650;letter-spacing:-.7px;margin-top:3px;line-height:1.15}
.d-kpi .u{font-size:11px;color:var(--muted);font-weight:400;margin-left:3px}
.d-kpi .dl{font-size:11px;margin-top:2px;position:relative;z-index:1}
.d-kpi .sp{position:absolute;left:0;right:0;bottom:0;pointer-events:none;opacity:.9}
.d-kpi .sp svg{width:100%;height:30px;display:block}
.heatgrid{display:grid;gap:4px}
.hg-h{font-size:11.5px;color:var(--muted);text-align:center;padding:0 0 2px}
.hg-l{font-size:12.5px;display:flex;align-items:center;gap:6px;padding-right:10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.hg-c{border-radius:7px;display:grid;place-items:center;font-size:12px;cursor:pointer;
  font-variant-numeric:tabular-nums;min-height:34px;transition:transform .08s}
.hg-c:hover{transform:scale(1.04)}
.funnel{display:flex;flex-direction:column;padding-top:2px}
.fn-row{display:grid;grid-template-columns:96px 1fr 84px;align-items:center;gap:10px}
.fn-l{font-size:12px;color:var(--ink2);white-space:nowrap}
.fn-v{text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
.fn-v span{color:var(--muted);font-size:11px;margin-left:5px}
.mini-issue{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.mini-issue:last-child{border-bottom:0}
.mini-issue .d{width:7px;height:7px;border-radius:99px;flex:none}
.mini-issue .no{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11.5px}
/* 卡片右上角的「图 ↔ 文字版明细」切换 */
.io{border:1px solid var(--line);background:var(--panel2);color:var(--muted);width:27px;height:24px;
  border-radius:7px;cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
.io:hover{color:var(--brand);border-color:var(--brand);background:var(--panel)}
.io.on{color:var(--brand);border-color:var(--brand)}
.txtview{max-height:268px;overflow:auto;margin:0 -10px}
.txtview .tbl th{position:sticky;top:0;background:var(--panel);z-index:1}
.txtview .tbl td,.txtview .tbl th{padding:6px 10px;font-size:12.5px}

/* ---------- 悬浮切换条（原型脚手架，非设计的一部分） ---------- */
#switcher{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:100;
  display:flex;align-items:stretch;gap:0;background:#11161f;color:#fff;border-radius:99px;
  box-shadow:0 8px 26px rgba(0,0,0,.32);border:1px solid #ffffff26;overflow:hidden;
  font:13px/1 -apple-system,system-ui,sans-serif}
#switcher button{background:transparent;border:0;color:#fff;padding:0 15px;cursor:pointer;font-size:15px}
#switcher button:hover{background:#ffffff1f}
#switcher .lbl{padding:11px 16px;border-left:1px solid #ffffff26;border-right:1px solid #ffffff26;
  white-space:nowrap;display:flex;align-items:center;gap:8px}
#switcher .lbl b{font-weight:650}
#switcher .lbl span{opacity:.6;font-size:11px}
</style>
</head>
<body>
<div id="app"></div>
<div id="switcher"></div>

<script>
/* ============================================================================
 * 1. 确定性假数据（固定种子；三个变体共用，保证可比）
 * ==========================================================================*/
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(20260810);

const CHANNELS = [
  {key:'CAISHIXIAN', name:'彩食鲜',   color:'#2563eb', base:78},
  {key:'JUFUBAO',    name:'聚福宝',   color:'#0d9488', base:44},
  {key:'FEIXIANG',   name:'飞象',     color:'#f59e0b', base:36},
  {key:'WECOM',      name:'企业微信', color:'#8b5cf6', base:11},
];
const CH = Object.fromEntries(CHANNELS.map(c=>[c.key,c]));

/* 真实目录（来源：京东商品编号.xlsx，2026-08-10）。
   name = 内部简称（JD 列）；alias = 各渠道商品名 + 包装数量。
   注意两处真实结构，原型刻意保留：
   1) 同一 EMG 在不同渠道包装数量不同（羊棒骨 彩2/聚3、肩胛烤肉片 彩4/聚6）；
   2) 礼包是组合品（Sheet2 BOM），一行订单要炸开成 6~12 个 EMG。 */
const PRODUCTS = [
  {name:'上脑肉片',        emg:'EMG4418727174451', cat:'牛肉', unit:'kg', scale:1.1,
   alias:{CAISHIXIAN:['子牧澳洲谷饲上脑牛肉片1KG*1',1], JUFUBAO:['【京东配送】子牧澳洲谷饲上脑牛肉片1kg',1]}},
  {name:'牛腩块',          emg:'EMG4418727173231', cat:'牛肉', unit:'袋', scale:1.6,
   alias:{CAISHIXIAN:['子牧牛腩块500g*2',2], JUFUBAO:['【京东配送】子牧牛腩块500g*2袋',2]}},
  {name:'牛腱子（谷饲）',  emg:'EMG4418824976893', cat:'牛肉', unit:'袋', scale:1.5,
   alias:{CAISHIXIAN:['子牧牛腱子(谷饲牛腱子)500g*2',2], JUFUBAO:['【京东配送】子牧谷饲安格斯牛腱子肉500g*2袋',2]}},
  {name:'牛肋排',          emg:'EMG4418727173759', cat:'牛肉', unit:'袋', scale:1.2,
   alias:{CAISHIXIAN:['子牧澳洲谷饲牛肋排400g*2',2], JUFUBAO:['【京东配送】子牧澳洲谷饲牛肋排400g*2袋',2]}},
  {name:'肩胛烤肉片',      emg:'EMG4418904463768', cat:'牛肉', unit:'盒', scale:0.9, mismatch:true,
   alias:{CAISHIXIAN:['肩胛烤肉片120g*4',4], JUFUBAO:['【京东配送】子牧肩胛烤牛肉片120g*6',6]}},
  {name:'羊小腿（羊腱子）',emg:'EMG4418691851778', cat:'羊肉', unit:'袋', scale:1.4,
   alias:{CAISHIXIAN:['子牧羊小腿（羊腱子）500g*2',2], JUFUBAO:['【京东配送】子牧羊小腿（羊腱子）500g*2袋',2]}},
  {name:'带骨羊肉块',      emg:'EMG4418861052375', cat:'羊肉', unit:'袋', scale:1.3,
   alias:{CAISHIXIAN:['子牧带骨羊肉块500g*2',2], JUFUBAO:['【京东配送】子牧原切带骨羊肉块500g*2袋',2]}},
  {name:'羊蝎子',          emg:'EMG4418727170819', cat:'羊肉', unit:'袋', scale:1.5,
   alias:{CAISHIXIAN:['子牧羊蝎子500g*2',2], JUFUBAO:['【京东配送】子牧生鲜羊蝎子500g*2袋',2]}},
  {name:'羊棒骨',          emg:'EMG4418819505546', cat:'羊肉', unit:'袋', scale:1.0, mismatch:true,
   alias:{CAISHIXIAN:['子牧羊棒骨500g*2',2], JUFUBAO:['【京东配送】子牧羊棒骨500g*3袋',3]}},
  {name:'小龙坎火锅拼盘（6拼）', emg:'EMG4418691848450', cat:'火锅拼盘', unit:'盒', scale:0.8,
   alias:{CAISHIXIAN:['小龙坎火锅拼盘（肉类6拼）1.2KG',1], JUFUBAO:['【京东配送】小龙坎火锅食材肉类6拼盘1.2kg',1]}},
  {name:'牛羊礼包5800g',   emg:'—', cat:'礼包', unit:'盒', scale:0.55, bundle:9,
   alias:{CAISHIXIAN:['牛羊礼包5800g',1], JUFUBAO:['牛羊礼包5800g',1]}},

  JUFUBAO:   [0.9,1.1,1.0,0.9,1.0,1.0,0.9,1.1,0.7,0.9,0.4,0.2],

};
const CAT_COLOR = {'牛肉':'#2563eb','羊肉':'#0d9488','火锅拼盘':'#f59e0b','礼包':'#8b5cf6'};
const STATUSES = [
  {key:'PENDING_OUTBOUND', name:'待出库',     color:'#94a3b8'},
  {key:'SHIPPED',          name:'已出库',     color:'#2563eb'},
  {key:'AWAIT_TRACKING',   name:'待取得运单', color:'#0d9488'},
  {key:'PENDING_SYNC',     name:'待回传',     color:'#f59e0b'},
  {key:'SYNC_FAILED',      name:'回传失败',   color:'#ef4444'},
];

const DAYS = (()=>{
  const out=[];
  for(let i=59;i>=0;i--){                       // 多生成 30 天用于环比
    const d=new Date(Date.UTC(2026,7,10)); d.setUTCDate(d.getUTCDate()-i);
    const iso=d.toISOString().slice(0,10), dow=d.getUTCDay();
    const weekend=(dow===0||dow===6)?0.72:1, isToday=(i===0);
    const channels={};
    CHANNELS.forEach(c=>{
      const orders=Math.max(1,Math.round(c.base*weekend*(0.82+0.36*rnd())));
      const lines=Math.round(orders*(1.7+0.9*rnd()));
      const products={}; let qty=0;
      PRODUCTS.forEach((p,pi)=>{
        const q=Math.round(lines*WEIGHT[c.key][pi]*p.scale*(0.75+0.5*rnd())/6);
        products[p.name]=q; qty+=q;
      });
      const shipments=Math.round(orders*(1.0+0.25*rnd()));
      const exceptions=Math.round(orders*(0.02+0.03*rnd()));
      const oos=Math.round(lines*(0.03+0.04*rnd()));
      const syncFailed=Math.round(shipments*(0.008+0.02*rnd()));
      const proc=oos, jd=Math.max(0,lines-oos);
      // 历史日仍保留少量在途积压，否则堆叠柱与 sparkline 全平，看不出形态
      let po=Math.round(lines*(0.03+0.05*rnd())),
          at=Math.round(lines*(0.02+0.03*rnd())),
          ps=Math.round(lines*(0.015+0.025*rnd()));
      if(isToday){ po=Math.round(lines*0.22); at=Math.round(lines*0.10); ps=Math.round(lines*0.08); }
      const shipped=Math.max(0,lines-po-at-ps-syncFailed);
      channels[c.key]={orders,lines,qty,shipments,exceptions,oos,syncFailed,jd,proc,products,
        status:{PENDING_OUTBOUND:po,SHIPPED:shipped,AWAIT_TRACKING:at,PENDING_SYNC:ps,SYNC_FAILED:syncFailed}};
    });
    out.push({iso,label:iso.slice(5),dow,isToday,channels});
  }
  return out;
})();

function aggregate(days, chFilter){
  const keys = (chFilter && chFilter.length) ? chFilter : CHANNELS.map(c=>c.key);
  const blank=()=>({orders:0,lines:0,qty:0,shipments:0,exceptions:0,oos:0,syncFailed:0,jd:0,proc:0});
  const totals=blank(), byChannel={}, status={}, byProduct={}, byCat={};
  keys.forEach(k=>byChannel[k]=blank());
  STATUSES.forEach(s=>status[s.key]=0);
  PRODUCTS.forEach(p=>{
    byProduct[p.name]={total:0,ch:Object.fromEntries(keys.map(k=>[k,0])),cat:p.cat,unit:p.unit,
      emg:p.emg,bundle:p.bundle,mismatch:p.mismatch,alias:p.alias};
    byCat[p.cat]=byCat[p.cat]||{total:0,ch:Object.fromEntries(keys.map(k=>[k,0])),cat:p.cat,unit:'—'};
  });
  const series=days.map(d=>{
    const row={label:d.label,iso:d.iso,orders:0,qty:0,lines:0,byCh:{},status:{}};
    STATUSES.forEach(s=>row.status[s.key]=0);
    keys.forEach(k=>{
      const c=d.channels[k];
      row.byCh[k]={orders:c.orders,qty:c.qty};
      row.orders+=c.orders; row.qty+=c.qty; row.lines+=c.lines;
      for(const f of Object.keys(blank())){ totals[f]+=c[f]; byChannel[k][f]+=c[f]; }
      STATUSES.forEach(s=>{ status[s.key]+=c.status[s.key]; row.status[s.key]+=c.status[s.key]; });
      PRODUCTS.forEach(p=>{
        const q=c.products[p.name];
        byProduct[p.name].total+=q; byProduct[p.name].ch[k]+=q;
        byCat[p.cat].total+=q;      byCat[p.cat].ch[k]+=q;
      });
    });
    return row;
  });
  return {totals,byChannel,byProduct,byCat,status,series,keys};
}

const n  = v => (v||0).toLocaleString('zh-CN');
const pct= (a,b)=> b? Math.round(a/b*1000)/10 : 0;
function delta(cur,pre){
  if(!pre) return {txt:'—',cls:''};
  const d=(cur-pre)/pre*100;
  return {txt:(d>=0?'▲ ':'▼ ')+Math.abs(d).toFixed(1)+'%', cls:d>=0?'up':'down'};
}

/* ============================================================================

function niceMax(v){
  if(v<=0) return 10;
  const e=Math.pow(10,Math.floor(Math.log10(v))), f=v/e;
  return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e;
}
const AX='var(--muted)', GRID='var(--line)';

function axes(pad,w,h,max,labels,everyN){
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b; let s='';
  for(let i=0;i<=4;i++){
    const y=pad.t+ih-ih*i/4, v=max*i/4;
    s+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="${GRID}" stroke-width="1"/>`;
    s+=`<text x="${pad.l-7}" y="${y+3.5}" text-anchor="end" font-size="10" fill="${AX}">${v>=1000?(v/1000).toFixed(v%1000?1:0)+'k':Math.round(v)}</text>`;
  }
  labels.forEach((l,i)=>{
    if(i%everyN) return;
    const x=pad.l+(labels.length===1?iw/2:i*iw/(labels.length-1));
    s+=`<text x="${x}" y="${h-4}" text-anchor="middle" font-size="10" fill="${AX}">${l}</text>`;
  });
  return s;
}

function lineChart(labels, series, {h=190,w=680,area=true}={}){
  const pad={l:40,r:12,t:12,b:20};
  const max=niceMax(Math.max(1,...series.flatMap(s=>s.values)));
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const X=i=>pad.l+(labels.length===1?iw/2:i*iw/(labels.length-1));
  const Y=v=>pad.t+ih-(v/max)*ih;
  const every=Math.max(1,Math.ceil(labels.length/9));
  let s=`<svg class="chart" viewBox="0 0 ${w} ${h}">`+axes(pad,w,h,max,labels,every);
  series.forEach(sr=>{
    const pts=sr.values.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
    if(area&&series.length<=2)
      s+=`<polygon points="${X(0)},${pad.t+ih} ${pts} ${X(labels.length-1)},${pad.t+ih}" fill="${sr.color}" opacity=".08"/>`;
    s+=`<polyline points="${pts}" fill="none" stroke="${sr.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(labels.length<=10) sr.values.forEach((v,i)=>{ s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="2.6" fill="${sr.color}"/>`; });
  });
  return s+'</svg>';
}

function groupedBars(labels, series, {h=200,w=680}={}){
  const pad={l:40,r:12,t:12,b:20};
  const max=niceMax(Math.max(1,...series.flatMap(s=>s.values)));
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const band=iw/labels.length, bw=Math.min(26,(band*0.66)/series.length);
  let s=`<svg class="chart" viewBox="0 0 ${w} ${h}">`+axes(pad,w,h,max,labels,1);
  labels.forEach((l,i)=>{
    const c0=pad.l+band*i+band/2-(bw*series.length)/2;
    series.forEach((sr,j)=>{
      const v=sr.values[i], bh=(v/max)*ih;
      s+=`<rect x="${c0+j*bw}" y="${pad.t+ih-bh}" width="${bw-3}" height="${Math.max(1,bh)}" rx="2.5" fill="${sr.color}"/>`;
    });
  });
  return s+'</svg>';
}

function stackedBars(labels, stacks, segs, {h=200,w=680}={}){
  const pad={l:40,r:12,t:12,b:20};
  const totals=stacks.map(st=>segs.reduce((a,g)=>a+st[g.key],0));
  const max=niceMax(Math.max(1,...totals));
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const band=iw/labels.length, bw=Math.min(30,band*0.62);
  const every=Math.max(1,Math.ceil(labels.length/9));
  let s=`<svg class="chart" viewBox="0 0 ${w} ${h}">`+axes(pad,w,h,max,labels,every);
  stacks.forEach((st,i)=>{
    let acc=0; const x=pad.l+band*i+band/2-bw/2;
    segs.forEach(g=>{
      const v=st[g.key], bh=(v/max)*ih; if(v<=0) return;
      s+=`<rect x="${x}" y="${pad.t+ih-acc-bh}" width="${bw}" height="${bh}" fill="${g.color}"/>`;
      acc+=bh;
    });
  });
  return s+'</svg>';
}

function donut(parts,{size=190,thick=26}={}){
  const total=parts.reduce((a,p)=>a+p.value,0)||1;
  const r=(size-thick)/2-6, c=2*Math.PI*r, cx=size/2, cy=size/2;
  let off=0, s=`<svg class="chart" viewBox="0 0 ${size} ${size}" style="max-width:${size}px;margin:0 auto">`;
  parts.forEach(p=>{
    const len=c*p.value/total;
    s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${p.color}" stroke-width="${thick}"
      stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`;
    off+=len;
  });
  s+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="20" font-weight="650" fill="var(--ink)">${n(total)}</text>`;
  s+=`<text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="10" fill="${AX}">合计</text>`;
  return s+'</svg>';
}

function spark(values,color,{w=110,h=26,fill=true,stretch=false}={}){
  const max=Math.max(1,...values), min=Math.min(...values), span=Math.max(1,max-min);
  const X=i=>i*w/Math.max(1,values.length-1), Y=v=>h-2-((v-min)/span)*(h-6);
  const pts=values.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  return `<svg class="mini" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"${stretch?' preserveAspectRatio="none"':''}>`+
    (fill?`<polygon points="0,${h} ${pts} ${w},${h}" fill="${color}" opacity=".12"/>`:'')+
    `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6"/></svg>`;
}

function hbars(items,{max=null}={}){
  const m=max||Math.max(1,...items.map(i=>i.value));
  return items.map(i=>`<div class="bar-row"><div style="color:var(--ink2)">${i.label}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${(i.value/m*100).toFixed(1)}%;background:${i.color}"></div></div>
    <div class="mono" style="text-align:right">${n(i.value)}</div></div>`).join('');
}

const heat = (v,max,color) => `background:${color}${Math.round(Math.min(1,v/max)*70+8).toString(16).padStart(2,'0')}`;

/* --- 变体 D 用：更"好看"的一组图 --------------------------------------- */
function smoothPath(pts){
  if(pts.length<2) return pts.length?`M ${pts[0][0]},${pts[0][1]}`:'';
  let d=`M ${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2, t=.17;
    d+=` C ${p1[0]+(p2[0]-p0[0])*t},${p1[1]+(p2[1]-p0[1])*t} `+
       `${p2[0]-(p3[0]-p1[0])*t},${p2[1]-(p3[1]-p1[1])*t} ${p2[0]},${p2[1]}`;
  }
  return d;
}
let GRAD_ID=0;
function areaChart(labels, series, {h=230,w=680}={}){
  const pad={l:40,r:14,t:14,b:22};
  const max=niceMax(Math.max(1,...series.flatMap(s=>s.values)));
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const X=i=>pad.l+(labels.length===1?iw/2:i*iw/(labels.length-1));
  const Y=v=>pad.t+ih-(v/max)*ih;
  const every=Math.max(1,Math.ceil(labels.length/8));
  const gid='g'+(++GRAD_ID);
  let defs='<defs>';
  series.forEach((s,j)=>{ defs+=`<linearGradient id="${gid}_${j}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="${s.color}" stop-opacity=".34"/>
    <stop offset="100%" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`; });
  defs+='</defs>';
  let s=`<svg class="chart" viewBox="0 0 ${w} ${h}">`+defs+axes(pad,w,h,max,labels,every);
  series.forEach((sr,j)=>{
    const pts=sr.values.map((v,i)=>[X(i),Y(v)]);
    const line=smoothPath(pts);
    s+=`<path d="${line} L ${X(labels.length-1)},${pad.t+ih} L ${X(0)},${pad.t+ih} Z" fill="url(#${gid}_${j})"/>`;
    s+=`<path d="${line}" fill="none" stroke="${sr.color}" stroke-width="2.4" stroke-linecap="round"/>`;
    const last=pts[pts.length-1];
    s+=`<circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="${sr.color}" stroke="var(--panel)" stroke-width="2"/>`;
  });
  return s+'</svg>';
}
function stackedArea(labels, stacks, segs, {h=210,w=680}={}){
  const pad={l:40,r:14,t:14,b:22};
  const totals=stacks.map(st=>segs.reduce((a,g)=>a+st[g.key],0));
  const max=niceMax(Math.max(1,...totals));
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const X=i=>pad.l+(labels.length===1?iw/2:i*iw/(labels.length-1));
  const Y=v=>pad.t+ih-(v/max)*ih;
  const every=Math.max(1,Math.ceil(labels.length/8));
  let s=`<svg class="chart" viewBox="0 0 ${w} ${h}">`+axes(pad,w,h,max,labels,every);
  let lower=stacks.map(()=>0);
  segs.forEach(g=>{
    const upper=stacks.map((st,i)=>lower[i]+st[g.key]);
    const top=upper.map((v,i)=>`${X(i)},${Y(v)}`).join(' L ');
    const bot=lower.map((v,i)=>`${X(i)},${Y(v)}`).reverse().join(' L ');
    s+=`<path d="M ${top} L ${bot} Z" fill="${g.color}" opacity=".8"/>`;
    lower=upper;
  });
  return s+'</svg>';
}
/* 逐段插值上色：每段一个独立 <svg>，用一条 SVG 渐变会在每行重启，出现横向条纹 */
const lerpHex=(a,b,t)=>{
  const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const [r1,g1,b1]=p(a),[r2,g2,b2]=p(b);
  return '#'+[r1+(r2-r1)*t,g1+(g2-g1)*t,b1+(b2-b1)*t]
    .map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
};
function funnel(stages){
  const max=stages[0].value||1;
  return `<div class="funnel">${stages.map((s,i)=>{
    const w1=s.value/max, w2=(stages[i+1]?stages[i+1].value:s.value)/max;
    const conv=i?pct(s.value,stages[i-1].value):null;
    const col=lerpHex('#2563eb','#0d9488',i/Math.max(1,stages.length-1));
    return `<div class="fn-row"><div class="fn-l">${s.name}</div>
      <div><svg viewBox="0 0 100 34" preserveAspectRatio="none" style="width:100%;height:34px;display:block">
        <polygon points="${50-w1*49},0 ${50+w1*49},0 ${50+w2*49},34 ${50-w2*49},34" fill="${col}"/></svg></div>
      <div class="fn-v"><b>${n(s.value)}</b>${conv!==null?`<span>${conv}%</span>`:''}</div></div>`;
  }).join('')}</div>`;
}
function heatGrid(rows, keys, {label='商品'}={}){

  </div>`;
}

function writeURL(){
  const q=new URLSearchParams();
  Object.keys(DEFAULTS).forEach(k=>{ if(state[k] && state[k]!==DEFAULTS[k]) q.set(k,state[k]); });
  history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:''));

function drawer(c){

  if(kind==='ch'){
    const k=a, row=c.agg.byChannel[k];
    const prods=Object.entries(c.agg.byProduct).map(([nme,r])=>({label:nme,value:r.ch[k],color:CH[k].color}))
      .sort((x,y)=>y.value-x.value);
    title=`${CH[k].name} · ${RANGE_LABEL[state.range]}`;
    body=`<div class="tower">
        ${towerRow('订单数',n(row.orders),'单')}${towerRow('Order Line',n(row.lines),'行')}
        ${towerRow('实际发货量',n(row.qty),'件')}${towerRow('Shipment',n(row.shipments),'次')}
        ${towerRow('异常',n(row.exceptions),'单')}${towerRow('缺货',n(row.oos),'行')}

      <h4 style="margin:18px 0 6px;font-size:12px;color:var(--muted)">商品构成</h4>${hbars(prods)}`;
  } else if(kind==='cell'){

    title=`${CH[k].name} × ${name}`;
    body=`<div class="tower">${towerRow('实际发货量',n(tot),'件')}
        ${towerRow('占该渠道比',pct(tot,c.agg.byChannel[k].qty),'%')}
        ${towerRow('占该商品比',pct(tot,r.total),'%')}</div>
      <h4 style="margin:18px 0 6px;font-size:12px;color:var(--muted)">映射</h4>
      <table class="tbl"><tbody>
        <tr><td style="color:var(--muted)">京东 SKU</td><td class="mono">${r.emg}</td></tr>
        <tr><td style="color:var(--muted)">${CH[k].name}商品名</td><td>${al?al[0]:'（该渠道未映射）'}</td></tr>
        <tr><td style="color:var(--muted)">包装数量</td><td class="mono">${al?al[1]:'—'}
          ${r.mismatch?`<span class="tag amber">各渠道不一致</span>`:''}</td></tr>
      </tbody></table>
      ${r.bundle?`<h4 style="margin:18px 0 6px;font-size:12px;color:var(--muted)">组合品 BOM</h4>
        <div class="hint">该商品为礼包，履约时炸开为 ${r.bundle} 个京东 SKU（真实数据见 Sheet2）。</div>`
      :`<h4 style="margin:18px 0 6px;font-size:12px;color:var(--muted)">上钻 · Internal SKU</h4>
        ${hbars([{label:name+' / 规格A',value:Math.round(tot*0.62),color:CH[k].color},
                 {label:name+' / 规格B',value:tot-Math.round(tot*0.62),color:CH[k].color+'99'}])}
        <div class="hint" style="margin-top:12px">（SKU 拆分为原型示意）</div>`}`;
  }
  return `<aside class="drawer"><header><h3>${title}</h3><div class="spacer"></div>
    <button class="x" data-act="drill" data-val="">✕</button></header>
    <div class="body">${body}</div></aside>`;
}

function pivotTable(c,dim){
  const keys=c.agg.keys;
  let rows=[];
  if(dim==='channel'){
    rows=keys.map(k=>{
      const r=c.agg.byChannel[k];
      return {label:`<span style="color:${CH[k].color}">●</span> ${CH[k].name}`,color:CH[k].color,
        orders:r.orders,qty:r.qty,lines:r.lines,exceptions:r.exceptions,oos:r.oos,syncFailed:r.syncFailed,
        spark:c.trend.series.slice(-14).map(d=>d.byCh[k]?d.byCh[k].orders:0)};
    });
  } else if(dim==='status'){
    rows=STATUSES.map(s=>({label:`<span style="color:${s.color}">●</span> ${s.name}`,color:s.color,
      orders:c.agg.status[s.key],qty:'—',lines:'—',exceptions:'—',oos:'—',syncFailed:'—',
      spark:c.trend.series.slice(-14).map(d=>d.status[s.key])}));
  } else {
    const src=dim==='cat'?c.agg.byCat:c.agg.byProduct;
    rows=Object.entries(src).sort((a,b)=>b[1].total-a[1].total).map(([name,r],i)=>({
      label:name+(r.unit&&r.unit!=='—'?` <span style="color:var(--muted)">/ ${r.unit}</span>`:''),
      color:['#2563eb','#0d9488','#f59e0b','#8b5cf6','#94a3b8','#2563eb','#0d9488','#f59e0b'][i%8],
      orders:'—',qty:r.total,lines:'—',exceptions:'—',oos:'—',syncFailed:'—',
      spark:c.trend.series.slice(-14).map(d=>keys.reduce((a,k)=>{
        const day=DAYS.find(x=>x.iso===d.iso);
        return a + (dim==='cat'
          ? PRODUCTS.filter(p=>p.cat===name).reduce((s,p)=>s+day.channels[k].products[p.name],0)
          : day.channels[k].products[name]);
      },0))
    }));
  }
  const maxO=Math.max(1,...rows.map(r=>typeof r.orders==='number'?r.orders:0));
  const maxQ=Math.max(1,...rows.map(r=>typeof r.qty==='number'?r.qty:0));
  const cell=(v,max,color)=> typeof v!=='number'
    ? `<td class="num" style="color:var(--muted)">—</td>`
    : `<td class="num mono">${n(v)}<span class="cellbar" style="width:${(v/max*100).toFixed(1)}%;background:${color}"></span></td>`;
  // 合计必须是本列自己的和；该列整列为 — 时合计也是 —
  const sum=f=>rows.every(r=>typeof r[f]==='number')?n(rows.reduce((a,r)=>a+r[f],0)):'—';
  return `<div class="scroll-x"><table class="tbl"><thead><tr>
      <th>${PIVOTS.find(p=>p.k===dim).t}</th>
      <th class="num">订单数</th><th class="num">实际发货量</th><th class="num">Order Line</th>
      <th class="num">异常</th><th class="num">缺货</th><th class="num">回传失败</th><th>近 14 天</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${r.label}</td>
      ${cell(r.orders,maxO,r.color)}${cell(r.qty,maxQ,r.color)}
      <td class="num mono" style="${typeof r.lines!=='number'?'color:var(--muted)':''}">${typeof r.lines==='number'?n(r.lines):'—'}</td>
      <td class="num mono">${typeof r.exceptions==='number'?n(r.exceptions):'—'}</td>
      <td class="num mono">${typeof r.oos==='number'?n(r.oos):'—'}</td>
      <td class="num mono">${typeof r.syncFailed==='number'?n(r.syncFailed):'—'}</td>
      <td>${spark(r.spark,r.color,{w:96,h:22})}</td></tr>`).join('')}
      <tr class="tot"><td>合计</td>
        <td class="num mono">${sum('orders')}</td><td class="num mono">${sum('qty')}</td>
        <td class="num mono">${sum('lines')}</td><td class="num mono">${sum('exceptions')}</td>
        <td class="num mono">${sum('oos')}</td><td class="num mono">${sum('syncFailed')}</td><td></td></tr>
    </tbody></table></div>`;
}

const ICO_TXT='<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" '+

const tbl=(head,body,left=1)=>`<table class="tbl"><thead><tr>${
  head.map((h,i)=>`<th class="${i<left?'':'num'}">${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;

function D_DASH(c){
  const t=c.agg.totals, p=c.prev.totals, st=c.agg.status, m=M();
  const ser=c.trend.series, s14=ser.slice(-14), keys=c.agg.keys;
  const rows=Object.entries(c.agg.byProduct).sort((a,b)=>b[1].total-a[1].total);

  // 履约漏斗：一路夹住保证单调，避免出现"后一段比前一段还多"的假象
  const outbound=st.SHIPPED+st.AWAIT_TRACKING+st.PENDING_SYNC+st.SYNC_FAILED;
  const f=[t.lines];
  f.push(Math.max(0,f[0]-t.oos));
  f.push(Math.max(0,f[1]-Math.round(t.exceptions*0.5)));
  f.push(Math.max(0,Math.min(f[2],outbound)));
  f.push(Math.max(0,f[3]-st.AWAIT_TRACKING));
  f.push(Math.max(0,f[4]-st.PENDING_SYNC-st.SYNC_FAILED));
  const stages=['履约创建','库存校验通过','京东已受理','已出库','已取运单','已回传']
    .map((name,i)=>({name,value:f[i]}));

  return `
  <div class="sp12"><div class="d-kpis">
    ${dKpi('订单数',n(t.orders),'单',s14.map(d=>d.orders),'#2563eb',delta(t.orders,p.orders))}
    ${dKpi('实际发货量',n(t.qty),'件',s14.map(d=>d.qty),'#0d9488',delta(t.qty,p.qty))}
    ${dKpi('待出库',n(st.PENDING_OUTBOUND),'单',s14.map(d=>d.status.PENDING_OUTBOUND),'#94a3b8')}
    ${dKpi('异常',n(t.exceptions),'单',s14.map(d=>d.orders),'#ef4444',delta(t.exceptions,p.exceptions))}
    ${dKpi('缺货',n(t.oos),'行',s14.map(d=>d.lines),'#f59e0b',delta(t.oos,p.oos))}
    ${dKpi('回传失败',n(st.SYNC_FAILED),'单',s14.map(d=>d.status.SYNC_FAILED),'#ef4444')}
  </div></div>

  ${dCard('trend',{span:'sp8',title:'订单 / 发货趋势',
    sub:`近 30 天 · ${c.f.length?c.f.map(k=>CH[k].name).join('、'):'全渠道'}`,
    legend:`<div class="legend"><span><i style="background:#2563eb"></i>订单数</span><span><i style="background:#0d9488"></i>实际发货量</span></div>`,
    chart:()=>areaChart(ser.map(d=>d.label),[
      {name:'订单数',color:'#2563eb',values:ser.map(d=>d.orders)},
      {name:'实际发货量',color:'#0d9488',values:ser.map(d=>d.qty)}],{h:236}),
    text:()=>tbl(['日期','订单数','实际发货量','Order Line'],
      ser.slice().reverse().map(d=>`<tr><td class="mono">${d.iso}</td>
        <td class="num mono">${n(d.orders)}</td><td class="num mono">${n(d.qty)}</td>
        <td class="num mono">${n(d.lines)}</td></tr>`).join(''))})}

  ${dCard('funnel',{span:'sp4',title:'履约漏斗',sub:`${RANGE_LABEL[state.range]} · 履约单`,
    chart:()=>funnel(stages)+`<div class="hint" style="margin-top:8px">右侧百分比 = 相对上一环节的通过率</div>`,
    text:()=>tbl(['环节','履约单','通过率','损耗'],
      stages.map((s,i)=>`<tr><td>${s.name}</td><td class="num mono">${n(s.value)}</td>
        <td class="num mono">${i?pct(s.value,stages[i-1].value)+'%':'—'}</td>
        <td class="num mono">${i?n(stages[i-1].value-s.value):'—'}</td></tr>`).join(''))})}

  ${dCard('chstack',{span:'sp7',title:'渠道构成',sub:`按天堆叠 · ${m.label}`,legend:legendCh(keys),
    chart:()=>stackedArea(s14.map(d=>d.label),
      s14.map(d=>Object.fromEntries(keys.map(k=>[k,d.byCh[k][m.f]]))),
      keys.map(k=>({key:k,color:CH[k].color})),{h:216}),
    text:()=>tbl(['日期',...keys.map(k=>CH[k].name),'合计'],
      s14.slice().reverse().map(d=>`<tr><td class="mono">${d.iso}</td>
        ${keys.map(k=>`<td class="num mono">${n(d.byCh[k][m.f])}</td>`).join('')}
        <td class="num mono"><b>${n(keys.reduce((a,k)=>a+d.byCh[k][m.f],0))}</b></td></tr>`).join(''))})}

  ${dCard('share',{span:'sp5',title:'渠道占比',sub:`${m.label} · 点条下钻`,
    chart:()=>donut(keys.map(k=>({name:CH[k].name,color:CH[k].color,value:c.agg.byChannel[k][m.f]})),{size:168,thick:24})
      +`<div style="margin-top:10px">${keys.map(k=>`<div class="bar-row clickable" data-act="drill" data-val="ch:${k}" style="grid-template-columns:88px 1fr 66px">
        <div><span style="color:${CH[k].color}">●</span> ${CH[k].name}</div>
        <div class="bar-track" style="height:8px"><div class="bar-fill" style="width:${pct(c.agg.byChannel[k][m.f],c.agg.totals[m.f])}%;background:${CH[k].color}"></div></div>
        <div class="mono" style="text-align:right">${pct(c.agg.byChannel[k][m.f],c.agg.totals[m.f])}%</div></div>`).join('')}</div>`,
    text:()=>tbl(['渠道','订单数','实际发货量','占比'],
      keys.map(k=>`<tr><td><span style="color:${CH[k].color}">●</span> ${CH[k].name}</td>
        <td class="num mono">${n(c.agg.byChannel[k].orders)}</td>
        <td class="num mono">${n(c.agg.byChannel[k].qty)}</td>
        <td class="num mono">${pct(c.agg.byChannel[k][m.f],c.agg.totals[m.f])}%</td></tr>`).join('')
      +`<tr class="tot"><td>合计</td><td class="num mono">${n(t.orders)}</td>
        <td class="num mono">${n(t.qty)}</td><td class="num mono">100%</td></tr>`)})}

  ${dCard('heat',{span:'sp7',title:'渠道 × 商品 热力图',
    sub:'实际发货量 · 底色按各渠道自身归一 · 点色块下钻',
    chart:()=>heatGrid(rows,keys),
    text:()=>tbl(['商品','品类',...keys.map(k=>CH[k].name),'合计'],
      rows.map(([name,r])=>`<tr><td>${name}
        ${r.bundle?'<span class="tag amber">组合品</span>':''}${r.mismatch?'<span class="tag grey">包装不一致</span>':''}
        <div class="hint mono">${r.emg}</div></td>
        <td style="color:var(--muted)">${r.cat}</td>
        ${keys.map(k=>`<td class="num mono">${n(r.ch[k])}</td>`).join('')}
        <td class="num mono"><b>${n(r.total)}</b></td></tr>`).join(''),2)})}

  ${dCard('top',{span:'sp5',title:'Top 商品',sub:'实际发货量 · 按品类着色',
    legend:`<div class="legend">${Object.entries(CAT_COLOR).map(([cat,col])=>`<span><i style="background:${col}"></i>${cat}</span>`).join('')}</div>`,
    chart:()=>hbars(rows.slice(0,6).map(([name,r])=>({
      label:name.length>10?name.slice(0,10)+'…':name, value:r.total,
      color:CAT_COLOR[r.cat]||'#94a3b8'}))),
    text:()=>tbl(['商品','品类','实际发货量','占比'],
      rows.map(([name,r])=>`<tr><td>${name}</td><td style="color:var(--muted)">${r.cat}</td>
        <td class="num mono">${n(r.total)}</td>
        <td class="num mono">${pct(r.total,t.qty)}%</td></tr>`).join(''),2)})}

  ${dCard('backlog',{span:'sp8',title:'积压构成',
    sub:'按天堆叠 · 近 14 天 · <b title="已出库量级压过其余四态，同图会把积压压成看不见的细线">不含已出库</b>',
    legend:`<div class="legend">${STATUSES.filter(s=>s.key!=='SHIPPED').map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>`,
    chart:()=>stackedArea(s14.map(d=>d.label),s14.map(d=>d.status),STATUSES.filter(s=>s.key!=='SHIPPED'),{h:216}),
    text:()=>{const bl=STATUSES.filter(s=>s.key!=='SHIPPED');
      return tbl(['日期',...bl.map(s=>s.name),'积压合计','已出库'],
        s14.slice().reverse().map(d=>`<tr><td class="mono">${d.iso}</td>
          ${bl.map(s=>`<td class="num mono">${n(d.status[s.key])}</td>`).join('')}
          <td class="num mono"><b>${n(bl.reduce((a,s)=>a+d.status[s.key],0))}</b></td>
          <td class="num mono" style="color:var(--muted)">${n(d.status.SHIPPED)}</td></tr>`).join(''));}})}

  ${dCard('issues',{span:'sp4',title:'需人工介入',sub:`${ISSUES.length} 条`,
    chart:()=>ISSUES.slice(0,7).map(i=>`<div class="mini-issue">
      <span class="d" style="background:${i.type.tag==='red'?'var(--danger)':i.type.tag==='amber'?'var(--warn)':'var(--brand)'}"></span>
      <span>${i.type.name}</span><span class="no">${i.no}</span>
      <div class="spacer"></div><span class="no">${i.age}</span></div>`).join(''),
    text:()=>tbl(['订单号','渠道','异常类型','说明','数量','停留'],
      ISSUES.map(i=>`<tr><td class="mono">${i.no}</td>
        <td><span style="color:${CH[i.ch].color}">●</span> ${CH[i.ch].name}</td>
        <td><span class="tag ${i.type.tag}">${i.type.name}</span></td>
        <td style="color:var(--muted)">${i.type.hint}</td>
        <td class="num mono">${n(i.qty)}</td><td class="num mono">${i.age}</td></tr>`).join(''),4)})}`;
}

/* ============================================================================
 * 8. 变体注册 + 悬浮切换条 + 事件
 * ==========================================================================*/
const VARIANTS={D:VARIANT_D,A:VARIANT_A,B:VARIANT_B,C:VARIANT_C};
const ORDER=['D','A','B','C'];

function render(){
  const V=VARIANTS[state.variant];
  if(!V.pages.find(p=>p.k===state.page)) state.page=V.pages[0].k;
  document.getElementById('app').innerHTML=V.render();
  const sw=document.getElementById('switcher');
  sw.innerHTML=`<button data-sw="-1" title="上一个变体">‹</button>
    <div class="lbl"><b>${state.variant} — ${V.name}</b><span>${V.tagline}</span></div>
    <button data-sw="1" title="下一个变体">›</button>`;
  writeURL();
  document.title=`原型 ${state.variant} · ${V.name}`;
}

function cycle(step){
  const i=ORDER.indexOf(state.variant);
  state.variant=ORDER[(i+step+ORDER.length)%ORDER.length];
  state.page=''; state.drill='';
  render();
}

document.getElementById('switcher').addEventListener('click',e=>{
  const b=e.target.closest('[data-sw]'); if(b) cycle(+b.dataset.sw);
});

document.getElementById('app').addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, val=el.dataset.val;
  if(act==='ch'){
    const f=chFilter();
    const next=f.includes(val)?f.filter(x=>x!==val):(f.length?[...f,val]:CHANNELS.map(c=>c.key).filter(k=>k!==val));
    state.ch = next.length===CHANNELS.length?'':next.join(',');
    if(!next.length) state.ch='';
  } else if(act==='page'){ state.page=val; state.drill=''; }
  else if(act==='txt'){
    const s=txtSet();
    state.txt=(s.includes(val)?s.filter(x=>x!==val):[...s,val]).join(',');
  }
  else { state[act]=val; }
  render();
});

document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
  if(e.key==='ArrowLeft') cycle(-1);
  else if(e.key==='ArrowRight') cycle(1);
  else if(e.key==='Escape' && state.drill){ state.drill=''; render(); }
});

readURL();
render();
</script>

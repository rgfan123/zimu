# Existing integration fixtures use a test-only permissive policy. Dedicated identity tests activate
# a different profile so the production policy is exercised through HTTP.
spring.profiles.active=test-fixtures

# Class-scoped Testcontainers stop before Spring's context cache. Disable background scheduling by
# default so cached contexts cannot keep polling destroyed databases; tests that exercise real
# scheduling opt in explicitly.
app.scheduling.enabled=false
app.message-worker.enabled=false
app.wecom-tracking-file-worker.enabled=false
app.wecom-export-worker.enabled=false
app.wecom-reminder.enabled=false
app.wecom-notification.enabled=false
app.wecom-order-draft-card.enabled=false
app.agent-worker.enabled=false
app.quality-eval.enabled=false
app.jd.tracking-backfill.enabled=false

# Explicit server-owned public metadata aliases used by controlled test interpreters.
app.message-interpreter.public-metadata-aliases[0].provider=test-provider
app.message-interpreter.public-metadata-aliases[0].model=test-model
app.message-interpreter.public-metadata-aliases[0].prompt-version=test-prompt-v1
app.message-interpreter.public-metadata-aliases[1].provider=test-provider
app.message-interpreter.public-metadata-aliases[1].model=test-model
app.message-interpreter.public-metadata-aliases[1].prompt-version=prompt-v1
app.message-interpreter.public-metadata-aliases[2].provider=test-provider
app.message-interpreter.public-metadata-aliases[2].model=test-model
app.message-interpreter.public-metadata-aliases[2].prompt-version=prompt-v2
app.message-interpreter.public-metadata-aliases[3].provider=causality-test
app.message-interpreter.public-metadata-aliases[3].model=model-test
app.message-interpreter.public-metadata-aliases[3].prompt-version=prompt-v1
app.message-interpreter.public-metadata-aliases[4].provider=causality-test
app.message-interpreter.public-metadata-aliases[4].model=model-test
app.message-interpreter.public-metadata-aliases[4].prompt-version=prompt-v2
app.message-interpreter.public-metadata-aliases[5].provider=ticket-04-model-provider
app.message-interpreter.public-metadata-aliases[5].model=ticket-04-model
app.message-interpreter.public-metadata-aliases[5].prompt-version=ticket-04-prompt-v1

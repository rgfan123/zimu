# Existing integration fixtures use a test-only permissive policy. Dedicated identity tests activate
# a different profile so the production policy is exercised through HTTP.
spring.profiles.active=test-fixtures

# Explicit server-owned public metadata aliases used by controlled test interpreters.
app.message-interpreter.public-metadata-aliases[0].provider=test-provider
app.message-interpreter.public-metadata-aliases[0].model=test-model
app.message-interpreter.public-metadata-aliases[0].prompt-version=test-prompt-v1

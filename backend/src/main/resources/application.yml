spring:
  application:
    name: fulfillment-hub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fulfillment_hub}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  servlet:
    multipart:
      # 业务上限是 20MiB；传输层留 1MiB multipart 边界开销，由领域层返回稳定错误码。
      max-file-size: 21MB
      max-request-size: 22MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: app
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 250ms
      timeout: 250ms

server:
  port: ${SERVER_PORT:8080}

app:
  followup-worker:
    enabled: ${FOLLOWUP_WORKER_ENABLED:false}
    poll-ms: ${FOLLOWUP_WORKER_POLL_MS:500}
    lease-seconds: ${FOLLOWUP_WORKER_LEASE_SECONDS:120}
    backoff-seconds: ${FOLLOWUP_WORKER_BACKOFF_SECONDS:5}
  followup-approval-worker:
    enabled: ${FOLLOWUP_APPROVAL_WORKER_ENABLED:false}
    poll-ms: ${FOLLOWUP_APPROVAL_WORKER_POLL_MS:500}
    lease-seconds: ${FOLLOWUP_APPROVAL_WORKER_LEASE_SECONDS:30}
  followup-assignment-worker:
    enabled: ${FOLLOWUP_ASSIGNMENT_WORKER_ENABLED:false}
    poll-ms: ${FOLLOWUP_ASSIGNMENT_WORKER_POLL_MS:500}
    lease-seconds: ${FOLLOWUP_ASSIGNMENT_WORKER_LEASE_SECONDS:30}
    backoff-seconds: ${FOLLOWUP_ASSIGNMENT_WORKER_BACKOFF_SECONDS:5}
  scheduling:
    # 生产默认启用；测试可整体关闭，避免缓存的 Spring context 继续轮询已销毁的 Testcontainer。
    enabled: ${SCHEDULED_TASKS_ENABLED:true}
    # 当前 13 条 @Scheduled 触发流各有独立 lane；代码将配置值限制在 13..32。
    pool-size: ${SCHEDULED_TASK_POOL_SIZE:13}
  gateway:
    basic-auth:
      # 全部 /api 请求都会在后端复验 Nginx 提供的 Basic Auth；缺失时默认拒绝。
      username: ${APP_ADMIN_USER:}
      password: ${APP_ADMIN_PASSWORD:}
    identity-assertion:
      # 可选逐人身份模式：Nginx 验证多用户凭据后用独立高熵 token 向后端证明 $remote_user。
      token: ${APP_GATEWAY_ASSERTION_TOKEN:}
  internal-auth:
    # 全部 /internal 请求使用独立服务身份；任一项缺失都会拒绝，而不是退回 X-Operator 自报身份。
    service-name: ${APP_INTERNAL_SERVICE_NAME:}
    bearer-token: ${APP_INTERNAL_SERVICE_TOKEN:}
  inventory:
    # 这是运营视图的 freshness 标签阈值，不是库存预占；提交京东前仍必须实时复查。
    freshness-threshold: ${INVENTORY_FRESHNESS_THRESHOLD:PT15M}
  caishixian:
    verify-attempts: ${CSX_SHIPMENT_VERIFY_ATTEMPTS:5}
    verify-delay: ${CSX_SHIPMENT_VERIFY_DELAY:PT2S}
  connector:
    # 渠道凭据应用层加密密钥（AES-GCM）：Base64 编码的 16/24/32 字节。
    # 未配置时界面保存密码会被拒绝（fail-closed），渠道凭据整体退回纯环境变量模式。
    credential-key: ${CONNECTOR_CREDENTIAL_KEY:}
  jufubao:
    api-base: ${JUFUBAO_API_BASE:https://supplier-apis.jufubao.cn}
    portal-base: ${JUFUBAO_PORTAL_BASE:https://g.jufubao.cn}
    state-poll-attempts: ${JUFUBAO_STATE_POLL_ATTEMPTS:5}
    state-poll-delay: ${JUFUBAO_STATE_POLL_DELAY:PT2S}
  source-sync:
    # 外层租约必须覆盖平台写和写后核验；过期 SYNCING 只进入人工对账，不自动重放。
    idempotency-lease: ${SOURCE_SYNC_IDEMPOTENCY_LEASE:PT10M}
    recovery:
      enabled: ${SOURCE_SYNC_RECOVERY_ENABLED:true}
      initial-delay-ms: ${SOURCE_SYNC_RECOVERY_INITIAL_DELAY_MS:60000}
      poll-ms: ${SOURCE_SYNC_RECOVERY_POLL_MS:60000}
      batch-size: ${SOURCE_SYNC_RECOVERY_BATCH_SIZE:50}
    auto:
      # 自动回传：默认关闭。这是往【客户的平台】写数据，与京东建单（自己的仓）性质不同。
      # 开启后省掉的只有「人点按钮」，五道门禁（平台可读 / 订单可写 / 地址未变 /
      # 物流公司命中平台字典 / 回填工作簿已生成）与幂等、外部写租约、
      # check-hash 陈旧判定全部保留。未配 operator 时 fail-closed 不启动。
      enabled: ${SOURCE_SYNC_AUTO_ENABLED:false}
      operator: ${SOURCE_SYNC_AUTO_OPERATOR:}
      poll-ms: ${SOURCE_SYNC_AUTO_POLL_MS:60000}
      batch-size: ${SOURCE_SYNC_AUTO_BATCH_SIZE:20}
  wecom:
    # 企业微信智能机器人长连接（替换旧 HTTP 回调）：缺配置时应用正常启动、连接不建立、readiness 标记不可用。
    # 凭据只写入 git-ignored 的 backend/.env.wecom.local（0600），绝不在日志/readiness 中出现。
    enabled: ${WECOM_ENABLED:false}
    bot-id: ${WECOM_BOT_ID:}
    secret: ${WECOM_SECRET:}
    # 长连接目标固定为官方 wss://openws.work.weixin.qq.com；部署配置不可改写凭据发送目标。
    heartbeat-interval-seconds: ${WECOM_HEARTBEAT_INTERVAL_SECONDS:30}
  message-worker:
    enabled: ${MESSAGE_WORKER_ENABLED:true}
    poll-ms: ${MESSAGE_WORKER_POLL_MS:500}
    lease-seconds: ${MESSAGE_WORKER_LEASE_SECONDS:30}
    backoff-seconds: ${MESSAGE_WORKER_BACKOFF_SECONDS:5}
  wecom-chat-agent-worker:
    # #178：会话绑定的只读 Agent 前置路由；默认跟随消息 Worker 总开关。
    enabled: ${WECOM_CHAT_AGENT_WORKER_ENABLED:${MESSAGE_WORKER_ENABLED:true}}
    poll-ms: ${WECOM_CHAT_AGENT_WORKER_POLL_MS:500}
    # 覆盖默认 300 秒 Agent 执行预算，并在企微外呼前再次续租。
    lease-seconds: ${WECOM_CHAT_AGENT_WORKER_LEASE_SECONDS:330}
    backoff-seconds: ${WECOM_CHAT_AGENT_WORKER_BACKOFF_SECONDS:5}
    claim-error-suppress-seconds: ${WECOM_CHAT_AGENT_WORKER_CLAIM_ERROR_SUPPRESS_SECONDS:60}
  kehuzx:
    mcp:
      # #130: dedicated read-token boundary. Missing configuration leaves Zimu healthy and the
      # follow-up task fail-closed; this token must never carry Kehuzx write scope.
      enabled: ${KEHUZX_MCP_ENABLED:false}
      endpoint: ${KEHUZX_MCP_ENDPOINT:}
      read-token: ${KEHUZX_MCP_FOLLOWUP_READ_TOKEN:}
      allowed-host: ${KEHUZX_MCP_ALLOWED_HOST:kehuzx-mcp}
      allowed-port: ${KEHUZX_MCP_ALLOWED_PORT:9100}
      connect-timeout: ${KEHUZX_MCP_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${KEHUZX_MCP_READ_TIMEOUT:PT10S}
      contract-version: ${KEHUZX_MCP_CONTRACT_VERSION:kehuzx-mcp-v1}
      upstream-commit: ${KEHUZX_MCP_UPSTREAM_COMMIT:}
    mcp-write:
      # #131: separate deterministic Worker identity, never an Agent tool.
      enabled: ${KEHUZX_MCP_WRITE_ENABLED:false}
      endpoint: ${KEHUZX_MCP_WRITE_ENDPOINT:}
      write-token: ${KEHUZX_MCP_WRITE_TOKEN:}
      approval-signing-key: ${KEHUZX_MCP_APPROVAL_SIGNING_KEY:}
      allowed-host: ${KEHUZX_MCP_WRITE_ALLOWED_HOST:kehuzx-mcp}
      allowed-port: ${KEHUZX_MCP_WRITE_ALLOWED_PORT:9100}
      connect-timeout: ${KEHUZX_MCP_WRITE_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${KEHUZX_MCP_WRITE_READ_TIMEOUT:PT10S}
      max-response-bytes: ${KEHUZX_MCP_WRITE_MAX_RESPONSE_BYTES:1048576}
      approval-ttl-seconds: ${KEHUZX_MCP_APPROVAL_TTL_SECONDS:120}
  wecom-tracking-file-worker:
    # Issue #86：单聊 file 专用确定性解析队列；默认跟随消息 Worker 总开关，且从不调用模型。
    enabled: ${WECOM_TRACKING_FILE_WORKER_ENABLED:${MESSAGE_WORKER_ENABLED:true}}
    poll-ms: ${WECOM_TRACKING_FILE_WORKER_POLL_MS:500}
    lease-seconds: ${WECOM_TRACKING_FILE_WORKER_LEASE_SECONDS:60}
    backoff-seconds: ${WECOM_TRACKING_FILE_WORKER_BACKOFF_SECONDS:5}
    claim-error-suppress-seconds: ${WECOM_TRACKING_FILE_WORKER_CLAIM_ERROR_SUPPRESS_SECONDS:60}
  wecom-export-worker:
    # Issue #84：履约导出企微发送 Worker（INITIAL/REMINDER 共用 WECOM_EXPORT_DELIVERY 任务）。
    enabled: ${WECOM_EXPORT_WORKER_ENABLED:true}
    poll-ms: ${WECOM_EXPORT_WORKER_POLL_MS:1000}
    # 租约 40 分钟（代码下限，不可调小）：必须覆盖 #82 上传器完整最坏恢复预算 =
    # pre-init 5 次 resume (每次最多 15s 等 ACK + 60s 退避) + 15s init ACK = 5×(15+60)+15 = 390s
    # + 30 分钟会话 + 15s = 1815s + 最终 send ACK 5s = 2210s (36m50s)，2400s 留约 190s 余量
    # 作为保守下限——真实执行仍活跃时任务绝不被第二实例重新领取误判为 crash（SENDING 只在
    # 租约过期后的重新领取时转 UNKNOWN 人工对账）。
    lease-seconds: ${WECOM_EXPORT_WORKER_LEASE_SECONDS:2400}
    backoff-seconds: ${WECOM_EXPORT_WORKER_BACKOFF_SECONDS:30}
    claim-error-suppress-seconds: ${WECOM_EXPORT_WORKER_CLAIM_ERROR_SUPPRESS_SECONDS:60}
  wecom-reminder:
    # Issue #84：到期未收齐运单的周期提醒扫描器（DB 扫描，无内存延迟链）。
    enabled: ${WECOM_REMINDER_ENABLED:true}
    scan-ms: ${WECOM_REMINDER_SCAN_MS:30000}
    scan-batch-limit: ${WECOM_REMINDER_SCAN_BATCH_LIMIT:20}
  wecom-notification:
    # Issue #90：复核/订单创建/发货完成按责任团队做 5 分钟持久化汇总；仅企微启用时默认启用。
    enabled: ${WECOM_NOTIFICATION_ENABLED:${WECOM_ENABLED:false}}
    poll-ms: ${WECOM_NOTIFICATION_POLL_MS:1000}
    lease-seconds: ${WECOM_NOTIFICATION_LEASE_SECONDS:120}
    batch-limit: ${WECOM_NOTIFICATION_BATCH_LIMIT:20}
    claim-error-suppress-seconds: ${WECOM_NOTIFICATION_CLAIM_ERROR_SUPPRESS_SECONDS:60}
  wecom-order-draft-card:
    # Issues #87/#88：草稿事务内入队，独立 Worker 发送交互卡；默认跟随企微总开关。
    enabled: ${WECOM_ORDER_DRAFT_CARD_ENABLED:${WECOM_ENABLED:false}}
    poll-ms: ${WECOM_ORDER_DRAFT_CARD_POLL_MS:1000}
    lease-seconds: ${WECOM_ORDER_DRAFT_CARD_LEASE_SECONDS:60}
  wecom-business-card:
    # 通用业务卡（复核事项 / 运营告警 / 整批确认播报 / 京东出库失败）：默认跟随企微总开关。
    enabled: ${WECOM_BUSINESS_CARD_ENABLED:${WECOM_ENABLED:false}}
    poll-ms: ${WECOM_BUSINESS_CARD_POLL_MS:1000}
    lease-seconds: ${WECOM_BUSINESS_CARD_LEASE_SECONDS:60}
    claim-error-suppress-seconds: ${WECOM_BUSINESS_CARD_CLAIM_ERROR_SUPPRESS_SECONDS:60}
    # 卡片深链的后台基地址；不配则卡片只带信息不带跳转（宁可不跳，也不发点了 404 的链接）。
    base-url: ${WECOM_BUSINESS_CARD_BASE_URL:}
    # 每类卡的目标会话。这四类卡都是系统产生的，没有「原会话」可回，必须显式配置。
    # 未配置即不发，按 INFO 记录——没配群是部署选择，不是故障。
    # 群聊路由要求渲染侧脱敏：收件人姓名/手机号/详细地址不得进群。
    routes:
      review:
        type: ${WECOM_CARD_REVIEW_ROUTE_TYPE:GROUP}
        chat-id: ${WECOM_CARD_REVIEW_CHAT_ID:}
      alert:
        type: ${WECOM_CARD_ALERT_ROUTE_TYPE:GROUP}
        chat-id: ${WECOM_CARD_ALERT_CHAT_ID:}
      batch:
        type: ${WECOM_CARD_BATCH_ROUTE_TYPE:GROUP}
        chat-id: ${WECOM_CARD_BATCH_CHAT_ID:}
      jd-outbound:
        type: ${WECOM_CARD_JD_OUTBOUND_ROUTE_TYPE:GROUP}
        chat-id: ${WECOM_CARD_JD_OUTBOUND_CHAT_ID:}
      # 客户跟进卡默认单聊指定 +1；只有显式配置 GROUP 时才改投群聊脱敏卡。
      followup-draft:
        type: ${WECOM_CARD_FOLLOWUP_DRAFT_ROUTE_TYPE:SINGLE}
        chat-id: ${WECOM_CARD_FOLLOWUP_DRAFT_CHAT_ID:}
      followup-result:
        type: ${WECOM_CARD_FOLLOWUP_RESULT_ROUTE_TYPE:SINGLE}
        chat-id: ${WECOM_CARD_FOLLOWUP_RESULT_CHAT_ID:}
      # 发货前确认卡：卡面带收货人手机号与详细地址，**只能单聊**。
      # 缺省 SINGLE 不是省事，是让「配错成群」变成显式动作而不是默认结果；
      # 即便配成 GROUP，PreShipConfirmCardSource#route 也会挡下来不发。
      preship:
        type: ${WECOM_CARD_PRESHIP_ROUTE_TYPE:SINGLE}
        chat-id: ${WECOM_CARD_PRESHIP_CHAT_ID:}
  agent-worker:
    # 定义域写动作后台 Worker（11）：202 任务的执行面，租约式领取 AGENT_* 任务。
    enabled: ${AGENT_WORKER_ENABLED:true}
    poll-ms: ${AGENT_WORKER_POLL_MS:500}
    lease-seconds: ${AGENT_WORKER_LEASE_SECONDS:30}
    backoff-seconds: ${AGENT_WORKER_BACKOFF_SECONDS:5}
  source-order-intake-worker:
    enabled: ${SOURCE_ORDER_INTAKE_WORKER_ENABLED:true}
    poll-ms: ${SOURCE_ORDER_INTAKE_WORKER_POLL_MS:1000}
    lease-seconds: ${SOURCE_ORDER_INTAKE_WORKER_LEASE_SECONDS:120}
    backoff-seconds: ${SOURCE_ORDER_INTAKE_WORKER_BACKOFF_SECONDS:10}
  message-interpreter:
    provider: ${MESSAGE_INTERPRETER_PROVIDER:}
    model: ${MESSAGE_INTERPRETER_MODEL:}
    prompt-version: ${MESSAGE_INTERPRETER_PROMPT_VERSION:}
    # DeepSeek 解释器传输配置（仅经环境变量注入，绝不在 yml/日志/DTO 中出现明文密钥）。
    base-url: ${MESSAGE_INTERPRETER_BASE_URL:}
    api-key: ${MESSAGE_INTERPRETER_API_KEY:}
    request-timeout-ms: ${MESSAGE_INTERPRETER_REQUEST_TIMEOUT_MS:30000}
    # Only these server-owned public aliases may be persisted/exposed; blank means deny all model triples.
    public-metadata-aliases:
      - provider: ${MESSAGE_INTERPRETER_PUBLIC_PROVIDER_ALIAS:}
        model: ${MESSAGE_INTERPRETER_PUBLIC_MODEL_ALIAS:}
        prompt-version: ${MESSAGE_INTERPRETER_PUBLIC_PROMPT_VERSION_ALIAS:}
  agent:
    # Agent 运行时模型传输配置（仅经环境变量注入，绝不在 yml/日志/DTO 中出现明文密钥）。
    # 未配置 base-url 时注册 fail-closed 的 DefaultAgentRuntime（不连接任何模型），
    # 与 app.message-interpreter.* 相互独立。
    provider: ${AGENT_PROVIDER:}
    model: ${AGENT_MODEL:}
    base-url: ${AGENT_BASE_URL:}
    api-key: ${AGENT_API_KEY:}
    request-timeout-ms: ${AGENT_REQUEST_TIMEOUT_MS:30000}
    # 单次运行收敛预算：不再用固定工具轮数表达所有 Agent；异步任务可在请求中显式覆盖。
    max-model-calls: ${AGENT_MAX_MODEL_CALLS:24}
    max-tool-calls: ${AGENT_MAX_TOOL_CALLS:64}
    execution-timeout-ms: ${AGENT_EXECUTION_TIMEOUT_MS:300000}
    max-repeated-tool-calls: ${AGENT_MAX_REPEATED_TOOL_CALLS:2}
    # 服务端 allowlist：仅登记的三元组可对外暴露真实 provider/model/prompt-version，未命中一律投影为 none。
    public-metadata-aliases:
      - provider: ${AGENT_PUBLIC_PROVIDER_ALIAS:}
        model: ${AGENT_PUBLIC_MODEL_ALIAS:}
        prompt-version: ${AGENT_PUBLIC_PROMPT_VERSION_ALIAS:}
    observability:
      # Agent 结构化运行记录开关（08 票）：关闭时业务与审计完全不受影响（Noop provider）。
      enabled: ${AGENT_OBSERVABILITY_ENABLED:true}
  mcp:
    # 轻量 MCP Server（JSON-RPC 2.0 over stdio）：启用时 stdout 专用于协议帧，应用日志必须重定向到文件。
    enabled: ${MCP_ENABLED:false}
    # 写工具的操作人身份，由启动方注入（环境变量 MCP_AGENT_IDENTITY）；工具参数无法伪造。
    agent-identity: ${MCP_AGENT_IDENTITY:}
    # 分模块暴露（env MCP_MODULES，逗号分隔）：空 = 全部模块（向后兼容）；非空只注册列出的模块，
    # 未列出模块的工具在 tools/list 与 tools/call 上都查不到；未知模块名启动期 fail-fast。
    modules: ${MCP_MODULES:}
    http:
      # 对外 HTTP/SSE 传输开关（env MCP_HTTP_ENABLED），默认关闭——不开等于不新增公网攻击面。
      # 与 stdio 面共用同一 McpServer 协议分发逻辑（含只读收紧），只是换了一层收发方式。
      enabled: ${MCP_HTTP_ENABLED:false}
      # Bearer token（env MCP_HTTP_TOKEN）。未配置时端点直接不注册（404），不是放行；
      # 校验失败返回 401。token 绝不进日志/审计负载（比对逻辑见 McpHttpTokenAuthenticator）。
      token: ${MCP_HTTP_TOKEN:}
  message-retention:
    # NON_BUSINESS 消息默认保留 30 天；非正数表示禁用清理。清理任务可重复运行并记录审计摘要。
    non-business-days: ${MESSAGE_RETENTION_NON_BUSINESS_DAYS:30}
    # 每日定时清理时间（Spring cron，服务器时区）。
    cron: ${MESSAGE_RETENTION_CRON:0 30 3 * * *}
  carrier-prefixes:
    carriers:
      SF_EXPRESS:
        name: 顺丰速运
        enabled: true
      JD:
        name: 京东物流
        enabled: true
  jd:
    client-mode: ${JD_LOP_CLIENT_MODE:MOCK}
    # 写接口总闸：ON 才放行 /api/v1/jd-write 写端点；生产默认保持 OFF（未配置时 HTTP 403 + WRITE_MODE_DISABLED 拒绝）
    write-mode: ${JD_LOP_WRITE_MODE:OFF}
    # 旧通用 JD 写 HTTP 面独立锁死；仅供显式 Mock 验证，REAL 模式始终拒绝。
    generic-http-write-mode: ${JD_GENERIC_HTTP_WRITE_MODE:OFF}
    # Shipment 建单还要求操作人进入显式授权名单；默认空名单（拒绝），逗号分隔。
    outbound-authorized-operators: ${JD_OUTBOUND_AUTHORIZED_OPERATORS:}
    server-url: ${JD_LOP_SERVER_URL:}
    app-key: ${JD_LOP_APP_KEY:}
    app-secret: ${JD_LOP_APP_SECRET:}
    access-token: ${JD_LOP_ACCESS_TOKEN:}
    pin: ${JD_LOP_PIN:}
    owner-no: ${JD_LOP_OWNER_NO:}
    tracking-backfill:
      # 默认关闭，避免未经验收的运行环境自动访问 JD；手工入口不受此开关影响。
      enabled: ${JD_TRACKING_BACKFILL_ENABLED:false}
      poll-ms: ${JD_TRACKING_BACKFILL_POLL_MS:60000}
      batch-size: ${JD_TRACKING_BACKFILL_BATCH_SIZE:20}
      min-interval: ${JD_TRACKING_BACKFILL_MIN_INTERVAL:PT1M}
  zhonghui-pms:
    # MOCK（默认）只做本地联调；REAL 仅选择真实 Adapter，外部写仍须第二道 write-mode=ON 门闩。
    client-mode: ${ZHONGHUI_PMS_CLIENT_MODE:MOCK}
    write-mode: ${ZHONGHUI_PMS_WRITE_MODE:OFF}
    # 每次 PMS HTTP 调用的响应上限；20 SKU 最坏调用预算受此值约束。
    request-timeout: ${ZHONGHUI_PMS_REQUEST_TIMEOUT:PT30S}
    # 独立于全局 60s 的外部写租约；20 SKU 名义 30 分钟调用预算外再留 10 分钟收尾余量。
    idempotency-lease: ${ZHONGHUI_PMS_IDEMPOTENCY_LEASE:PT40M}
    # 凭据只经环境变量注入，绝不写入日志、数据库或 API 响应。
    base-url: ${ZHONGHUI_PMS_BASE_URL:}
    username: ${ZHONGHUI_PMS_USERNAME:}
    password: ${ZHONGHUI_PMS_PASSWORD:}
    defaults:
      brand-id: ${ZHONGHUI_PMS_DEFAULT_BRAND_ID:}
      certification-type: ${ZHONGHUI_PMS_DEFAULT_CERTIFICATION_TYPE:}
      certification-id: ${ZHONGHUI_PMS_DEFAULT_CERTIFICATION_ID:}
      third-id: ${ZHONGHUI_PMS_DEFAULT_THIRD_ID:}
      limit-area-temp-id: ${ZHONGHUI_PMS_DEFAULT_LIMIT_AREA_TEMP_ID:}
      goods-tax: ${ZHONGHUI_PMS_DEFAULT_GOODS_TAX:}
      logistics-carrier: ${ZHONGHUI_PMS_DEFAULT_LOGISTICS_CARRIER:}
      producing-area: ${ZHONGHUI_PMS_DEFAULT_PRODUCING_AREA:}
      goods-num: ${ZHONGHUI_PMS_DEFAULT_GOODS_NUM:99}
      sale-unit: ${ZHONGHUI_PMS_DEFAULT_SALE_UNIT:件}
      origincountry: ${ZHONGHUI_PMS_DEFAULT_ORIGIN_COUNTRY:1}
  platform-pull:
    # 三平台订单刷新通道：脚本与凭据目录挂载路径（docker-compose backend volumes）。
    scripts-dir: ${APP_PLATFORM_PULL_SCRIPTS_DIR:/app/platform-pull-scripts}
    credentials-dir: ${APP_PLATFORM_PULL_CREDENTIALS_DIR:/app/platform-pull-credentials}
    work-dir: ${APP_PLATFORM_PULL_WORK_DIR:/app/platform-pull-work}
    # 单脚本最长执行时间；彩食鲜 export 轮询最坏 ~100s，留足余量。
    script-timeout: ${APP_PLATFORM_PULL_SCRIPT_TIMEOUT:PT10M}
    # 刷新默认拉取窗口（到今天为止的天数）。
    default-days: ${APP_PLATFORM_PULL_DEFAULT_DAYS:30}
  scheduled-pull:
    # 定时三平台拉取：每天 09:00 与 18:00 各一次。仍受 app.scheduling.enabled 总开关管，
    # 关掉全局调度时本特性也不会跑。
    enabled: ${SCHEDULED_PULL_ENABLED:true}
    # 时间表进配置，不写死在代码里。Spring cron 六段：秒 分 时 日 月 周。
    morning-cron: ${SCHEDULED_PULL_MORNING_CRON:0 0 9 * * *}
    evening-cron: ${SCHEDULED_PULL_EVENING_CRON:0 0 18 * * *}
    zone: ${SCHEDULED_PULL_ZONE:Asia/Shanghai}
    auto-ship:
      # 独立开关：关掉它只停自动发货，定时拉取照常。
      #
      # **默认 false 是刻意的**。确认发货会向京东建真实出库单，是花真钱的动作，
      # 不该因为「升了个版本」就自己开始跑。打开它需要两件事同时做到：
      #   1. SCHEDULED_AUTO_SHIP_ENABLED=true
      #   2. 把 system:scheduled-pull 加进 JD_OUTBOUND_AUTHORIZED_OPERATORS
      # 第 2 条不是本特性发明的门闩，是 ShipmentJdOutboundService#requireAuthorized
      # 既有的授权面——「谁能建真单」的裁决权留在配置面，不因为换了入口就放宽。
      enabled: ${SCHEDULED_AUTO_SHIP_ENABLED:false}
      # 单次运行最多自动确认多少个批次：定时任务不该在一次运行里把积压全部发出去，
      # 出了问题的爆炸半径必须有上界。剩余的下一个时段继续。
      batch-limit: ${SCHEDULED_AUTO_SHIP_BATCH_LIMIT:20}
  seed:
    demo-enabled: ${DEMO_SEED_ENABLED:false}
    reference-date: ${DEMO_SEED_REFERENCE_DATE:}
    # 仅测试/开发夹具使用；正式运行环境关闭，避免重启后重建示例商品与 SKU。
    sample-master-data-enabled: ${SAMPLE_MASTER_DATA_ENABLED:true}
    jd-initial-sku-library:
      enabled: ${JD_INITIAL_SKU_LIBRARY_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

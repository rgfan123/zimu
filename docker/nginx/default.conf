map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend_upstream {
    zone backend_upstream 64k;
    server backend:8080 resolve;
}

upstream frontend_upstream {
    zone frontend_upstream 64k;
    server frontend:80 resolve;
}

upstream order_assistant_upstream {
    zone order_assistant_upstream 64k;
    server order-assistant:8765 resolve;
}

upstream metabase_upstream {
    zone metabase_upstream 64k;
    server metabase:3000 resolve;
}

# Kehuzx (customer-follow-up) upstreams and its login rate-limit zone are
# deployment-controlled: not every deployment runs the kehuzx-api/kehuzx-web
# containers (they live on the separately-managed kehuzx-integration network).
# Defining upstream ... resolve on a hostname with nothing listening makes
# nginx retry the resolver forever -- every `valid=10s` cycle above, i.e. an
# error pair roughly every ~10-15s, flooding error_log with "could not be
# resolved" indefinitely. The entrypoint renders this file from KEHUZX_ENABLED
# (default false): empty when off (zero upstream references, zero resolver
# churn), identical to this block when on. See kehuzx.inc for the routes.
include /etc/nginx/kehuzx-upstream.inc;

server {
    # so_keepalive=30s:10s:3: defense-in-depth hardening, not a confirmed fix
    # for anything specific. A public-path idle-reuse probe (光猫 28443 ->
    # 192.168.1.22:80, idle 75s and 150s) came back clean both times, so the
    # "home router's NAT table evicts idle mappings" theory is not what's
    # causing the network failures users have actually hit over the public
    # path -- those trace to a stale browser tab still pointing at a LAN IP,
    # which the frontend's origin-in-error-message fix addresses instead (see
    # frontend/src/api/client.ts NetworkError). Kept anyway as a cheap,
    # harmless precaution: TCP keepalive makes the kernel probe every 30s so
    # any NAT/stateful device along the path sees traffic and won't age out
    # its own connection-tracking entry; a genuinely dead peer is still reaped
    # after 3 failed probes instead of lingering as a zombie socket the
    # browser might try to reuse. Only one server block per listen port may
    # carry a socket option -- this file has exactly one `listen 80` and one
    # `listen 30000`, so this is unambiguous.
    listen 80 so_keepalive=30s:10s:3;
    server_name _;
    # LAN gateway sits behind the Windows host's own port-forwarder (Docker Desktop
    # publishing 0.0.0.0:80), which the browser cannot see through. nginx's stock
    # 65s keepalive_timeout means any pooled client connection idle >=65s (e.g. an
    # operator reading the screen between workbench bursts) gets a hard TCP reset
    # the instant it's reused for the next request -- the reset happens at the
    # kernel level before nginx ever parses a request line, so it produces zero
    # access/error-log entries while the browser's fetch() surfaces it as a raw
    # network failure. Root-caused 2026-08-27 (see docs/research/lan-access-root-
    # cause-2026-08-27.md): idle=63s reused clean, idle=66s+ reset 10/10 trials.
    # Widening the timeout doesn't eliminate the race (any finite value still has
    # an edge), but it moves the trigger from "any >65s gap" to "5+ minutes of
    # total silence across every pooled connection", which realistic click-to-
    # click pacing rarely reaches. Do not lower this back down.
    keepalive_timeout 300s;
    # Edge Basic Auth is deployment-controlled: the entrypoint renders
    # /etc/nginx/edge-auth.inc from GATEWAY_BASIC_AUTH_ENABLED (default on).
    # /healthz and /wecom/callbacks/ stay open via their own location-level
    # auth_basic off below; everything else on this server requires credentials.
    include /etc/nginx/edge-auth.inc;

    location = /healthz {
        auth_basic off;
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Enterprise WeChat cannot present the management Basic Auth credentials.
    # The callback authenticates itself with msg_signature instead.
    location /wecom/callbacks/ {
        auth_basic off;
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Operator "";
        proxy_set_header Authorization "";
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The edge requires valid gateway Basic credentials (default on); Nginx then
        # supplies the backend-authenticated operator required by unsafe APIs.
        include /etc/nginx/backend-auth.inc;
        # 三平台订单刷新（platform-pull）会同步执行拉取脚本（彩食鲜 export 轮询最坏 ~100s），
        # 放宽读超时避免网关提前 504。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /internal/ {
        return 404;
    }

    location = /demo/v1 {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/backend-auth.inc;
    }

    location /demo/v1/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/backend-auth.inc;
    }

    location /actuator/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Operator "local-operator";
        proxy_set_header Authorization "";
    }

    location /customer/v1/order-assistant/ {
        proxy_pass http://order_assistant_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Authenticated-User "local-operator";
        proxy_set_header Authorization "";
        proxy_read_timeout 90s;
    }

    location = /metabase {
        return 302 /metabase/;
    }

    location /metabase/ {
        proxy_pass http://metabase_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Authorization "";
        proxy_read_timeout 180s;
    }

    # Kehuzx routes: deployment-controlled alongside kehuzx-upstream.inc above.
    # Rendered by the entrypoint from KEHUZX_ENABLED (default false); empty
    # when off, so /kehuzx/* simply falls through to location / below on
    # deployments that don't run kehuzx-api/kehuzx-web.
    include /etc/nginx/kehuzx.inc;

    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
    }
}

# MCP 外部 HTTP/SSE 传输面：独立端口 30000，与业务 Web（listen 80，28443→内部 80）分开——
# 端口隔离本身是一道防线，业务 API 与界面不得从这个端口暴露。这里只认 /mcp 前缀，
# 其余路径一律 404，不转发到任何 upstream。
#
# 不套 Basic Auth：外部 MCP 客户端只会带 Bearer token，鉴权完全交给后端
# app.mcp.http.token 校验（McpHttpTokenAuthenticator）——token 未配置时后端连端点都
# 不会注册。这与 /wecom/callbacks/ 的处理同一套思路：网关放行，业务层自证身份。
server {
    listen 30000;
    server_name _;
    auth_basic off;

    # Streamable HTTP（MCP 2025-03-26）：单端点收 JSON-RPC 请求，也承载可选的 GET SSE 流。
    location = /mcp {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长连接 SSE 需要：关闭响应缓冲让事件立刻下发，放宽读超时避免中途被判死连接，
        # 清空 Connection 头避免和 keepalive 冲突（GET /mcp 建流时走这条路径）。
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
    }

    # 老版 SSE 传输兼容：GET 建流 + POST 发消息（sessionId 关联同一条流）。
    location = /mcp/sse {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
    }

    location = /mcp/messages {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend_upstream {
    zone backend_upstream 64k;
    server backend:8080 resolve;
}

upstream frontend_upstream {
    zone frontend_upstream 64k;
    server frontend:80 resolve;
}

upstream order_assistant_upstream {
    zone order_assistant_upstream 64k;
    server order-assistant:8765 resolve;
}

upstream metabase_upstream {
    zone metabase_upstream 64k;
    server metabase:3000 resolve;
}

upstream kehuzx_api_upstream {
    zone kehuzx_api_upstream 64k;
    server kehuzx-api:8000 resolve;
}

upstream kehuzx_web_upstream {
    zone kehuzx_web_upstream 64k;
    server kehuzx-web:8080 resolve;
}

limit_req_zone $binary_remote_addr zone=kehuzx_login:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    # LAN gateway sits behind the Windows host's own port-forwarder (Docker Desktop
    # publishing 0.0.0.0:80), which the browser cannot see through. nginx's stock
    # 65s keepalive_timeout means any pooled client connection idle >=65s (e.g. an
    # operator reading the screen between workbench bursts) gets a hard TCP reset
    # the instant it's reused for the next request -- the reset happens at the
    # kernel level before nginx ever parses a request line, so it produces zero
    # access/error-log entries while the browser's fetch() surfaces it as a raw
    # network failure. Root-caused 2026-08-27 (see docs/research/lan-access-root-
    # cause-2026-08-27.md): idle=63s reused clean, idle=66s+ reset 10/10 trials.
    # Widening the timeout doesn't eliminate the race (any finite value still has
    # an edge), but it moves the trigger from "any >65s gap" to "5+ minutes of
    # total silence across every pooled connection", which realistic click-to-
    # click pacing rarely reaches.
    keepalive_timeout 300s;
    # Edge Basic Auth is deployment-controlled: the entrypoint renders
    # /etc/nginx/edge-auth.inc from GATEWAY_BASIC_AUTH_ENABLED (default on).
    # /healthz and /wecom/callbacks/ stay open via their own location-level
    # auth_basic off below; everything else on this server requires credentials.
    include /etc/nginx/edge-auth.inc;

    location = /healthz {
        auth_basic off;
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Enterprise WeChat cannot present the management Basic Auth credentials.
    # The callback authenticates itself with msg_signature instead.
    location /wecom/callbacks/ {
        auth_basic off;
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Operator "";
        proxy_set_header Authorization "";
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The edge requires valid gateway Basic credentials (default on); Nginx then
        # supplies the backend-authenticated operator required by unsafe APIs.
        include /etc/nginx/backend-auth.inc;
        # 三平台订单刷新（platform-pull）会同步执行拉取脚本（彩食鲜 export 轮询最坏 ~100s），
        # 放宽读超时避免网关提前 504。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /internal/ {
        return 404;
    }

    location = /demo/v1 {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/backend-auth.inc;
    }

    location /demo/v1/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/backend-auth.inc;
    }

    location /actuator/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Operator "local-operator";
        proxy_set_header Authorization "";
    }

    location /customer/v1/order-assistant/ {
        proxy_pass http://order_assistant_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Authenticated-User "local-operator";
        proxy_set_header Authorization "";
        proxy_read_timeout 90s;
    }

    location = /metabase {
        return 302 /metabase/;
    }

    location /metabase/ {
        proxy_pass http://metabase_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Authorization "";
        proxy_read_timeout 180s;
    }

    location = /kehuzx {
        return 302 /kehuzx/;
    }

    # The UI inherits edge Basic Auth. API calls use Kehuzx Bearer JWT, which
    # cannot share the Authorization header with Basic Auth; only the login
    # endpoint is anonymous and it is independently rate limited.
    location = /kehuzx/api/auth/login {
        auth_basic off;
        limit_req zone=kehuzx_login burst=5 nodelay;
        proxy_pass http://kehuzx_api_upstream/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /kehuzx/api/health {
        proxy_pass http://kehuzx_api_upstream/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /kehuzx/api/ {
        auth_basic off;
        proxy_pass http://kehuzx_api_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /kehuzx/ {
        proxy_pass http://kehuzx_web_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
    }
}
